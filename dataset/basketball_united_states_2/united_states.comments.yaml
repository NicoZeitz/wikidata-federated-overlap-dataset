__database__: NBA basketball database covering United States, including teams and
  games.
nba_franchises:
  __table__: NBA basketball teams based in United States.
  franchise_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  nation: Country the team is based in.
  home_city: City the team is based in.
  location_name: Name of the city the team is based in.
  province: US state or province the team is based in.
  founding_year: Year the team was founded or established.
  home_arena: Home arena or venue of the team.
  coach: Current head coach of the team.
  url: Official website URL of the team.
  followers: Number of social media followers of the team.
nba_contests:
  __table__: NBA basketball games played in United States.
  game: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team1: First participating team.
  away_team: Second participating team.
  away_team_name: Name of the second participating team.
  stadium_name: Name of the venue where the game was played.
  date: Date the game was played.
  crowd: Number of spectators in attendance.
  season: Name or label of the NBA season the game belongs to.

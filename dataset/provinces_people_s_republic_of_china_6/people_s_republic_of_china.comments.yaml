__database__: Provinces database covering China.
china_provinces:
  __table__: Administrative divisions of China.
  region_id: Identifier for the Chinese province or administrative region.
  nation: Country the province belongs to.
  administrative_region_name: Name of the Chinese province or administrative region.
  coords: Geographic coordinates of the province centroid.
  area_km2: Total area of the province in square kilometers.
  number_of_inhabitants: Population of the province (most recent estimate).
  administrative_center: Capital city of the province.
  inception: Date the province was established.
  iso: ISO 3166-2 code of the province (e.g. CN-HE).
  homepage: Official website of the provincial government.

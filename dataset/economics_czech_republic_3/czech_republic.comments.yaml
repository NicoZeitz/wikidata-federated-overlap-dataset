__database__: Economics database covering Czech Republic, including companies.
entities:
  __table__: Business enterprises headquartered in Czech Republic.
  firm_id: Identifier for the company.
  title: Name of the company.
  headquarters_country: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  organizational_form: Legal form or structure of the company.
  inception: Date the company was founded.
  url: Official website URL of the company.
  city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  workers: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  profit_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  market_cap_usd: Market capitalization in US dollars (most recent reported value).

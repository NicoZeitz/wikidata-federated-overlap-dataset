__database__: UEFA Champions League database covering United Kingdom, including clubs,
  matches, and venues.
champions_league_clubs:
  __table__: Football clubs based in United Kingdom that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  title: Full name of the football club.
  league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  start_year: Date or year the club was founded.
  ground: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  sobriquet: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  url: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.
ucl_games:
  __table__: UEFA Champions League matches played in United Kingdom.
  match_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  season_id: Season the match was played in.
  match_date: Date the match was played.
  arena: Venue where the match was played.
  team_a: First participating club.
  second_team: Second participating club.
  winning_team: Winning club (null for draws).
  gate: Number of spectators in attendance.
  referee: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in United Kingdom that hosted UEFA Champions League
    matches.
  stadium_id: Identifier for the venue.
  name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
club_teams:
  __table__: Football clubs based in United Kingdom.
  team_id: Identifier for the football club.
  team_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  country: Country the club is based in.
  start_year: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  title_count: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  acronym: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

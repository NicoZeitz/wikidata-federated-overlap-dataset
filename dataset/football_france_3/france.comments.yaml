__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
football_matches:
  __table__: FIFA World Cup matches played in France.
  game_id: Identifier for the FIFA World Cup match.
  game_name: Name or label of the match.
  game_date: Date the match was played.
  competition: Tournament this match belongs to.
  stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  team_a: First participating team.
  home_goals: Goals scored by team1.
  away_team: Second participating team.
  team2_score: Goals scored by team2.
  champion: Winning team (null for draws).
  audience: Number of spectators in attendance.
  match_referee: Person who refereed the match.
national_squads:
  __table__: National football teams from France.
  team_id: Identifier for the national football team.
  team_name: Name of the team.
  team_country: Country the team represents.
  established: Year the team was founded.
  sobriquet: Comma-separated nicknames of the team.
  ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  skipper: Current team captain.
world_cup_venues:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in France.
  tournament: Identifier for the FIFA World Cup tournament edition.
  competition_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  host_year: Year the tournament was held.
  hosting_country: Host country of the tournament.
  edition_count: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  mascot: Official mascot of the tournament.
  num_participants: Number of teams participating in the tournament.
  cup_winner: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

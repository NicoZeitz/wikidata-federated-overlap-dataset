__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_participants:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  title: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  alias: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  season: Season the match was played in.
  fixture_date: Date the match was played.
  match_venue: Venue where the match was played.
  first_team: First participating club.
  team2: Second participating club.
  winning_team: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  arbiter: Person who refereed the match.
ucl_arenas:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team_id: Identifier for the football club.
  team_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  founding_year: Date or year the club was founded.
  stadium: Name of the club's home stadium.
  alias: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  website: Official website URL of the club.

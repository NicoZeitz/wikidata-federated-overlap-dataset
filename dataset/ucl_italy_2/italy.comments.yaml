__database__: UEFA Champions League database covering Italy, including clubs, matches,
  and venues.
champions_league_clubs:
  __table__: Football clubs based in Italy that participated in the UEFA Champions
    League.
  club_id: Identifier for the football club.
  title: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founded: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  informal_name: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Italy.
  fixture_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  season_id: Season the match was played in.
  ucl_season_name: Name or label of the season.
  game_date: Date the match was played.
  arena: Venue where the match was played.
  home_team: First participating club.
  away_team: Second participating club.
  winner: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  official: Person who refereed the match.
ucl_venues:
  __table__: Stadiums and arenas in Italy that hosted UEFA Champions League matches.
  arena_id: Identifier for the venue.
  label: Name of the venue or stadium.
  host_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
clubs:
  __table__: Football clubs based in Italy.
  team_id: Identifier for the football club.
  label: Full name of the football club.
  league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

__database__: People database covering United Kingdom, including persons, awards,
  and prize records.
individuals:
  __table__: Persons from United Kingdom.
  human_id: Identifier for the person.
  person_name: Full name of the person.
  gender: Sex of the person.
  date_of_birth: Date of birth.
  death_day: Date of death (null if still living or unknown).
  christian_name: Given (first) name of the person.
  paternal_name: Family (last) name of the person.
  nationality: Country of citizenship.
  native_country: Country of birth.
  country: Country associated with the person (citizenship if known, otherwise country
    of birth).
  university: Name of institution where the person studied.
  kids: Number of children the person has.
  siblings: Number of siblings the person has.
decorations:
  __table__: Awards from United Kingdom.
  honor_id: Identifier for the award.
  label: Name of the award.
  country_of_origin: Country the award originates from.
  founded: Year the award was first presented.
  organizer: Organization that confers the award.
  web_address: Official website URL of the award.
person_awards:
  __table__: Records linking persons from United Kingdom to awards they received.
  person: Person who received the award.
  distinction: Award received by the person.
  year_awarded: Year the award was received.

__database__: UEFA Champions League database covering G7 countries, including clubs,
  matches, and venues.
champions_league_teams:
  __table__: Football clubs based in G7 countries that participated in the UEFA Champions
    League.
  team_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  inception: Date or year the club was founded.
  manager: Name of the current head coach or manager.
  ownership: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  founder: Name of the person or entity who founded the club.
champions_league_matches:
  __table__: UEFA Champions League matches played in G7 countries.
  match: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  competition_season: Name or label of the season.
  played_on: Date the match was played.
  venue: Venue where the match was played.
  team_a: First participating club.
  second_team: Second participating club.
  winner: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  match_referee: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in G7 countries that hosted UEFA Champions League
    matches.
  arena_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in G7 countries.
  team_id: Identifier for the football club.
  label: Full name of the football club.
  division: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founded: Date or year the club was founded.
  head_coach: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  acronym: Short or abbreviated name of the club.
  founder: Name of the person or entity who founded the club.

__database__: UEFA Champions League database covering Spain, including clubs, matches,
  and venues.
ucl_clubs:
  __table__: Football clubs based in Spain that participated in the UEFA Champions
    League.
  organization_id: Identifier for the football club.
  title: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  start_year: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  founding_person: Name of the person or entity who founded the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Spain.
  game_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  competition_season_id: Season the match was played in.
  fixture_date: Date the match was played.
  venue: Venue where the match was played.
  team_a: First participating club.
  team_b: Second participating club.
  victor: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in Spain that hosted UEFA Champions League matches.
  venue: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  venue_architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Spain.
  club_id: Identifier for the football club.
  team_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  arena: Name of the club's home stadium.
  head_coach: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

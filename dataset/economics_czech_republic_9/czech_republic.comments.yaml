__database__: Economics database covering Czech Republic, including companies.
businesses:
  __table__: Business enterprises headquartered in Czech Republic.
  company: Identifier for the company.
  trade_name: Name of the company.
  country: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  legal_structure: Legal form or structure of the company.
  inception: Date the company was founded.
  city: City where the company is headquartered.
  chief_executive: Current chief executive officer.
  workforce_size: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  trading_profit_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

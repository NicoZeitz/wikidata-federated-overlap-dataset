__database__: Aviation database covering Global North, including airports, airlines,
  aircraft, and accidents.
terminals:
  __table__: Airports located in Global North.
  aerodrome_id: Identifier for the airport.
  airfield_name: Name of the airport.
  iata_code: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  height_metres: Elevation of the airport above sea level in meters.
  throughput: Annual passenger count (most recent reported value).
  surface_area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  founded: Date the airport was opened or established.
  coords: Geographic coordinates of the airport.
  city: City the airport serves.
  airport_country: Country the airport is located in.
air_transport_companies:
  __table__: Airlines headquartered in Global North.
  carrier_id: Identifier for the airline.
  name: Name of the airline.
  nation: Country where the airline is headquartered.
  start_date: Date the airline was founded.
  number_of_employees: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  parent: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  three_letter_code: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  hub: A hub airport of the airline.
airplanes:
  __table__: Individual aircraft operated by airlines based in Global North.
  aircraft_id: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  carrier: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  aircraft_type: Aircraft model type (e.g. Boeing 737-800).
  maker: Manufacturer of the aircraft.
  first_flight_date: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  flight_speed_kmh: Cruise speed in kilometers per hour.
  wingspan: Wingspan in meters.
  aircraft_length_m: Length of the aircraft in meters.
  max_gross_weight_kg: Maximum takeoff weight in kilograms.
crashes:
  __table__: Aviation accidents involving airlines that occurred in Global North.
  crash_id: Identifier for the aviation accident.
  name: Name or description of the accident.
  operator: Airline involved in the accident.
  crash_country: Country where the accident occurred.
  accident_date: Date of the accident.
  dead: Number of fatalities in the accident.
  survived: Number of survivors.
  flight_code: Flight number of the aircraft involved.

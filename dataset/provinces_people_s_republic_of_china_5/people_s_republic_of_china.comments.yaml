__database__: Provinces database covering China.
china_provinces:
  __table__: Administrative divisions of China.
  province_id: Identifier for the Chinese province or administrative region.
  country: Country the province belongs to.
  administrative_region_name: Name of the Chinese province or administrative region.
  coords: Geographic coordinates of the province centroid.
  total_area_km2: Total area of the province in square kilometers.
  inhabitants: Population of the province (most recent estimate).
  province_capital: Capital city of the province.
  founded: Date the province was established.

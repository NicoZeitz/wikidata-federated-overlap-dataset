__database__: Football database covering Worldwide, including matches, teams, venues,
  and tournaments.
world_cup_fixtures:
  __table__: FIFA World Cup matches played in Worldwide.
  match_id: Identifier for the FIFA World Cup match.
  name: Name or label of the match.
  played_on: Date the match was played.
  cup_edition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  match_venue: Venue where the match was played.
  team_a: First participating team.
  team_a_score: Goals scored by team1.
  away_team: Second participating team.
  team2_goals: Goals scored by team2.
  victor: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  arbiter: Person who refereed the match.
teams:
  __table__: National football teams from Worldwide.
  squad_id: Identifier for the national football team.
  national_team_name: Name of the team.
  nation: Country the team represents.
  established: Year the team was founded.
  local_name: Official name of the team in its native language.
  byname: Comma-separated nicknames of the team.
  ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  head_coach: Current head coach of the team.
  skipper: Current team captain.
football_stadiums:
  __table__: Stadiums and arenas in Worldwide that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  building_architect: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in Worldwide.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  participants: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

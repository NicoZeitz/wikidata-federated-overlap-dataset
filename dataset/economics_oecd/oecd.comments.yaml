__database__: Economics database covering OECD, including companies.
companies_list:
  __table__: Business enterprises headquartered in OECD.
  company_id: Identifier for the company.
  business_name: Name of the company.
  home_country: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  established: Date the company was founded.
  url: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  ceo_person: Current chief executive officer.
  workers: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).
  valuation_usd: Market capitalization in US dollars (most recent reported value).

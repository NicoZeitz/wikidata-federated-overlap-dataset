__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
nations:
  __table__: Sovereign countries in Worldwide.
  country_id: Identifier for the country.
  label: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  number_of_inhabitants: Population of the country (most recent estimate).
  gross_domestic_product: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city_id: Capital city.
  legal_tender: Name of the official currency.
  centroid: Geographic coordinates of the country centroid.
  founding_date: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  dial_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  longevity: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  natality_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  reserve_bank: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  chief_of_state: Current head of state of the country.
  government_leader: Current head of government of the country.
landmasses:
  __table__: Continents covering Worldwide.
  id: Identifier for the continent.
  label: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  total_population: Total population of the continent (most recent estimate).
  lat_lon: Geographic coordinates of the continent centroid.
  highest_point: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  depression_depth_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
towns:
  __table__: Cities and human settlements located in Worldwide.
  municipality_id: Identifier for the city.
  settlement_name: Name of the city.
  country: Country the city is located in.
  inhabitants: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  postcode: Postal or ZIP code of the city.
  mean_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

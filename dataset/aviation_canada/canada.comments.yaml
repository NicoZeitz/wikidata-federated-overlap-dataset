__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
airports:
  __table__: Airports located in Canada.
  airport_id: Identifier for the airport.
  terminal_name: Name of the airport.
  three_letter_code: IATA three-letter airport code.
  altitude_m: Elevation of the airport above sea level in meters.
  passenger_count: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  inception: Date the airport was opened or established.
  lat_lon: Geographic coordinates of the airport.
  served_city: City the airport serves.
  airport_country: Country the airport is located in.
air_transport_companies:
  __table__: Airlines headquartered in Canada.
  airline: Identifier for the airline.
  name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  founded: Date the airline was founded.
  workforce_size: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  total_aircraft: Number of aircraft in the fleet.
  owner: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  homepage: Official website of the airline.
  hub_airport: A hub airport of the airline.
aircraft_fleet:
  __table__: Individual aircraft operated by airlines based in Canada.
  aircraft_id: Identifier for the aircraft.
  label: Name or registration of the aircraft.
  operating_carrier: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  plane_type: Aircraft model type (e.g. Boeing 737-800).
  aircraft_manufacturer: Manufacturer of the aircraft.
  debut_flight: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  cruise_speed_kmh: Cruise speed in kilometers per hour.
  wing_width_m: Wingspan in meters.
  length: Length of the aircraft in meters.
  gross_weight_kg: Maximum takeoff weight in kilograms.
aviation_disasters:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  accident_id: Identifier for the aviation accident.
  incident_name: Name or description of the accident.
  operator: Airline involved in the accident.
  crash_country: Country where the accident occurred.
  crash_date: Date of the accident.
  casualties: Number of fatalities in the accident.
  alive: Number of survivors.
  flight_code: Flight number of the aircraft involved.

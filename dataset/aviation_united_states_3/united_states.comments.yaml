__database__: Aviation database covering United States, including airports, airlines,
  aircraft, and accidents.
aerodromes:
  __table__: Airports located in United States.
  airport_id: Identifier for the airport.
  aerodrome_name: Name of the airport.
  airport_code: IATA three-letter airport code.
  icao_identifier: ICAO four-letter airport code.
  elevation_m: Elevation of the airport above sea level in meters.
  pax: Annual passenger count (most recent reported value).
  total_area_km2: Total area of the airport in square kilometers.
  gmt_offset: UTC offset of the airport's timezone in hours.
  lat_lon: Geographic coordinates of the airport.
  city: City the airport serves.
  host_country: Country the airport is located in.
flight_operators:
  __table__: Airlines headquartered in United States.
  carrier_id: Identifier for the airline.
  operator_name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  start_date: Date the airline was founded.
  personnel_count: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent: Parent company or holding group.
  iata_code: IATA airline designator code (2-letter).
  icao_designator: ICAO airline designator code (3-letter).
  head_office: City or location where the airline is headquartered.
  website: Official website of the airline.
  base_airport: A hub airport of the airline.
aircraft_fleet:
  __table__: Individual aircraft operated by airlines based in United States.
  identifier: Identifier for the aircraft.
  name_registration: Name or registration of the aircraft.
  airline: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  model_type: Aircraft model type (e.g. Boeing 737-800).
  manufacturer_name: Manufacturer of the aircraft.
  first_flight_date: Date of the aircraft's first flight.
  seat_count: Maximum passenger capacity.
  flight_speed_kmh: Cruise speed in kilometers per hour.
  wing_width_m: Wingspan in meters.
  length_m: Length of the aircraft in meters.
  takeoff_weight_kg: Maximum takeoff weight in kilograms.
aviation_accidents:
  __table__: Aviation accidents involving airlines that occurred in United States.
  event_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  airline: Airline involved in the accident.
  country: Country where the accident occurred.
  event_date: Date of the accident.
  victims: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.

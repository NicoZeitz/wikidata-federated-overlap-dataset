__database__: UEFA Champions League database covering Italy, including clubs, matches,
  and venues.
champions_league_clubs:
  __table__: Football clubs based in Italy that participated in the UEFA Champions
    League.
  team: Identifier for the football club.
  title: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founded: Date or year the club was founded.
  stadium: Name of the club's home stadium.
  owner: Name of the current owner or ownership group.
  championships: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  website: Official website URL of the club.
  founder: Name of the person or entity who founded the club.
ucl_fixtures:
  __table__: UEFA Champions League matches played in Italy.
  game_id: Identifier for the UEFA Champions League match.
  fixture_name: Name or label of the match.
  season: Season the match was played in.
  played_on: Date the match was played.
  ground: Venue where the match was played.
  team1: First participating club.
  team2: Second participating club.
  winning_team: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  referee: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Italy that hosted UEFA Champions League matches.
  arena_id: Identifier for the venue.
  title: Name of the venue or stadium.
  nation: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Italy.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  owner: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  founding_person: Name of the person or entity who founded the club.

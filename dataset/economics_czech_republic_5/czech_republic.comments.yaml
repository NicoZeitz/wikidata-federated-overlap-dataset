__database__: Economics database covering Czech Republic, including companies.
corporations:
  __table__: Business enterprises headquartered in Czech Republic.
  corporation_id: Identifier for the company.
  name: Name of the company.
  nation: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  industries: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  established: Date the company was founded.
  website: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  ceo_person: Current chief executive officer.
  workers: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  trading_profit_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

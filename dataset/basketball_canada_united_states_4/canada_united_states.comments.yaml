__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_squads:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  franchise_name: Full name of the NBA team.
  base_country: Country the team is based in.
  team_city: City the team is based in.
  home_city_name: Name of the city the team is based in.
  state: US state or province the team is based in.
  founded: Year the team was founded or established.
  stadium: Home arena or venue of the team.
  trainer: Current head coach of the team.
  owner: Name of the current owner or ownership group.
  homepage: Official website URL of the team.
  online_followers: Number of social media followers of the team.
nba_matches:
  __table__: NBA basketball games played in Canada + United States.
  contest_id: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  first_team: First participating team.
  team1Label: Name of the first participating team.
  team2: Second participating team.
  winner: Name of the winning team.
  date: Date the game was played.
  audience: Number of spectators in attendance.
  competition_season: Name or label of the NBA season the game belongs to.

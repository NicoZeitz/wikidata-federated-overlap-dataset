__database__: People database covering France, including persons, awards, and prize
  records.
public_figures:
  __table__: Persons from France.
  human_id: Identifier for the person.
  display_name: Full name of the person.
  sex_at_birth: Sex of the person.
  dob: Date of birth.
  died: Date of death (null if still living or unknown).
  given_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  passport_country: Country of citizenship.
  native_country: Country of birth.
  home_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  number_of_children: Number of children the person has.
  siblings: Number of siblings the person has.
distinctions:
  __table__: Awards from France.
  award_id: Identifier for the award.
  prize_name: Name of the award.
  origin_country: Country the award originates from.
  inception: Year the award was first presented.
  named_after: Person or entity the award is named after.
person_awards:
  __table__: Records linking persons from France to awards they received.
  awardee: Person who received the award.
  award_id: Award received by the person.
  award_year: Year the award was received.

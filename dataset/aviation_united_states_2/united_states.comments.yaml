__database__: Aviation database covering United States, including airports, airlines,
  aircraft, and accidents.
airfields:
  __table__: Airports located in United States.
  airport: Identifier for the airport.
  terminal_name: Name of the airport.
  iata_code: IATA three-letter airport code.
  icao_code: ICAO four-letter airport code.
  elevation_metres: Elevation of the airport above sea level in meters.
  passenger_traffic: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  time_zone_offset: UTC offset of the airport's timezone in hours.
  inception: Date the airport was opened or established.
  location: Geographic coordinates of the airport.
  served_city: City the airport serves.
  host_country: Country the airport is located in.
carriers:
  __table__: Airlines headquartered in United States.
  carrier_id: Identifier for the airline.
  title: Name of the airline.
  hq_country: Country where the airline is headquartered.
  inception: Date the airline was founded.
  staff_count: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent: Parent company or holding group.
  airline_code_iata: IATA airline designator code (2-letter).
  three_letter_code: ICAO airline designator code (3-letter).
  head_office: City or location where the airline is headquartered.
  website: Official website of the airline.
  hub_airport: A hub airport of the airline.
fleet:
  __table__: Individual aircraft operated by airlines based in United States.
  aircraft: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  carrier: Airline operating the aircraft.
  country: Country of the operating airline.
  type_designation: Aircraft model type (e.g. Boeing 737-800).
  manufacturer_name: Manufacturer of the aircraft.
  inaugural_flight: Date of the aircraft's first flight.
  seating_capacity: Maximum passenger capacity.
  flight_speed_kmh: Cruise speed in kilometers per hour.
  length: Length of the aircraft in meters.
  max_weight_kg: Maximum takeoff weight in kilograms.
plane_crashes:
  __table__: Aviation accidents involving airlines that occurred in United States.
  event_id: Identifier for the aviation accident.
  event_name: Name or description of the accident.
  carrier: Airline involved in the accident.
  country: Country where the accident occurred.
  event_date: Date of the accident.
  casualties: Number of fatalities in the accident.
  survivors: Number of survivors.
  flight_code: Flight number of the aircraft involved.

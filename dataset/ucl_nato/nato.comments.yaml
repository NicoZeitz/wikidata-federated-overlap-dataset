__database__: UEFA Champions League database covering NATO countries, including clubs,
  matches, and venues.
ucl_clubs:
  __table__: Football clubs based in NATO countries that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  label: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  start_year: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  head_coach: Name of the current head coach or manager.
  nickname: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  website: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in NATO countries.
  match_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  season: Season the match was played in.
  competition_season: Name or label of the season.
  fixture_date: Date the match was played.
  ground: Venue where the match was played.
  team_a: First participating club.
  away_team: Second participating club.
  winner: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in NATO countries that hosted UEFA Champions League
    matches.
  stadium_id: Identifier for the venue.
  name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in NATO countries.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  sobriquet: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  homepage: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.

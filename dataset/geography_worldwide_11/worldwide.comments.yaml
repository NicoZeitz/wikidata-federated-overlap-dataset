__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in Worldwide.
  nation_id: Identifier for the country.
  state_name: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city: Capital city.
  monetary_unit: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  number_of_males: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  life_exp: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  monetary_authority: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  westernmost_coords: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  head_of_state_name: Current head of state of the country.
  government_leader: Current head of government of the country.
continents:
  __table__: Continents covering Worldwide.
  id: Identifier for the continent.
  name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  residents: Total population of the continent (most recent estimate).
  coords: Geographic coordinates of the continent centroid.
  highest_peak: Name of the highest geographical point on the continent.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  school_dropout_children: Estimated number of school-age children not enrolled in
    school.
  m49_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northernmost_point: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
conurbations:
  __table__: Cities and human settlements located in Worldwide.
  settlement_id: Identifier for the city.
  city_name: Name of the city.
  home_country: Country the city is located in.
  population: Population of the city (most recent estimate).
  location: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.

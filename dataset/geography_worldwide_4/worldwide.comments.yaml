__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
republics:
  __table__: Sovereign countries in Worldwide.
  state_id: Identifier for the country.
  country_name: Name of the country.
  iso2_code: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  total_area_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital: Capital city.
  currency_name: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  number_of_males: Male population count (most recent estimate).
  population_female: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  jobless_rate: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  median_income: Median household or personal income in US dollars.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  national_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  official_languages: Comma-separated official languages of the country.
  state_leader: Current head of state of the country.
  premier: Current head of government of the country.
continents:
  __table__: Continents covering Worldwide.
  identifier: Identifier for the continent.
  landmass_name: Name of the continent.
  surface_area_km2: Total land area of the continent in square kilometers.
  inhabitants: Total population of the continent (most recent estimate).
  geo_coords: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  minimum_elevation_point: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populated_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
towns:
  __table__: Cities and human settlements located in Worldwide.
  city: Identifier for the city.
  settlement_name: Name of the city.
  nation: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  nickname: Comma-separated informal names or nicknames of the city.
  mailing_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

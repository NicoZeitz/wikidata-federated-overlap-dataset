__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
states:
  __table__: Sovereign countries in Worldwide.
  nation_id: Identifier for the country.
  nation: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city_id: Capital city.
  currency: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  founding_date: Date the country was founded or became independent.
  full_name: Official name of the country in English.
  country_code_phone: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  jobless_rate: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  crude_birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank_name: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  depression_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  government_leader: Current head of government of the country.
world_regions:
  __table__: Continents covering Worldwide.
  continent: Identifier for the continent.
  continent_name: Name of the continent.
  area: Total land area of the continent in square kilometers.
  inhabitants: Total population of the continent (most recent estimate).
  lat_lon: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  summit_elevation_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  depression_depth_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in Worldwide.
  settlement_id: Identifier for the city.
  settlement_name: Name of the city.
  city_country: Country the city is located in.
  population: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  gross_domestic_product: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation_m: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.
  car_ownership_rate: Number of registered motor vehicles per thousand inhabitants.

__database__: German states database covering Germany.
bundesland_table:
  __table__: The 16 German federal states (Bundesländer).
  region_id: Identifier for the German federal state.
  country: Country the federal state belongs to.
  region_name: Name of the German federal state.
  location: Geographic coordinates of the state centroid.
  size_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  established: Date the state was established or re-established.

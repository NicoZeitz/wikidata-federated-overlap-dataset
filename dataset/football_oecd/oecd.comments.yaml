__database__: Football database covering OECD, including matches, teams, venues, and
  tournaments.
world_cup_matches:
  __table__: FIFA World Cup matches played in OECD.
  match_id: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  kickoff_date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  home_team: First participating team.
  goals_team1: Goals scored by team1.
  away_team: Second participating team.
  team2_score: Goals scored by team2.
  winner: Winning team (null for draws).
  audience: Number of spectators in attendance.
  umpire: Person who refereed the match.
squads:
  __table__: National football teams from OECD.
  team_id: Identifier for the national football team.
  national_team_name: Name of the team.
  represented_country: Country the team represents.
  founding_year: Year the team was founded.
  local_name: Official name of the team in its native language.
  nickname: Comma-separated nicknames of the team.
  current_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  coach: Current head coach of the team.
  team_captain: Current team captain.
arenas:
  __table__: Stadiums and arenas in OECD that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  name: Name of the venue or stadium.
  country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
world_cup_editions:
  __table__: FIFA World Cup tournaments held in OECD.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  host_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  participants: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

__database__: German states database covering Germany.
german_administrative_regions:
  __table__: The 16 German federal states (Bundesländer).
  german_state: Identifier for the German federal state.
  country: Country the federal state belongs to.
  federal_state_name: Name of the German federal state.
  geo_coords: Geographic coordinates of the state centroid.
  size_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  capital: Capital city of the state.
  founding_date: Date the state was established or re-established.
  iso: ISO 3166-2 code of the state (e.g. DE-BY).

__database__: UEFA Champions League database covering Worldwide, including clubs,
  matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Worldwide that participated in the UEFA Champions
    League.
  team_id: Identifier for the football club.
  name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  byname: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Worldwide.
  game_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  season_id: Season the match was played in.
  competition_season: Name or label of the season.
  game_date: Date the match was played.
  arena: Venue where the match was played.
  first_team: First participating club.
  away_team: Second participating club.
  match_winner: Winning club (null for draws).
  spectators: Number of spectators in attendance.
  arbiter: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Worldwide that hosted UEFA Champions League matches.
  venue_id: Identifier for the venue.
  name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  venue_architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Worldwide.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  established: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  sobriquet: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.

__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  franchise_id: Identifier for the NBA team.
  team_name: Full name of the NBA team.
  country: Country the team is based in.
  team_city: City the team is based in.
  home_city_name: Name of the city the team is based in.
  us_state: US state or province the team is based in.
  established: Year the team was founded or established.
  home_arena: Home arena or venue of the team.
  coach: Current head coach of the team.
  franchise_owner: Name of the current owner or ownership group.
  website: Official website URL of the team.
  social_media_followers: Number of social media followers of the team.
nba_matches:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  home_team: First participating team.
  first_team_name: Name of the first participating team.
  team2: Second participating team.
  second_team_name: Name of the second participating team.
  winning_team: Name of the winning team.
  arena_name: Name of the venue where the game was played.
  game_date: Date the game was played.
  attendance: Number of spectators in attendance.
  seasonLabel: Name or label of the NBA season the game belongs to.

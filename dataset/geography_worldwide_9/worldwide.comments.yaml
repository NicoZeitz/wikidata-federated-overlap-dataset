__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
territories:
  __table__: Sovereign countries in Worldwide.
  country_id: Identifier for the country.
  title: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  continent_id: Continent the country belongs to.
  surface_area_km2: Total area of the country in square kilometers.
  people: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  seat_of_government: Capital city.
  currency_name: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  telephone_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  mortality_rate: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  reserve_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  national_languages: Comma-separated official languages of the country.
  head_of_state_name: Current head of state of the country.
  premier: Current head of government of the country.
world_divisions:
  __table__: Continents covering Worldwide.
  continent: Identifier for the continent.
  landmass_name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  residents: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populated_city: Most populous urban area on the continent.
  school_dropout_children: Estimated number of school-age children not enrolled in
    school.
  m49_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
cities:
  __table__: Cities and human settlements located in Worldwide.
  city_id: Identifier for the city.
  name: Name of the city.
  city_country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  mailing_code: Postal or ZIP code of the city.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.
  vehicle_density: Number of registered motor vehicles per thousand inhabitants.

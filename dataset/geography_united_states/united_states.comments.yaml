__database__: Geographic database covering United States, including countries, continents,
  and cities.
kingdoms:
  __table__: Sovereign countries in United States.
  state_id: Identifier for the country.
  nation: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  gross_domestic_product: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital: Capital city.
  official_currency: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  official_name: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  average_life_expectancy: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  unemployment_pct: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  birth_rate_per_woman: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_coords: Geographic coordinates of the westernmost point of the country.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  state_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  prime_minister: Current head of government of the country.
world_divisions:
  __table__: Continents covering United States.
  continent_id: Identifier for the continent.
  region_name: Name of the continent.
  land_area_km2: Total land area of the continent in square kilometers.
  inhabitants: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  highest_altitude_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  depression_depth_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  unenrolled_children: Estimated number of school-age children not enrolled in school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in United States.
  city_id: Identifier for the city.
  municipality_name: Name of the city.
  nation: Country the city is located in.
  population: Population of the city (most recent estimate).
  location: Geographic coordinates of the city.
  inception: Date or year the city was founded or first recorded.
  postal_code: Postal or ZIP code of the city.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  economic_output: Nominal GDP of the city in US dollars.
  per_capita_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  size_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

__database__: Football database covering Germany, including matches, teams, venues,
  and tournaments.
matches:
  __table__: FIFA World Cup matches played in Germany.
  match: Identifier for the FIFA World Cup match.
  game_name: Name or label of the match.
  played_on: Date the match was played.
  tournament: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  stadium: Venue where the match was played.
  team1: First participating team.
  home_goals: Goals scored by team1.
  second_team: Second participating team.
  team2_score: Goals scored by team2.
  winner: Winning team (null for draws).
  gate: Number of spectators in attendance.
  arbiter: Person who refereed the match.
international_teams:
  __table__: National football teams from Germany.
  team: Identifier for the national football team.
  title: Name of the team.
  represented_country: Country the team represents.
  founded: Year the team was founded.
  official_name: Official name of the team in its native language.
  world_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  leader: Current team captain.
world_cup_venues:
  __table__: Stadiums and arenas in Germany that hosted FIFA World Cup matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
world_cup_editions:
  __table__: FIFA World Cup tournaments held in Germany.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  num_participants: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  goal_count: Total number of goals scored across all matches.

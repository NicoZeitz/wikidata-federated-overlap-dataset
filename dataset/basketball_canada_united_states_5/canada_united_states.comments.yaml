__database__: NBA basketball database covering Canada + United States, including teams
  and games.
basketball_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  franchise_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  home_country: Country the team is based in.
  team_city: City the team is based in.
  location_name: Name of the city the team is based in.
  state: US state or province the team is based in.
  established: Year the team was founded or established.
  home_arena: Home arena or venue of the team.
  trainer: Current head coach of the team.
  proprietor: Name of the current owner or ownership group.
  socialFollowers: Number of social media followers of the team.
basketball_games:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team1: First participating team.
  second_team: Second participating team.
  second_team_name: Name of the second participating team.
  victor: Name of the winning team.
  venueLabel: Name of the venue where the game was played.
  date: Date the game was played.
  crowd_size: Number of spectators in attendance.
  competition_season: Name or label of the NBA season the game belongs to.

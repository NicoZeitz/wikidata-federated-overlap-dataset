__database__: German states database covering Germany.
german_regions:
  __table__: The 16 German federal states (Bundesländer).
  region_id: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  bundesland: Name of the German federal state.
  coords: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  population_count: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  founding_date: Date the state was established or re-established.
  iso_code: ISO 3166-2 code of the state (e.g. DE-BY).

__database__: US states database covering United States.
usa_states:
  __table__: The 50 US states.
  us_state_id: Identifier for the US state.
  nation: Country the state belongs to.
  label: Name of the US state.
  coordinates: Geographic coordinates of the state centroid.
  size_km2: Total area of the state in square kilometers.
  population_count: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  statehood_date: Date the state was admitted to the Union.
  iso_code: ISO 3166-2 code of the state (e.g. US-CA).
  sobriquet: Nickname of the state.
  official_website: Official website of the state government.

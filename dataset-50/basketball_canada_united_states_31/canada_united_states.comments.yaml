__database__: NBA basketball database covering Canada + United States, including teams
  and games.
basketball_teams:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  country: Country the team is based in.
  team_city: City the team is based in.
  cityLabel: Name of the city the team is based in.
  state: US state or province the team is based in.
  founding_date: Year the team was founded or established.
  home_arena: Home arena or venue of the team.
  coach: Current head coach of the team.
  owner: Name of the current owner or ownership group.
  followers: Number of social media followers of the team.
nba_games:
  __table__: NBA basketball games played in Canada + United States.
  contest_id: Identifier for the NBA game.
  host_country: Country the game was played in (always United States).
  home_team: First participating team.
  team1Label: Name of the first participating team.
  away_team: Second participating team.
  winner: Name of the winning team.
  venueLabel: Name of the venue where the game was played.
  date: Date the game was played.
  attendance: Number of spectators in attendance.
  nba_season: Name or label of the NBA season the game belongs to.

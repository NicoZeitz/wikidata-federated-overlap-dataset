__database__: Football database covering Worldwide, including matches, teams, venues,
  and tournaments.
games:
  __table__: FIFA World Cup matches played in Worldwide.
  match: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  played_on: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  first_team: First participating team.
  home_goals: Goals scored by team1.
  second_team: Second participating team.
  team2_goals: Goals scored by team2.
  winner: Winning team (null for draws).
  fans: Number of spectators in attendance.
  umpire: Person who refereed the match.
international_teams:
  __table__: National football teams from Worldwide.
  team: Identifier for the national football team.
  title: Name of the team.
  country: Country the team represents.
  established: Year the team was founded.
  official_name: Official name of the team in its native language.
  sobriquet: Comma-separated nicknames of the team.
  world_ranking: FIFA world ranking of the team.
  competition_class: Competition class or league the team participates in.
  trainer: Current head coach of the team.
  skipper: Current team captain.
grounds:
  __table__: Stadiums and arenas in Worldwide that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  label: Name of the venue or stadium.
  host_country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  architect: Architect who designed the venue.
competitions:
  __table__: FIFA World Cup tournaments held in Worldwide.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition_number: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  tournament_mascot: Official mascot of the tournament.
  qualified_teams: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

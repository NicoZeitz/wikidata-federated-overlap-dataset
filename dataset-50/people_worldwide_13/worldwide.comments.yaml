__database__: People database covering Worldwide, including persons, awards, and prize
  records.
people:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  name: Full name of the person.
  sex_at_birth: Sex of the person.
  birth_date: Date of birth.
  dod: Date of death (null if still living or unknown).
  personal_name: Given (first) name of the person.
  family_name: Family (last) name of the person.
  nationality: Country of citizenship.
  birth_country: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  height_cm: Height of the person in centimeters.
  brothers_and_sisters: Number of siblings the person has.
distinctions:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  distinction_name: Name of the award.
  awarding_country: Country the award originates from.
  founded: Year the award was first presented.
  url: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  honoree: Person who received the award.
  accolade: Award received by the person.
  year_won: Year the award was received.

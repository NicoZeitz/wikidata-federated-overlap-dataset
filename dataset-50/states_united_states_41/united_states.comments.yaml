__database__: US states database covering United States.
american_states:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  nation: Country the state belongs to.
  state_name: Name of the US state.
  coords: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  capital_city: Capital city of the state.
  admission_date: Date the state was admitted to the Union.
  iso_code: ISO 3166-2 code of the state (e.g. US-CA).
  alias: Nickname of the state.
  website: Official website of the state government.

__database__: Aviation database covering Worldwide, including airports, airlines,
  aircraft, and accidents.
aviation_hubs:
  __table__: Airports located in Worldwide.
  airport_id: Identifier for the airport.
  label: Name of the airport.
  iata_code: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  elevation: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  established: Date the airport was opened or established.
  position: Geographic coordinates of the airport.
  city: City the airport serves.
  host_country: Country the airport is located in.
aviation_companies:
  __table__: Airlines headquartered in Worldwide.
  airline_id: Identifier for the airline.
  name: Name of the airline.
  country: Country where the airline is headquartered.
  founded: Date the airline was founded.
  staff_count: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent_company: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  airline_code_icao: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  url: Official website of the airline.
  hub: A hub airport of the airline.
jets:
  __table__: Individual aircraft operated by airlines based in Worldwide.
  identifier: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  air_operator: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  aircraft_variant: Aircraft model type (e.g. Boeing 737-800).
  maker: Manufacturer of the aircraft.
  first_flight_date: Date of the aircraft's first flight.
  total_seats: Maximum passenger capacity.
  cruise_speed: Cruise speed in kilometers per hour.
  wing_span_m: Wingspan in meters.
  body_length_m: Length of the aircraft in meters.
  mtow_kg: Maximum takeoff weight in kilograms.
plane_crashes:
  __table__: Aviation accidents involving airlines that occurred in Worldwide.
  accident: Identifier for the aviation accident.
  name: Name or description of the accident.
  carrier: Airline involved in the accident.
  location_country: Country where the accident occurred.
  accident_date: Date of the accident.
  death_toll: Number of fatalities in the accident.
  survivor_count: Number of survivors.

__database__: Economics database covering Czech Republic, including companies.
entities:
  __table__: Business enterprises headquartered in Czech Republic.
  company: Identifier for the company.
  title: Name of the company.
  home_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  foundation_year: Date the company was founded.
  base_city: City where the company is headquartered.
  chief_executive: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  trading_profit_usd: Operating income in US dollars (most recent reported value).

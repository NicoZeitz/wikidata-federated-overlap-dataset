__database__: Provinces database covering China.
chinese_provinces:
  __table__: Administrative divisions of China.
  province_id: Identifier for the Chinese province or administrative region.
  country: Country the province belongs to.
  region_name: Name of the Chinese province or administrative region.
  geo_coords: Geographic coordinates of the province centroid.
  area: Total area of the province in square kilometers.
  pop: Population of the province (most recent estimate).
  main_city: Capital city of the province.
  established: Date the province was established.
  iso_code: ISO 3166-2 code of the province (e.g. CN-HE).
  url: Official website of the provincial government.

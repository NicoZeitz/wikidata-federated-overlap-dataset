__database__: Football database covering G20 countries, including matches, teams,
  venues, and tournaments.
soccer_matches:
  __table__: FIFA World Cup matches played in G20 countries.
  match: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  match_date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  host_stadium: Venue where the match was played.
  first_team: First participating team.
  team_a_score: Goals scored by team1.
  away_team: Second participating team.
  away_goals: Goals scored by team2.
  victor: Winning team (null for draws).
  crowd_size: Number of spectators in attendance.
  referee: Person who refereed the match.
national_teams:
  __table__: National football teams from G20 countries.
  team: Identifier for the national football team.
  squad_name: Name of the team.
  country: Country the team represents.
  founded: Year the team was founded.
  native_label: Official name of the team in its native language.
  alias: Comma-separated nicknames of the team.
  current_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  manager: Current head coach of the team.
  captain: Current team captain.
world_cup_venues:
  __table__: Stadiums and arenas in G20 countries that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  title: Name of the venue or stadium.
  country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
tournaments:
  __table__: FIFA World Cup tournaments held in G20 countries.
  tournament: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  participants: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

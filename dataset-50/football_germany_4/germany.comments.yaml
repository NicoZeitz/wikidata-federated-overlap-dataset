__database__: Football database covering Germany, including matches, teams, venues,
  and tournaments.
world_cup_fixtures:
  __table__: FIFA World Cup matches played in Germany.
  game_id: Identifier for the FIFA World Cup match.
  match_name: Name or label of the match.
  kickoff_date: Date the match was played.
  competition: Tournament this match belongs to.
  competition_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  team_a: First participating team.
  score_team1: Goals scored by team1.
  second_team: Second participating team.
  score_team2: Goals scored by team2.
  winning_team: Winning team (null for draws).
  fans: Number of spectators in attendance.
  umpire: Person who refereed the match.
national_football_teams:
  __table__: National football teams from Germany.
  team_id: Identifier for the national football team.
  squad_name: Name of the team.
  home_country: Country the team represents.
  established: Year the team was founded.
  byname: Comma-separated nicknames of the team.
  current_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  leader: Current team captain.
venues:
  __table__: Stadiums and arenas in Germany that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in Germany.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

__database__: People database covering Worldwide, including persons, awards, and prize
  records.
famous_people:
  __table__: Persons from Worldwide.
  human_id: Identifier for the person.
  person_name: Full name of the person.
  sex_at_birth: Sex of the person.
  birthday: Date of birth.
  died: Date of death (null if still living or unknown).
  forename: Given (first) name of the person.
  family_name: Family (last) name of the person.
  citizenship: Country of citizenship.
  birth_country: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  educated_at: Name of institution where the person studied.
  stature: Height of the person in centimeters.
  children: Number of children the person has.
  siblings: Number of siblings the person has.
prizes:
  __table__: Awards from Worldwide.
  prize_id: Identifier for the award.
  award_name: Name of the award.
  nation: Country the award originates from.
  founded: Year the award was first presented.
  named_after: Person or entity the award is named after.
  official_website: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  person_id: Person who received the award.
  prize: Award received by the person.
  prize_year: Year the award was received.

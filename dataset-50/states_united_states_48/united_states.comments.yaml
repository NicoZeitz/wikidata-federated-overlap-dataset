__database__: US states database covering United States.
american_regions:
  __table__: The 50 US states.
  state: Identifier for the US state.
  country: Country the state belongs to.
  state_name: Name of the US state.
  coordinates: Geographic coordinates of the state centroid.
  surface_area_km2: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  statehood_date: Date the state was admitted to the Union.
  state_code: ISO 3166-2 code of the state (e.g. US-CA).
  website: Official website of the state government.

__database__: NBA basketball database covering Canada + United States, including teams
  and games.
basketball_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  label: Full name of the NBA team.
  nation: Country the team is based in.
  city: City the team is based in.
  us_state: US state or province the team is based in.
  inception: Year the team was founded or established.
  home_arena: Home arena or venue of the team.
  coach: Current head coach of the team.
  team_owner: Name of the current owner or ownership group.
  followers: Number of social media followers of the team.
basketball_games:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  team1: First participating team.
  home_team_name: Name of the first participating team.
  second_team: Second participating team.
  team2_name: Name of the second participating team.
  winning_team: Name of the winning team.
  match_date: Date the game was played.
  audience: Number of spectators in attendance.
  nba_season: Name or label of the NBA season the game belongs to.

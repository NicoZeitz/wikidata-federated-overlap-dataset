__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  team_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  established: Date or year the club was founded.
  proprietor: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  club_abbreviation: Short or abbreviated name of the club.
  founder: Name of the person or entity who founded the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  fixture_name: Name or label of the match.
  season_name: Name or label of the season.
  date: Date the match was played.
  match_venue: Venue where the match was played.
  team_a: First participating club.
  away_team: Second participating club.
  winner: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  arbiter: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  host_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  club_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founded: Date or year the club was founded.
  arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  informal_name: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  club_founder: Name of the person or entity who founded the club.

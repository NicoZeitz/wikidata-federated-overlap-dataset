__database__: German states database covering Germany.
german_administrative_regions:
  __table__: The 16 German federal states (Bundesländer).
  bundesland_id: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  bundesland: Name of the German federal state.
  geo_coords: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  landeshauptstadt: Capital city of the state.
  founded: Date the state was established or re-established.
  iso_code: ISO 3166-2 code of the state (e.g. DE-BY).
  government_website: Official website of the state government.

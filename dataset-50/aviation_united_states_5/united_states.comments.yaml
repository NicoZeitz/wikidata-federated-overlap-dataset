__database__: Aviation database covering United States, including airports, airlines,
  aircraft, and accidents.
airfields:
  __table__: Airports located in United States.
  aerodrome_id: Identifier for the airport.
  terminal_name: Name of the airport.
  airport_code: IATA three-letter airport code.
  icao_identifier: ICAO four-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  gmt_offset: UTC offset of the airport's timezone in hours.
  inception: Date the airport was opened or established.
  location: Geographic coordinates of the airport.
  city: City the airport serves.
  nation: Country the airport is located in.
aviation_companies:
  __table__: Airlines headquartered in United States.
  carrier_id: Identifier for the airline.
  company_name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  founding_date: Date the airline was founded.
  staff_count: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  fleet_count: Number of aircraft in the fleet.
  parent_company: Parent company or holding group.
  airline_code_iata: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  hq: City or location where the airline is headquartered.
  website: Official website of the airline.
  hub_airport: A hub airport of the airline.
commercial_aircraft:
  __table__: Individual aircraft operated by airlines based in United States.
  aircraft_id: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  operator: Airline operating the aircraft.
  country: Country of the operating airline.
  model_type: Aircraft model type (e.g. Boeing 737-800).
  manufacturer_name: Manufacturer of the aircraft.
  maiden_flight: Date of the aircraft's first flight.
  capacity: Maximum passenger capacity.
  cruise_speed_kmh: Cruise speed in kilometers per hour.
  wing_span_m: Wingspan in meters.
  body_length_m: Length of the aircraft in meters.
  max_gross_weight_kg: Maximum takeoff weight in kilograms.
air_disasters:
  __table__: Aviation accidents involving airlines that occurred in United States.
  event_id: Identifier for the aviation accident.
  crash_name: Name or description of the accident.
  carrier: Airline involved in the accident.
  country: Country where the accident occurred.
  event_date: Date of the accident.
  deaths: Number of fatalities in the accident.
  survivor_count: Number of survivors.

__database__: US states database covering United States.
usa_states:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  country: Country the state belongs to.
  label: Name of the US state.
  lat_lon: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  inception: Date the state was admitted to the Union.
  iso: ISO 3166-2 code of the state (e.g. US-CA).
  alias: Nickname of the state.
  url: Official website of the state government.

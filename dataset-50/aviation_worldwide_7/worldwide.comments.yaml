__database__: Aviation database covering Worldwide, including airports, airlines,
  aircraft, and accidents.
flight_hubs:
  __table__: Airports located in Worldwide.
  airport: Identifier for the airport.
  terminal_name: Name of the airport.
  iata_code: IATA three-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  passengers: Annual passenger count (most recent reported value).
  total_area_km2: Total area of the airport in square kilometers.
  utc_offset: UTC offset of the airport's timezone in hours.
  founded: Date the airport was opened or established.
  coordinates: Geographic coordinates of the airport.
  city_id: City the airport serves.
  country: Country the airport is located in.
air_operators:
  __table__: Airlines headquartered in Worldwide.
  airline_id: Identifier for the airline.
  airline_name: Name of the airline.
  country: Country where the airline is headquartered.
  start_date: Date the airline was founded.
  staff: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  total_aircraft: Number of aircraft in the fleet.
  parent_organization: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  hub_airport: A hub airport of the airline.
flying_machines:
  __table__: Individual aircraft operated by airlines based in Worldwide.
  identifier: Identifier for the aircraft.
  label: Name or registration of the aircraft.
  operating_airline: Airline operating the aircraft.
  country: Country of the operating airline.
  model: Aircraft model type (e.g. Boeing 737-800).
  maker: Manufacturer of the aircraft.
  first_flight: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  fuselage_length_m: Length of the aircraft in meters.
  max_gross_weight_kg: Maximum takeoff weight in kilograms.
incidents:
  __table__: Aviation accidents involving airlines that occurred in Worldwide.
  incident_id: Identifier for the aviation accident.
  accident_name: Name or description of the accident.
  airline: Airline involved in the accident.
  location_country: Country where the accident occurred.
  incident_date: Date of the accident.
  deaths: Number of fatalities in the accident.
  survivor_count: Number of survivors.
  flight: Flight number of the aircraft involved.

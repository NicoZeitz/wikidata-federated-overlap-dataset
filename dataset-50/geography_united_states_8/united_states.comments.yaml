__database__: Geographic database covering United States, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in United States.
  nation_id: Identifier for the country.
  country_name: Name of the country.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  inhabitants: Population of the country (most recent estimate).
  national_income_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city: Capital city.
  currency: Name of the official currency.
  centroid: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  full_name: Official name of the country in English.
  country_code_phone: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  life_exp: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  national_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  government_leader: Current head of government of the country.
geographic_regions:
  __table__: Continents covering United States.
  id: Identifier for the continent.
  continent_name: Name of the continent.
  area: Total land area of the continent in square kilometers.
  total_population: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  highest_point_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in United States.
  city: Identifier for the city.
  city_name: Name of the city.
  home_country: Country the city is located in.
  pop: Population of the city (most recent estimate).
  position: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  post_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  gross_domestic_product: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.

__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_squads:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  name: Full name of the NBA team.
  country: Country the team is based in.
  base_city: City the team is based in.
  city_name: Name of the city the team is based in.
  team_state: US state or province the team is based in.
  founding_year: Year the team was founded or established.
  venue: Home arena or venue of the team.
  manager: Current head coach of the team.
  url: Official website URL of the team.
  online_followers: Number of social media followers of the team.
nba_matches:
  __table__: NBA basketball games played in Canada + United States.
  match_id: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  home_team: First participating team.
  first_team_name: Name of the first participating team.
  team2: Second participating team.
  venue_name: Name of the venue where the game was played.
  match_date: Date the game was played.
  spectators: Number of spectators in attendance.
  competition_season: Name or label of the NBA season the game belongs to.

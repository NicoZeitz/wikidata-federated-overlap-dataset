__database__: People database covering Worldwide, including persons, awards, and prize
  records.
persons:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  display_name: Full name of the person.
  biological_sex: Sex of the person.
  birth_day: Date of birth.
  death_day: Date of death (null if still living or unknown).
  christian_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  country_of_citizenship: Country of citizenship.
  birth_country: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  college: Name of institution where the person studied.
  height_metres: Height of the person in centimeters.
  offspring_count: Number of children the person has.
  brothers_and_sisters: Number of siblings the person has.
awards:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  award_name: Name of the award.
  nation: Country the award originates from.
  founded: Year the award was first presented.
  sponsor: Organization that confers the award.
  named_after: Person or entity the award is named after.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  person_id: Person who received the award.
  honor: Award received by the person.
  award_year: Year the award was received.

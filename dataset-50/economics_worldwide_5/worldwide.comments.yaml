__database__: Economics database covering Worldwide, including companies.
corporations:
  __table__: Business enterprises headquartered in Worldwide.
  company_id: Identifier for the company.
  trade_name: Name of the company.
  nation: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  established: Date the company was founded.
  official_website: Official website URL of the company.
  hq_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  staff: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

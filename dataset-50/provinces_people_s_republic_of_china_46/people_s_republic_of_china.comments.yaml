__database__: Provinces database covering China.
chinese_provinces:
  __table__: Administrative divisions of China.
  province: Identifier for the Chinese province or administrative region.
  country: Country the province belongs to.
  division_name: Name of the Chinese province or administrative region.
  coords: Geographic coordinates of the province centroid.
  surface_area_km2: Total area of the province in square kilometers.
  number_of_inhabitants: Population of the province (most recent estimate).
  provincial_capital: Capital city of the province.
  creation_date: Date the province was established.
  region_code: ISO 3166-2 code of the province (e.g. CN-HE).
  url: Official website of the provincial government.

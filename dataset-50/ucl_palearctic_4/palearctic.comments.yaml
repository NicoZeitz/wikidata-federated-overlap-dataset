__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  sobriquet: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  played_on: Date the match was played.
  stadium: Venue where the match was played.
  team1: First participating club.
  team_b: Second participating club.
  victor: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  arbiter: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  arena_id: Identifier for the venue.
  label: Name of the venue or stadium.
  host_country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
clubs:
  __table__: Football clubs based in Palearctic ecozone.
  organization_id: Identifier for the football club.
  label: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  inception: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  sobriquet: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

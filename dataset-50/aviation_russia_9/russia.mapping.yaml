air_hubs:
  source: airports
  columns:
    airport_id: airport
    terminal_name: name
    airport_code: iata_code
    four_letter_code: icao_code
    elevation: elevation_m
    passenger_traffic: passengers
    surface_area_km2: airport_area_km2
    gmt_offset: timezone_offset
    inception: inception
    coordinates: coords
    serving_city: city
    airport_country: country
flight_operators:
  source: airlines
  columns:
    carrier_id: airline
    company_name: name
    country: country
    founding_date: inception
    employee_count: employees
    revenue_usd: revenue_usd
    planes: fleet_size
    holding_company: parent_company

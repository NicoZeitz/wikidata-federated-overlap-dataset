  columns:
    plane_id: aircraft
    name_registration: name
    operating_carrier: operator
    operator_country: country
    aircraft_model: model
    aircraft_manufacturer: manufacturer
    maiden_flight: first_flight
    total_seats: max_passengers
    speed: cruise_speed_kmh
    wingspan_m: wingspan_m
    length_m: length_m
    max_gross_weight_kg: max_takeoff_weight_kg
aviation_accidents:
  source: accidents
  columns:
    incident_id: accident
    incident_name: name
    operator: airline
    country_of_occurrence: country

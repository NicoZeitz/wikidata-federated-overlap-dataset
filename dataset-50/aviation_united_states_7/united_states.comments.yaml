__database__: Aviation database covering United States, including airports, airlines,
  aircraft, and accidents.
airfields:
  __table__: Airports located in United States.
  aerodrome_id: Identifier for the airport.
  airfield_name: Name of the airport.
  iata_identifier: IATA three-letter airport code.
  icao_code: ICAO four-letter airport code.
  elevation: Elevation of the airport above sea level in meters.
  passengers: Annual passenger count (most recent reported value).
  airport_area_km2: Total area of the airport in square kilometers.
  timezone_offset: UTC offset of the airport's timezone in hours.
  founded: Date the airport was opened or established.
  lat_lon: Geographic coordinates of the airport.
  nearest_city: City the airport serves.
  airport_country: Country the airport is located in.
flight_operators:
  __table__: Airlines headquartered in United States.
  airline: Identifier for the airline.
  name: Name of the airline.
  nation: Country where the airline is headquartered.
  founding_date: Date the airline was founded.
  personnel_count: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  owner: Parent company or holding group.
  iata_code: IATA airline designator code (2-letter).
  airline_code_icao: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  url: Official website of the airline.
  primary_hub: A hub airport of the airline.
commercial_aircraft:
  __table__: Individual aircraft operated by airlines based in United States.
  plane_id: Identifier for the aircraft.
  name: Name or registration of the aircraft.
  operator: Airline operating the aircraft.
  registration_country: Country of the operating airline.
  aircraft_model: Aircraft model type (e.g. Boeing 737-800).
  builder: Manufacturer of the aircraft.
  debut_flight: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  wing_span_m: Wingspan in meters.
  aircraft_length_m: Length of the aircraft in meters.
  max_weight_kg: Maximum takeoff weight in kilograms.
plane_crashes:
  __table__: Aviation accidents involving airlines that occurred in United States.
  accident_id: Identifier for the aviation accident.
  title: Name or description of the accident.
  operator: Airline involved in the accident.
  country_of_occurrence: Country where the accident occurred.
  crash_date: Date of the accident.
  fatality_count: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.
  flight_designation: Flight number of the aircraft involved.

__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  title: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  start_year: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  head_coach: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  competition_season_id: Season the match was played in.
  competition_season: Name or label of the season.
  played_on: Date the match was played.
  ground: Venue where the match was played.
  first_team: First participating club.
  team2: Second participating club.
  winner: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  referee: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  label: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  designer: Architect who designed the venue.
club_teams:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  website: Official website URL of the club.
  short_name: Short or abbreviated name of the club.

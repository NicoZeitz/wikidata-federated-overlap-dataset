__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
soccer_matches:
  __table__: FIFA World Cup matches played in France.
  match: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  match_date: Date the match was played.
  tournament: Tournament this match belongs to.
  phase: Stage of the tournament (e.g. group stage, quarterfinal, final).
  host_stadium: Venue where the match was played.
  home_team: First participating team.
  goals_team1: Goals scored by team1.
  away_team: Second participating team.
  team2_goals: Goals scored by team2.
  champion: Winning team (null for draws).
  fans: Number of spectators in attendance.
  match_referee: Person who refereed the match.
national_football_teams:
  __table__: National football teams from France.
  team: Identifier for the national football team.
  label: Name of the team.
  nation: Country the team represents.
  founding_date: Year the team was founded.
  local_name: Official name of the team in its native language.
  rank: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  head_coach: Current head coach of the team.
  captain: Current team captain.
grounds:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
tournaments:
  __table__: FIFA World Cup tournaments held in France.
  edition_id: Identifier for the FIFA World Cup tournament edition.
  tournament_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  tournament_mascot: Official mascot of the tournament.
  qualified_teams: Number of teams participating in the tournament.
  winning_team: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  goal_count: Total number of goals scored across all matches.

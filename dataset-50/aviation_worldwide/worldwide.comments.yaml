__database__: Aviation database covering Worldwide, including airports, airlines,
  aircraft, and accidents.
air_hubs:
  __table__: Airports located in Worldwide.
  aerodrome_id: Identifier for the airport.
  label: Name of the airport.
  iata_code: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  time_zone_offset: UTC offset of the airport's timezone in hours.
  established: Date the airport was opened or established.
  coords: Geographic coordinates of the airport.
  city: City the airport serves.
  country: Country the airport is located in.
air_transport_companies:
  __table__: Airlines headquartered in Worldwide.
  airline: Identifier for the airline.
  label: Name of the airline.
  hq_country: Country where the airline is headquartered.
  foundation_date: Date the airline was founded.
  staff_count: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent_organization: Parent company or holding group.
  airline_code_iata: IATA airline designator code (2-letter).
  icao_code: ICAO airline designator code (3-letter).
  registered_office: City or location where the airline is headquartered.
  url: Official website of the airline.
  primary_hub: A hub airport of the airline.
flying_machines:
  __table__: Individual aircraft operated by airlines based in Worldwide.
  aircraft_id: Identifier for the aircraft.
  aircraft_name: Name or registration of the aircraft.
  carrier: Airline operating the aircraft.
  country: Country of the operating airline.
  model: Aircraft model type (e.g. Boeing 737-800).
  aircraft_manufacturer: Manufacturer of the aircraft.
  first_flight: Date of the aircraft's first flight.
  total_seats: Maximum passenger capacity.
  cruise_speed_kmh: Cruise speed in kilometers per hour.
  fuselage_length_m: Length of the aircraft in meters.
  max_takeoff_weight_kg: Maximum takeoff weight in kilograms.
air_disasters:
  __table__: Aviation accidents involving airlines that occurred in Worldwide.
  incident_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  airline: Airline involved in the accident.
  location_country: Country where the accident occurred.
  accident_date: Date of the accident.
  victims: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.
  flight: Flight number of the aircraft involved.

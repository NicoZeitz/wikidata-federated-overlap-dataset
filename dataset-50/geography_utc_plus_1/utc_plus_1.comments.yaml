__database__: Geographic database covering UTC+1 countries (CET / West Africa), including
  countries, continents, and cities.
nations:
  __table__: Sovereign countries in UTC+1 countries (CET / West Africa).
  country: Identifier for the country.
  state_name: Name of the country.
  iso_alpha2: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital: Capital city.
  currency: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  independence_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  population_male: Male population count (most recent estimate).
  women_population: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  income_inequality: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  mortality_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100000: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  head_of_government: Current head of government of the country.
major_regions:
  __table__: Continents covering UTC+1 countries (CET / West Africa).
  continent: Identifier for the continent.
  name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  geo_coords: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in UTC+1 countries (CET / West Africa).
  settlement_id: Identifier for the city.
  label: Name of the city.
  nation: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  postal_code: Postal or ZIP code of the city.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  per_capita_income_usd: Per capita income of the city in US dollars.
  height_m: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

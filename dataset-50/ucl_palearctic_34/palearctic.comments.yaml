__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founded: Date or year the club was founded.
  arena: Name of the club's home stadium.
  byname: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  homepage: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  competition_season_id: Season the match was played in.
  ucl_season_name: Name or label of the season.
  date: Date the match was played.
  ground: Venue where the match was played.
  team_a: First participating club.
  second_team: Second participating club.
  winner: Winning club (null for draws).
  spectators: Number of spectators in attendance.
  referee: Person who refereed the match.
ucl_arenas:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  stadium_id: Identifier for the venue.
  name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
football_teams:
  __table__: Football clubs based in Palearctic ecozone.
  team_id: Identifier for the football club.
  label: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  start_year: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  ownership: Name of the current owner or ownership group.
  leagueTitles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  abbreviation: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.

__database__: German states database covering Germany.
laender:
  __table__: The 16 German federal states (Bundesländer).
  german_state: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  bundesland: Name of the German federal state.
  coordinates: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  founded: Date the state was established or re-established.
  state_code: ISO 3166-2 code of the state (e.g. DE-BY).
  government_website: Official website of the state government.

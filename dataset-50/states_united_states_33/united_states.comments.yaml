__database__: US states database covering United States.
american_states:
  __table__: The 50 US states.
  state: Identifier for the US state.
  nation: Country the state belongs to.
  state_name: Name of the US state.
  centroid: Geographic coordinates of the state centroid.
  area_km2: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  admitted: Date the state was admitted to the Union.
  iso_3166_code: ISO 3166-2 code of the state (e.g. US-CA).
  sobriquet: Nickname of the state.
  website: Official website of the state government.

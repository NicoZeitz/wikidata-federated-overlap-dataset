__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
world_cup_games:
  __table__: FIFA World Cup matches played in France.
  fixture_id: Identifier for the FIFA World Cup match.
  fixture_name: Name or label of the match.
  match_date: Date the match was played.
  competition: Tournament this match belongs to.
  round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  host_stadium: Venue where the match was played.
  home_team: First participating team.
  team1_goals: Goals scored by team1.
  second_team: Second participating team.
  score_team2: Goals scored by team2.
  match_winner: Winning team (null for draws).
  spectators: Number of spectators in attendance.
  arbiter: Person who refereed the match.
national_football_teams:
  __table__: National football teams from France.
  team_id: Identifier for the national football team.
  label: Name of the team.
  home_country: Country the team represents.
  founding_year: Year the team was founded.
  native_label: Official name of the team in its native language.
  nickname: Comma-separated nicknames of the team.
  rank: FIFA world ranking of the team.
  competition_level: Competition class or league the team participates in.
  trainer: Current head coach of the team.
  leader: Current team captain.
stadiums:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in France.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  title: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  venue_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  qualified_teams: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

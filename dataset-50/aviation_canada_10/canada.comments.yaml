__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
terminals:
  __table__: Airports located in Canada.
  airport: Identifier for the airport.
  aerodrome_name: Name of the airport.
  iata_identifier: IATA three-letter airport code.
  icao: ICAO four-letter airport code.
  height_metres: Elevation of the airport above sea level in meters.
  passenger_traffic: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  timezone_offset: UTC offset of the airport's timezone in hours.
  opened: Date the airport was opened or established.
  coordinates: Geographic coordinates of the airport.
  city_id: City the airport serves.
  airport_country: Country the airport is located in.
air_carriers:
  __table__: Airlines headquartered in Canada.
  airline_id: Identifier for the airline.
  operator_name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  established: Date the airline was founded.
  workforce_size: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  number_of_aircraft: Number of aircraft in the fleet.
  parent: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  airline_code_icao: ICAO airline designator code (3-letter).
  registered_office: City or location where the airline is headquartered.
  web_address: Official website of the airline.
  hub: A hub airport of the airline.
jets:
  __table__: Individual aircraft operated by airlines based in Canada.
  aircraft_id: Identifier for the aircraft.
  name: Name or registration of the aircraft.
  operating_airline: Airline operating the aircraft.
  country: Country of the operating airline.
  plane_type: Aircraft model type (e.g. Boeing 737-800).
  builder: Manufacturer of the aircraft.
  first_flight_date: Date of the aircraft's first flight.
  passenger_capacity: Maximum passenger capacity.
  cruise_speed: Cruise speed in kilometers per hour.
  length: Length of the aircraft in meters.
  mtow_kg: Maximum takeoff weight in kilograms.
crashes:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  incident_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  carrier: Airline involved in the accident.
  country: Country where the accident occurred.
  date: Date of the accident.
  death_toll: Number of fatalities in the accident.
  survivor_count: Number of survivors.
  flight_code: Flight number of the aircraft involved.

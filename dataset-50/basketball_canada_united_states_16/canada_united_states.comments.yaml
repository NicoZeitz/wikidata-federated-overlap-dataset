__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_teams:
  __table__: NBA basketball teams based in Canada + United States.
  franchise_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  home_country: Country the team is based in.
  team_city: City the team is based in.
  city_name: Name of the city the team is based in.
  state: US state or province the team is based in.
  inception: Year the team was founded or established.
  trainer: Current head coach of the team.
  franchise_owner: Name of the current owner or ownership group.
  url: Official website URL of the team.
  online_followers: Number of social media followers of the team.
basketball_matches:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  first_team: First participating team.
  first_team_name: Name of the first participating team.
  team2: Second participating team.
  away_team_name: Name of the second participating team.
  winnerLabel: Name of the winning team.
  match_date: Date the game was played.
  crowd_size: Number of spectators in attendance.
  seasonLabel: Name or label of the NBA season the game belongs to.

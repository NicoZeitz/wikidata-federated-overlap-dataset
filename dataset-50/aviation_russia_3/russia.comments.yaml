__database__: Aviation database covering Russia, including airports, airlines, aircraft,
  and accidents.
aviation_hubs:
  __table__: Airports located in Russia.
  aerodrome_id: Identifier for the airport.
  name: Name of the airport.
  three_letter_code: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  passengers: Annual passenger count (most recent reported value).
  surface_area_km2: Total area of the airport in square kilometers.
  time_zone_offset: UTC offset of the airport's timezone in hours.
  founded: Date the airport was opened or established.
  coords: Geographic coordinates of the airport.
  city_id: City the airport serves.
  nation: Country the airport is located in.
air_transport_companies:
  __table__: Airlines headquartered in Russia.
  airline: Identifier for the airline.
  title: Name of the airline.
  nation: Country where the airline is headquartered.
  foundation_date: Date the airline was founded.
  staff: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  number_of_aircraft: Number of aircraft in the fleet.
  holding_company: Parent company or holding group.
  iata: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  base: City or location where the airline is headquartered.
  web_address: Official website of the airline.
  hub_airport: A hub airport of the airline.
fleet:
  __table__: Individual aircraft operated by airlines based in Russia.
  identifier: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  operating_airline: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  aircraft_type: Aircraft model type (e.g. Boeing 737-800).
  aircraft_manufacturer: Manufacturer of the aircraft.
  first_flight: Date of the aircraft's first flight.
  seating_capacity: Maximum passenger capacity.
  cruise_speed: Cruise speed in kilometers per hour.
  wing_width_m: Wingspan in meters.
  body_length_m: Length of the aircraft in meters.
  max_weight_kg: Maximum takeoff weight in kilograms.
incidents:
  __table__: Aviation accidents involving airlines that occurred in Russia.
  crash_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  flight_operator: Airline involved in the accident.
  country: Country where the accident occurred.
  occurrence_date: Date of the accident.
  victims: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.

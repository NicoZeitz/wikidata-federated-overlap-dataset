__database__: US states database covering United States.
us_states:
  __table__: The 50 US states.
  us_state_id: Identifier for the US state.
  parent_country: Country the state belongs to.
  state_name: Name of the US state.
  location: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  population_count: Population of the state (most recent estimate).
  capital_city: Capital city of the state.
  admission_date: Date the state was admitted to the Union.
  state_code: ISO 3166-2 code of the state (e.g. US-CA).
  sobriquet: Nickname of the state.

__database__: People database covering Worldwide, including persons, awards, and prize
  records.
people:
  __table__: Persons from Worldwide.
  individual_id: Identifier for the person.
  complete_name: Full name of the person.
  gender: Sex of the person.
  birth_date: Date of birth.
  death_date: Date of death (null if still living or unknown).
  christian_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  citizenship: Country of citizenship.
  native_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  height: Height of the person in centimeters.
  brothers_and_sisters: Number of siblings the person has.
accolades:
  __table__: Awards from Worldwide.
  honor_id: Identifier for the award.
  label: Name of the award.
  country: Country the award originates from.
  first_awarded: Year the award was first presented.
  sponsor: Organization that confers the award.
  eponym: Person or entity the award is named after.
  homepage: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  winner: Person who received the award.
  honor: Award received by the person.
  reception_year: Year the award was received.

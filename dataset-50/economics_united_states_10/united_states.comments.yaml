__database__: Economics database covering United States, including companies.
enterprises:
  __table__: Business enterprises headquartered in United States.
  corporation_id: Identifier for the company.
  corporation_name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  inception: Date the company was founded.
  website: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  ceo_person: Current chief executive officer.
  workers: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_income_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).
  market_capitalization_usd: Market capitalization in US dollars (most recent reported
    value).

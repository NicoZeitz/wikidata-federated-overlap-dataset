__database__: Geographic database covering NATO countries, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in NATO countries.
  country_id: Identifier for the country.
  label: Name of the country.
  two_letter_country_code: ISO 3166-1 alpha-2 two-letter country code.
  world_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  economic_output_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city_id: Capital city.
  currency: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  national_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  state_languages: Comma-separated official languages of the country.
  state_leader: Current head of state of the country.
  premier: Current head of government of the country.
geographic_regions:
  __table__: Continents covering NATO countries.
  id: Identifier for the continent.
  region_name: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  geo_coords: Geographic coordinates of the continent centroid.
  highest_peak: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in NATO countries.
  municipality_id: Identifier for the city.
  city_name: Name of the city.
  nation: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  position: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  zip_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  gross_domestic_product: Nominal GDP of the city in US dollars.
  income_per_capita: Per capita income of the city in US dollars.
  height_m: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.

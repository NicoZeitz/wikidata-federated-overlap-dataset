__database__: People database covering UN Security Council P5, including persons,
  awards, and prize records.
persons:
  __table__: Persons from UN Security Council P5.
  human_id: Identifier for the person.
  complete_name: Full name of the person.
  biological_sex: Sex of the person.
  birth_day: Date of birth.
  died: Date of death (null if still living or unknown).
  given_name: Given (first) name of the person.
  surname: Family (last) name of the person.
  passport_country: Country of citizenship.
  birth_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  college: Name of institution where the person studied.
  brothers_and_sisters: Number of siblings the person has.
honors:
  __table__: Awards from UN Security Council P5.
  prize_id: Identifier for the award.
  distinction_name: Name of the award.
  awarding_country: Country the award originates from.
  first_awarded: Year the award was first presented.
  granting_organization: Organization that confers the award.
person_awards:
  __table__: Records linking persons from UN Security Council P5 to awards they received.
  person_id: Person who received the award.
  award: Award received by the person.
  year_won: Year the award was received.

__database__: Football database covering Germany, including matches, teams, venues,
  and tournaments.
matches:
  __table__: FIFA World Cup matches played in Germany.
  fixture_id: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  game_date: Date the match was played.
  event: Tournament this match belongs to.
  stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  host_stadium: Venue where the match was played.
  team1: First participating team.
  goals_team1: Goals scored by team1.
  side_two: Second participating team.
  team2_goals: Goals scored by team2.
  winner: Winning team (null for draws).
  gate: Number of spectators in attendance.
  official: Person who refereed the match.
teams:
  __table__: National football teams from Germany.
  team_id: Identifier for the national football team.
  label: Name of the team.
  home_country: Country the team represents.
  founding_date: Year the team was founded.
  local_name: Official name of the team in its native language.
  nickname: Comma-separated nicknames of the team.
  current_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  coach: Current head coach of the team.
  captain: Current team captain.
arenas:
  __table__: Stadiums and arenas in Germany that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  seats: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
editions:
  __table__: FIFA World Cup tournaments held in Germany.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  edition_year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  participants: Number of teams participating in the tournament.
  winning_team: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

__database__: Geographic database covering Europe, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in Europe.
  country: Identifier for the country.
  territory_name: Name of the country.
  alpha2: ISO 3166-1 alpha-2 two-letter country code.
  geographic_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  people: Population of the country (most recent estimate).
  economic_output_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  governmental_center: Capital city.
  currency_name: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  independence_date: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  phone_code: International telephone dialling code (e.g. +49).
  male_population: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  official_languages: Comma-separated official languages of the country.
  head_of_state_name: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
geographic_regions:
  __table__: Continents covering Europe.
  continent: Identifier for the continent.
  region_name: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  total_population: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  maximum_elevation_point: Name of the highest geographical point on the continent.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
localities:
  __table__: Cities and human settlements located in Europe.
  municipality_id: Identifier for the city.
  label: Name of the city.
  home_country: Country the city is located in.
  people: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  inception: Date or year the city was founded or first recorded.
  post_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  average_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

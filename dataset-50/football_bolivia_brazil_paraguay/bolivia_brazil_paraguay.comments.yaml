__database__: Football database covering Bolivia + Brazil + Paraguay, including matches,
  teams, venues, and tournaments.
soccer_matches:
  __table__: FIFA World Cup matches played in Bolivia + Brazil + Paraguay.
  game_id: Identifier for the FIFA World Cup match.
  fixture_name: Name or label of the match.
  date: Date the match was played.
  cup_edition: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  match_venue: Venue where the match was played.
  team_a: First participating team.
  team1_goals: Goals scored by team1.
  team2: Second participating team.
  team_b_score: Goals scored by team2.
  winner: Winning team (null for draws).
  crowd_size: Number of spectators in attendance.
  match_referee: Person who refereed the match.
national_teams:
  __table__: National football teams from Bolivia + Brazil + Paraguay.
  team: Identifier for the national football team.
  name: Name of the team.
  nation: Country the team represents.
  founding_year: Year the team was founded.
  nickname: Comma-separated nicknames of the team.
  world_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  coach: Current head coach of the team.
  team_captain: Current team captain.
sports_venues:
  __table__: Stadiums and arenas in Bolivia + Brazil + Paraguay that hosted FIFA World
    Cup matches.
  stadium_id: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
championships:
  __table__: FIFA World Cup tournaments held in Bolivia + Brazil + Paraguay.
  tournament: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  qualified_teams: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goal_count: Total number of goals scored across all matches.

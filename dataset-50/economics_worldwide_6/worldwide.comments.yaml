__database__: Economics database covering Worldwide, including companies.
entities:
  __table__: Business enterprises headquartered in Worldwide.
  corporation_id: Identifier for the company.
  organization_name: Name of the company.
  home_country: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industries: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  start_date: Date the company was founded.
  website: Official website URL of the company.
  hq_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_income_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).
  market_cap_usd: Market capitalization in US dollars (most recent reported value).

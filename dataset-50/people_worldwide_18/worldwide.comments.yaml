__database__: People database covering Worldwide, including persons, awards, and prize
  records.
personalities:
  __table__: Persons from Worldwide.
  person: Identifier for the person.
  label: Full name of the person.
  gender: Sex of the person.
  birth_date: Date of birth.
  death_date: Date of death (null if still living or unknown).
  given_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  passport_country: Country of citizenship.
  birth_nation: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  university: Name of institution where the person studied.
  stature: Height of the person in centimeters.
  kids: Number of children the person has.
  sibling_count: Number of siblings the person has.
accolades:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  title: Name of the award.
  nation: Country the award originates from.
  first_awarded: Year the award was first presented.
  awarding_organization: Organization that confers the award.
  named_after: Person or entity the award is named after.
  url: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  awardee: Person who received the award.
  award: Award received by the person.
  year_awarded: Year the award was received.

__database__: Geographic database covering Indonesia, including countries, continents,
  and cities.
territories:
  __table__: Sovereign countries in Indonesia.
  country: Identifier for the country.
  name: Name of the country.
  two_letter_country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city_id: Capital city.
  legal_tender: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  full_name: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  jobless_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  birth_rate_per_woman: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  reserve_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  president: Current head of state of the country.
  prime_minister: Current head of government of the country.
geographic_regions:
  __table__: Continents covering Indonesia.
  id: Identifier for the continent.
  region_name: Name of the continent.
  land_area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_peak: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populated_city: Most populous urban area on the continent.
  unenrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in Indonesia.
  settlement_id: Identifier for the city.
  label: Name of the city.
  home_country: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  inception: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  zip_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  mean_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.
  vehicle_density: Number of registered motor vehicles per thousand inhabitants.

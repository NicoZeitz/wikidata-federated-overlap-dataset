__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  label: Full name of the NBA team.
  base_country: Country the team is based in.
  base_city: City the team is based in.
  location_name: Name of the city the team is based in.
  province: US state or province the team is based in.
  founded: Year the team was founded or established.
  stadium: Home arena or venue of the team.
  trainer: Current head coach of the team.
  owner: Name of the current owner or ownership group.
  website: Official website URL of the team.
  fan_following: Number of social media followers of the team.
basketball_matches:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  team1: First participating team.
  team1Label: Name of the first participating team.
  second_team: Second participating team.
  away_team_name: Name of the second participating team.
  winning_team: Name of the winning team.
  venue_name: Name of the venue where the game was played.
  date: Date the game was played.
  gate: Number of spectators in attendance.
  seasonLabel: Name or label of the NBA season the game belongs to.

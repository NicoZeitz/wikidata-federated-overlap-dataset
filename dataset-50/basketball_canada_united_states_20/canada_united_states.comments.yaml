__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  franchise_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  nation: Country the team is based in.
  team_city: City the team is based in.
  home_city_name: Name of the city the team is based in.
  team_state: US state or province the team is based in.
  founding_date: Year the team was founded or established.
  stadium: Home arena or venue of the team.
  team_owner: Name of the current owner or ownership group.
  social_media_followers: Number of social media followers of the team.
nba_fixtures:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  nation: Country the game was played in (always United States).
  first_team: First participating team.
  team1Label: Name of the first participating team.
  team2: Second participating team.
  winnerLabel: Name of the winning team.
  venue_name: Name of the venue where the game was played.
  played_on: Date the game was played.
  crowd: Number of spectators in attendance.
  season: Name or label of the NBA season the game belongs to.

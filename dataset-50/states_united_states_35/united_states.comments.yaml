__database__: US states database covering United States.
us_states:
  __table__: The 50 US states.
  state: Identifier for the US state.
  nation: Country the state belongs to.
  american_state_name: Name of the US state.
  location: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  admission_date: Date the state was admitted to the Union.
  state_code: ISO 3166-2 code of the state (e.g. US-CA).
  sobriquet: Nickname of the state.
  official_website: Official website of the state government.

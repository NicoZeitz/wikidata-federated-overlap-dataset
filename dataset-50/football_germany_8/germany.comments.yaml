__database__: Football database covering Germany, including matches, teams, venues,
  and tournaments.
games:
  __table__: FIFA World Cup matches played in Germany.
  match_id: Identifier for the FIFA World Cup match.
  match_name: Name or label of the match.
  date: Date the match was played.
  tournament: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  arena: Venue where the match was played.
  team_a: First participating team.
  home_goals: Goals scored by team1.
  team_b: Second participating team.
  score_team2: Goals scored by team2.
  champion: Winning team (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
national_teams:
  __table__: National football teams from Germany.
  squad_id: Identifier for the national football team.
  national_team_name: Name of the team.
  country: Country the team represents.
  inception: Year the team was founded.
  official_name: Official name of the team in its native language.
  world_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  leader: Current team captain.
world_cup_venues:
  __table__: Stadiums and arenas in Germany that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  name: Name of the venue or stadium.
  nation: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in Germany.
  tournament: Identifier for the FIFA World Cup tournament edition.
  name: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  edition_no: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  num_participants: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

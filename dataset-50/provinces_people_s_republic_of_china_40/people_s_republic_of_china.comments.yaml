__database__: Provinces database covering China.
china_states:
  __table__: Administrative divisions of China.
  province_id: Identifier for the Chinese province or administrative region.
  country: Country the province belongs to.
  label: Name of the Chinese province or administrative region.
  centroid: Geographic coordinates of the province centroid.
  total_area_km2: Total area of the province in square kilometers.
  population: Population of the province (most recent estimate).
  provincial_capital: Capital city of the province.
  inception: Date the province was established.
  iso: ISO 3166-2 code of the province (e.g. CN-HE).
  official_website: Official website of the provincial government.

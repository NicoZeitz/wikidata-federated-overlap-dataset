__database__: Economics database covering Czech Republic + Slovakia, including companies.
entities:
  __table__: Business enterprises headquartered in Czech Republic + Slovakia.
  corporation_id: Identifier for the company.
  firm_name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  foundation_year: Date the company was founded.
  base_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  staff_count: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  trading_profit_usd: Operating income in US dollars (most recent reported value).
  valuation_usd: Market capitalization in US dollars (most recent reported value).

__database__: Football database covering Worldwide, including matches, teams, venues,
  and tournaments.
games:
  __table__: FIFA World Cup matches played in Worldwide.
  match_id: Identifier for the FIFA World Cup match.
  match_name: Name or label of the match.
  kickoff_date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  arena: Venue where the match was played.
  first_team: First participating team.
  team1_score: Goals scored by team1.
  team2: Second participating team.
  team_b_score: Goals scored by team2.
  champion: Winning team (null for draws).
  gate: Number of spectators in attendance.
  umpire: Person who refereed the match.
teams:
  __table__: National football teams from Worldwide.
  squad_id: Identifier for the national football team.
  title: Name of the team.
  nation: Country the team represents.
  founding_year: Year the team was founded.
  local_label: Official name of the team in its native language.
  rank: FIFA world ranking of the team.
  tier: Competition class or league the team participates in.
  coach: Current head coach of the team.
  skipper: Current team captain.
venues:
  __table__: Stadiums and arenas in Worldwide that hosted FIFA World Cup matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
world_cup_editions:
  __table__: FIFA World Cup tournaments held in Worldwide.
  tournament: Identifier for the FIFA World Cup tournament edition.
  tournament_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  team_count: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

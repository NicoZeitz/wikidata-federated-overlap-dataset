__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_date: Date or year the club was founded.
  head_coach: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  seasonLabel: Name or label of the season.
  match_date: Date the match was played.
  stadium: Venue where the match was played.
  team_a: First participating club.
  team2: Second participating club.
  match_winner: Winning club (null for draws).
  gate: Number of spectators in attendance.
  match_referee: Person who refereed the match.
ucl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
soccer_teams:
  __table__: Football clubs based in Palearctic ecozone.
  organization_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  inception: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  club_founder: Name of the person or entity who founded the club.

__database__: Economics database covering Czech Republic, including companies.
companies:
  __table__: Business enterprises headquartered in Czech Republic.
  business_id: Identifier for the company.
  trade_name: Name of the company.
  country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  legal_structure: Legal form or structure of the company.
  founding_date: Date the company was founded.
  head_office_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

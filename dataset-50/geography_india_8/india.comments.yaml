__database__: Geographic database covering India, including countries, continents,
  and cities.
nations:
  __table__: Sovereign countries in India.
  country: Identifier for the country.
  country_name: Name of the country.
  iso2_code: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  economic_output_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city: Capital city.
  monetary_unit: Name of the official currency.
  centroid: Geographic coordinates of the country centroid.
  founded: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  male_population: Male population count (most recent estimate).
  population_female: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  income_inequality: Gini coefficient measuring income inequality (0–1).
  birth_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  monetary_authority: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  official_languages: Comma-separated official languages of the country.
  chief_of_state: Current head of state of the country.
  premier: Current head of government of the country.
world_regions:
  __table__: Continents covering India.
  continent_id: Identifier for the continent.
  name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  total_population: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  summit_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_city: Most populous urban area on the continent.
  unenrolled_children: Estimated number of school-age children not enrolled in school.
  un_m49: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in India.
  municipality_id: Identifier for the city.
  name: Name of the city.
  nation: Country the city is located in.
  population: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  mailing_code: Postal or ZIP code of the city.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the city.
  economic_output: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

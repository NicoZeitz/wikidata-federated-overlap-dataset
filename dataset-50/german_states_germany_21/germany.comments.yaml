__database__: German states database covering Germany.
bundesland_table:
  __table__: The 16 German federal states (Bundesländer).
  german_state: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  federal_state_name: Name of the German federal state.
  coordinates: Geographic coordinates of the state centroid.
  surface_area_km2: Total area of the state in square kilometers.
  inhabitants: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  creation_date: Date the state was established or re-established.
  iso_3166_code: ISO 3166-2 code of the state (e.g. DE-BY).

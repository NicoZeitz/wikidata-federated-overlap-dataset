__database__: Economics database covering Japan, including companies.
organizations:
  __table__: Business enterprises headquartered in Japan.
  corporation_id: Identifier for the company.
  trade_name: Name of the company.
  country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  creation_date: Date the company was founded.
  homepage: Official website URL of the company.
  city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

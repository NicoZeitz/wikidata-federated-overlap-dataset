__database__: Geographic database covering United States, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in United States.
  state_id: Identifier for the country.
  territory_name: Name of the country.
  alpha2: ISO 3166-1 alpha-2 two-letter country code.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city: Capital city.
  currency_name: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  founded: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  calling_code: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  total_fertility_rate: Average number of children born per woman.
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  head_of_state: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
major_regions:
  __table__: Continents covering United States.
  identifier: Identifier for the continent.
  label: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  geo_coords: Geographic coordinates of the continent centroid.
  highest_point: Name of the highest geographical point on the continent.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  lowest_altitude_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populated_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  adjectival: Comma-separated adjectives or nouns used to describe inhabitants of
    the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
cities:
  __table__: Cities and human settlements located in United States.
  settlement_id: Identifier for the city.
  settlement_name: Name of the city.
  nation: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  postal_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  income_per_capita: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.

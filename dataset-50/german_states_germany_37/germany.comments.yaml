__database__: German states database covering Germany.
german_bundeslaender:
  __table__: The 16 German federal states (Bundesländer).
  bundesland_id: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  state_name: Name of the German federal state.
  centroid: Geographic coordinates of the state centroid.
  size_km2: Total area of the state in square kilometers.
  pop: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  inception: Date the state was established or re-established.
  homepage: Official website of the state government.

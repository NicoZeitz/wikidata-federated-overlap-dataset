__database__: Economics database covering United States, including companies.
entities:
  __table__: Business enterprises headquartered in United States.
  company: Identifier for the company.
  business_name: Name of the company.
  nation: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  industries: Industries the company operates in (comma-separated).
  legal_structure: Legal form or structure of the company.
  start_date: Date the company was founded.
  homepage: Official website URL of the company.
  base_city: City where the company is headquartered.
  ceo_person: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).

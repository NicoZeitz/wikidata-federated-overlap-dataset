__database__: Geographic database covering United States, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in United States.
  country_id: Identifier for the country.
  territory_name: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  continent_id: Continent the country belongs to.
  territory_size_km2: Total area of the country in square kilometers.
  total_population: Population of the country (most recent estimate).
  economic_output_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  governmental_center: Capital city.
  currency_name: Name of the official currency.
  location: Geographic coordinates of the country centroid.
  founded: Date the country was founded or became independent.
  dial_code: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  unemployment_pct: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  median_income_usd: Median household or personal income in US dollars.
  democracy_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northmost_coords: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  state_languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  premier: Current head of government of the country.
world_divisions:
  __table__: Continents covering United States.
  identifier: Identifier for the continent.
  label: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  location: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  highest_altitude_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  m49_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in United States.
  settlement_id: Identifier for the city.
  label: Name of the city.
  country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  inception: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  zip_code: Postal or ZIP code of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  gdp_usd: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  size_km2: Total area of the city in square kilometers.
  car_ownership_rate: Number of registered motor vehicles per thousand inhabitants.

__database__: Economics database covering Worldwide, including companies.
organizations:
  __table__: Business enterprises headquartered in Worldwide.
  company_id: Identifier for the company.
  title: Name of the company.
  country_of_incorporation: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  inception: Date the company was founded.
  official_website: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  sales_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

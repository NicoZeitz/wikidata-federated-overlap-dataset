__database__: People database covering Worldwide, including persons, awards, and prize
  records.
public_figures:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  person_name: Full name of the person.
  gender: Sex of the person.
  born: Date of birth.
  dod: Date of death (null if still living or unknown).
  forename: Given (first) name of the person.
  surname: Family (last) name of the person.
  passport_country: Country of citizenship.
  native_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  college: Name of institution where the person studied.
  height: Height of the person in centimeters.
  kids: Number of children the person has.
  number_of_siblings: Number of siblings the person has.
accolades:
  __table__: Awards from Worldwide.
  prize_id: Identifier for the award.
  honor_name: Name of the award.
  country_of_origin: Country the award originates from.
  inception: Year the award was first presented.
  namesake: Person or entity the award is named after.
  url: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  awardee: Person who received the award.
  honor: Award received by the person.
  reception_year: Year the award was received.

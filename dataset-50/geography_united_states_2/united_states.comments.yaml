__database__: Geographic database covering United States, including countries, continents,
  and cities.
territories:
  __table__: Sovereign countries in United States.
  state_id: Identifier for the country.
  name: Name of the country.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  total_area_km2: Total area of the country in square kilometers.
  number_of_inhabitants: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  seat_of_government: Capital city.
  currency_name: Name of the official currency.
  location: Geographic coordinates of the country centroid.
  founding_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  phone_code: International telephone dialling code (e.g. +49).
  male_population: Male population count (most recent estimate).
  women_population: Female population count (most recent estimate).
  life_exp: Average life expectancy at birth in years.
  human_development_index: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  crude_birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_income_usd: Median household or personal income in US dollars.
  democracy_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  depression_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  spoken_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  head_of_government: Current head of government of the country.
geographic_regions:
  __table__: Continents covering United States.
  continent: Identifier for the continent.
  region_name: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  lat_lon: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northernmost_point: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in United States.
  municipality_id: Identifier for the city.
  name: Name of the city.
  city_country: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  informal_name: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  city_gdp: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

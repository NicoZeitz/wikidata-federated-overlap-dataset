__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_teams:
  __table__: NBA basketball teams based in Canada + United States.
  franchise_id: Identifier for the NBA team.
  label: Full name of the NBA team.
  nation: Country the team is based in.
  location: City the team is based in.
  team_state: US state or province the team is based in.
  inception: Year the team was founded or established.
  venue: Home arena or venue of the team.
  coach: Current head coach of the team.
  owner: Name of the current owner or ownership group.
  socialFollowers: Number of social media followers of the team.
basketball_matches:
  __table__: NBA basketball games played in Canada + United States.
  match_id: Identifier for the NBA game.
  host_country: Country the game was played in (always United States).
  first_team: First participating team.
  away_team: Second participating team.
  team2_name: Name of the second participating team.
  winning_team_name: Name of the winning team.
  venueLabel: Name of the venue where the game was played.
  played_on: Date the game was played.
  crowd: Number of spectators in attendance.
  season_name: Name or label of the NBA season the game belongs to.

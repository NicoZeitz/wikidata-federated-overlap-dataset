__database__: US states database covering United States.
states:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  parent_country: Country the state belongs to.
  name: Name of the US state.
  centroid: Geographic coordinates of the state centroid.
  surface_area_km2: Total area of the state in square kilometers.
  inhabitants: Population of the state (most recent estimate).
  capital_city: Capital city of the state.
  founding_date: Date the state was admitted to the Union.
  abbreviation: ISO 3166-2 code of the state (e.g. US-CA).
  alias: Nickname of the state.

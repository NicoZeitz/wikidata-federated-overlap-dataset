__database__: Football database covering United States, including matches, teams,
  venues, and tournaments.
games:
  __table__: FIFA World Cup matches played in United States.
  match_id: Identifier for the FIFA World Cup match.
  game_name: Name or label of the match.
  fixture_date: Date the match was played.
  event: Tournament this match belongs to.
  round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  team_a: First participating team.
  team1_goals: Goals scored by team1.
  team2: Second participating team.
  team2_score: Goals scored by team2.
  winner: Winning team (null for draws).
  gate: Number of spectators in attendance.
  umpire: Person who refereed the match.
international_teams:
  __table__: National football teams from United States.
  team: Identifier for the national football team.
  label: Name of the team.
  home_country: Country the team represents.
  inception: Year the team was founded.
  local_label: Official name of the team in its native language.
  sobriquet: Comma-separated nicknames of the team.
  rank: FIFA world ranking of the team.
  tier: Competition class or league the team participates in.
  head_coach: Current head coach of the team.
  skipper: Current team captain.
sports_venues:
  __table__: Stadiums and arenas in United States that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  tenants: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
world_cup_editions:
  __table__: FIFA World Cup tournaments held in United States.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  name: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  tournament_mascot: Official mascot of the tournament.
  participants: Number of teams participating in the tournament.
  winner: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

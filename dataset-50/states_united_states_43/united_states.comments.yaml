__database__: US states database covering United States.
states:
  __table__: The 50 US states.
  us_state_id: Identifier for the US state.
  country: Country the state belongs to.
  american_state_name: Name of the US state.
  coordinates: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  statehood_date: Date the state was admitted to the Union.
  iso_3166_code: ISO 3166-2 code of the state (e.g. US-CA).
  nickname: Nickname of the state.

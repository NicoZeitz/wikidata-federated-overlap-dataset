__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
terminals:
  __table__: Airports located in Canada.
  airport: Identifier for the airport.
  airfield_name: Name of the airport.
  iata: IATA three-letter airport code.
  icao: ICAO four-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  passengers: Annual passenger count (most recent reported value).
  surface_area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  opening_date: Date the airport was opened or established.
  position: Geographic coordinates of the airport.
  city: City the airport serves.
  country: Country the airport is located in.
airlines:
  __table__: Airlines headquartered in Canada.
  carrier_id: Identifier for the airline.
  operator_name: Name of the airline.
  nation: Country where the airline is headquartered.
  inception: Date the airline was founded.
  employee_count: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent: Parent company or holding group.
  iata: IATA airline designator code (2-letter).
  icao_designator: ICAO airline designator code (3-letter).
  registered_office: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  primary_hub: A hub airport of the airline.
airliners:
  __table__: Individual aircraft operated by airlines based in Canada.
  aircraft_id: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  air_operator: Airline operating the aircraft.
  country: Country of the operating airline.
  aircraft_type: Aircraft model type (e.g. Boeing 737-800).
  aircraft_manufacturer: Manufacturer of the aircraft.
  debut_flight: Date of the aircraft's first flight.
  seats: Maximum passenger capacity.
  wingspan_m: Wingspan in meters.
  fuselage_length_m: Length of the aircraft in meters.
  mtow_kg: Maximum takeoff weight in kilograms.
plane_crashes:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  accident_id: Identifier for the aviation accident.
  crash_name: Name or description of the accident.
  air_carrier: Airline involved in the accident.
  nation: Country where the accident occurred.
  occurrence_date: Date of the accident.
  death_toll: Number of fatalities in the accident.
  survived: Number of survivors.
  flight_number: Flight number of the aircraft involved.

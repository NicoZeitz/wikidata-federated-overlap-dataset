__database__: Provinces database covering China.
administrative_regions:
  __table__: Administrative divisions of China.
  region_id: Identifier for the Chinese province or administrative region.
  parent_country: Country the province belongs to.
  label: Name of the Chinese province or administrative region.
  coordinates: Geographic coordinates of the province centroid.
  size_km2: Total area of the province in square kilometers.
  residents: Population of the province (most recent estimate).
  capital: Capital city of the province.
  established: Date the province was established.
  region_code: ISO 3166-2 code of the province (e.g. CN-HE).
  government_website: Official website of the provincial government.

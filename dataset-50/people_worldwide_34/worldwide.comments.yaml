__database__: People database covering Worldwide, including persons, awards, and prize
  records.
individuals:
  __table__: Persons from Worldwide.
  individual_id: Identifier for the person.
  display_name: Full name of the person.
  biological_sex: Sex of the person.
  date_of_birth: Date of birth.
  died: Date of death (null if still living or unknown).
  given_name: Given (first) name of the person.
  paternal_name: Family (last) name of the person.
  country_of_citizenship: Country of citizenship.
  birth_nation: Country of birth.
  country: Country associated with the person (citizenship if known, otherwise country
    of birth).
  college: Name of institution where the person studied.
  height_metres: Height of the person in centimeters.
  sibling_count: Number of siblings the person has.
prizes:
  __table__: Awards from Worldwide.
  award_id: Identifier for the award.
  distinction_name: Name of the award.
  nation: Country the award originates from.
  first_awarded: Year the award was first presented.
  granting_organization: Organization that confers the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  honoree: Person who received the award.
  prize: Award received by the person.
  year_awarded: Year the award was received.

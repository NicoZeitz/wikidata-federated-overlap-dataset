__database__: Geographic database covering OECD, including countries, continents,
  and cities.
republics:
  __table__: Sovereign countries in OECD.
  country: Identifier for the country.
  state_name: Name of the country.
  iso_alpha2: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  land_area_km2: Total area of the country in square kilometers.
  total_population: Population of the country (most recent estimate).
  national_income_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  seat_of_government: Capital city.
  currency: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  telephone_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  longevity: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  income_inequality: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  birth_rate: Number of live births per 1000 inhabitants per year.
  mortality_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  spoken_languages: Comma-separated official languages of the country.
  state_leader: Current head of state of the country.
  prime_minister: Current head of government of the country.
landmasses:
  __table__: Continents covering OECD.
  continent: Identifier for the continent.
  region_name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  adjectival: Comma-separated adjectives or nouns used to describe inhabitants of
    the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in OECD.
  city_id: Identifier for the city.
  city_name: Name of the city.
  country: Country the city is located in.
  people: Population of the city (most recent estimate).
  location: Geographic coordinates of the city.
  inception: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  city_gdp: Nominal GDP of the city in US dollars.
  per_capita_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.

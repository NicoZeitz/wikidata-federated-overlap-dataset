__database__: Geographic database covering India, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in India.
  country_id: Identifier for the country.
  territory_name: Name of the country.
  iso_alpha2: ISO 3166-1 alpha-2 two-letter country code.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  population: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city: Capital city.
  official_currency: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  independence_date: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  male_population: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  unemployment_pct: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  total_fertility_rate: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank_name: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  president: Current head of state of the country.
  prime_minister: Current head of government of the country.
world_divisions:
  __table__: Continents covering India.
  id: Identifier for the continent.
  landmass_name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  residents: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  summit_elevation_m: Elevation of the highest point above sea level in meters.
  minimum_elevation_point: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
cities:
  __table__: Cities and human settlements located in India.
  city_id: Identifier for the city.
  label: Name of the city.
  home_country: Country the city is located in.
  population: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  mailing_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  economic_output: Nominal GDP of the city in US dollars.
  mean_income_usd: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.

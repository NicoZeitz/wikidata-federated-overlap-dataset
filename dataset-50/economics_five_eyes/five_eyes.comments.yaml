__database__: Economics database covering Five Eyes, including companies.
firms:
  __table__: Business enterprises headquartered in Five Eyes.
  firm_id: Identifier for the company.
  company_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  organizational_form: Legal form or structure of the company.
  start_date: Date the company was founded.
  city: City where the company is headquartered.
  chief_executive: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).

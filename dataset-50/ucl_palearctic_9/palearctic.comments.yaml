__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
european_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founded: Date or year the club was founded.
  coach: Name of the current head coach or manager.
  ownership: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  founding_person: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  competition_season: Name or label of the season.
  match_date: Date the match was played.
  arena: Venue where the match was played.
  first_team: First participating club.
  team2: Second participating club.
  match_winner: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  host_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  full_club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founded: Date or year the club was founded.
  ground: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  leagueTitles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  acronym: Short or abbreviated name of the club.

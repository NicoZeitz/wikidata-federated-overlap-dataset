__database__: Economics database covering United States, including companies.
businesses:
  __table__: Business enterprises headquartered in United States.
  company: Identifier for the company.
  business_name: Name of the company.
  country: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industries: Industries the company operates in (comma-separated).
  organizational_form: Legal form or structure of the company.
  founding_date: Date the company was founded.
  homepage: Official website URL of the company.
  base_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).

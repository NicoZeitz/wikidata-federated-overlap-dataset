__database__: Economics database covering Japan, including companies.
companies_list:
  __table__: Business enterprises headquartered in Japan.
  business_id: Identifier for the company.
  trade_name: Name of the company.
  nation: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  inception: Date the company was founded.
  homepage: Official website URL of the company.
  base_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  employees: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).

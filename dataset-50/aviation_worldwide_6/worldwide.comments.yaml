__database__: Aviation database covering Worldwide, including airports, airlines,
  aircraft, and accidents.
airports:
  __table__: Airports located in Worldwide.
  airport: Identifier for the airport.
  name: Name of the airport.
  iata_identifier: IATA three-letter airport code.
  icao_code: ICAO four-letter airport code.
  elevation_above_sea_level_m: Elevation of the airport above sea level in meters.
  throughput: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  opened: Date the airport was opened or established.
  position: Geographic coordinates of the airport.
  city_id: City the airport serves.
  nation: Country the airport is located in.
air_transport_companies:
  __table__: Airlines headquartered in Worldwide.
  airline_id: Identifier for the airline.
  title: Name of the airline.
  nation: Country where the airline is headquartered.
  founded: Date the airline was founded.
  staff_count: Number of employees (most recent reported value).
  income_usd: Annual revenue in US dollars (most recent reported value).
  aircraft_count: Number of aircraft in the fleet.
  holding_company: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  icao_designator: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  base_airport: A hub airport of the airline.
jets:
  __table__: Individual aircraft operated by airlines based in Worldwide.
  identifier: Identifier for the aircraft.
  aircraft_name: Name or registration of the aircraft.
  carrier: Airline operating the aircraft.
  country: Country of the operating airline.
  aircraft_variant: Aircraft model type (e.g. Boeing 737-800).
  manufacturer: Manufacturer of the aircraft.
  first_flight: Date of the aircraft's first flight.
  seats: Maximum passenger capacity.
  cruising_speed: Cruise speed in kilometers per hour.
  length: Length of the aircraft in meters.
  takeoff_weight_kg: Maximum takeoff weight in kilograms.
flight_accidents:
  __table__: Aviation accidents involving airlines that occurred in Worldwide.
  crash_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  airline_name: Airline involved in the accident.
  location_country: Country where the accident occurred.
  occurrence_date: Date of the accident.
  death_toll: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.

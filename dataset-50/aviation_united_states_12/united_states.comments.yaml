__database__: Aviation database covering United States, including airports, airlines,
  aircraft, and accidents.
international_airports:
  __table__: Airports located in United States.
  airport: Identifier for the airport.
  airport_name: Name of the airport.
  airport_code: IATA three-letter airport code.
  altitude_m: Elevation of the airport above sea level in meters.
  pax: Annual passenger count (most recent reported value).
  utc_offset: UTC offset of the airport's timezone in hours.
  established: Date the airport was opened or established.
  geo_coords: Geographic coordinates of the airport.
  served_city: City the airport serves.
  country: Country the airport is located in.
airlines:
  __table__: Airlines headquartered in United States.
  carrier_id: Identifier for the airline.
  label: Name of the airline.
  country: Country where the airline is headquartered.
  start_date: Date the airline was founded.
  employees: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  owner: Parent company or holding group.
  two_letter_code: IATA airline designator code (2-letter).
  airline_code_icao: ICAO airline designator code (3-letter).
  registered_office: City or location where the airline is headquartered.
  website: Official website of the airline.
  base_airport: A hub airport of the airline.
airplanes:
  __table__: Individual aircraft operated by airlines based in United States.
  identifier: Identifier for the aircraft.
  aircraft_name: Name or registration of the aircraft.
  operating_carrier: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  aircraft_variant: Aircraft model type (e.g. Boeing 737-800).
  manufacturer_name: Manufacturer of the aircraft.
  delivery_date: Date of the aircraft's first flight.
  capacity: Maximum passenger capacity.
  wingspan: Wingspan in meters.
  length_m: Length of the aircraft in meters.
  max_takeoff_weight_kg: Maximum takeoff weight in kilograms.
crashes:
  __table__: Aviation accidents involving airlines that occurred in United States.
  event_id: Identifier for the aviation accident.
  description: Name or description of the accident.
  air_carrier: Airline involved in the accident.
  nation: Country where the accident occurred.
  accident_date: Date of the accident.
  killed: Number of fatalities in the accident.
  survived: Number of survivors.
  flight_code: Flight number of the aircraft involved.

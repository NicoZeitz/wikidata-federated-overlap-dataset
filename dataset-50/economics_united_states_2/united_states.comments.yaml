__database__: Economics database covering United States, including companies.
corporations:
  __table__: Business enterprises headquartered in United States.
  firm_id: Identifier for the company.
  corporation_name: Name of the company.
  country_of_incorporation: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  organizational_form: Legal form or structure of the company.
  start_date: Date the company was founded.
  url: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  employee_count: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  profit_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

__database__: Economics database covering Japan, including companies.
companies_list:
  __table__: Business enterprises headquartered in Japan.
  company_id: Identifier for the company.
  name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industries: Industries the company operates in (comma-separated).
  creation_date: Date the company was founded.
  head_office_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  workforce_size: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).

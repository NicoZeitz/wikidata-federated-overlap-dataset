__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  established: Date or year the club was founded.
  tactician: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  web_address: Official website URL of the club.
  acronym: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
champions_league_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  fixture_id: Identifier for the UEFA Champions League match.
  title: Name or label of the match.
  season: Season the match was played in.
  competition_season: Name or label of the season.
  fixture_date: Date the match was played.
  stadium: Venue where the match was played.
  team1: First participating club.
  team2: Second participating club.
  match_winner: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  referee: Person who refereed the match.
ucl_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  arena_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team_id: Identifier for the football club.
  label: Full name of the football club.
  league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  start_year: Date or year the club was founded.
  ground: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  sobriquet: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.

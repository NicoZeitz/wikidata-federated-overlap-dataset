__database__: Football database covering United States, including matches, teams,
  venues, and tournaments.
world_cup_matches:
  __table__: FIFA World Cup matches played in United States.
  game_id: Identifier for the FIFA World Cup match.
  fixture_name: Name or label of the match.
  fixture_date: Date the match was played.
  cup_edition: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  match_venue: Venue where the match was played.
  first_team: First participating team.
  team_a_score: Goals scored by team1.
  second_team: Second participating team.
  team_b_score: Goals scored by team2.
  winner: Winning team (null for draws).
  gate: Number of spectators in attendance.
  arbiter: Person who refereed the match.
international_teams:
  __table__: National football teams from United States.
  team: Identifier for the national football team.
  team_name: Name of the team.
  represented_country: Country the team represents.
  established: Year the team was founded.
  alias: Comma-separated nicknames of the team.
  ranking: FIFA world ranking of the team.
  tier: Competition class or league the team participates in.
  manager: Current head coach of the team.
  team_captain: Current team captain.
football_stadiums:
  __table__: Stadiums and arenas in United States that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
world_cup_editions:
  __table__: FIFA World Cup tournaments held in United States.
  edition_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  country: Host country of the tournament.
  edition_no: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  team_count: Number of teams participating in the tournament.
  cup_winner: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

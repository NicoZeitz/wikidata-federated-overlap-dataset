__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_participants:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  inception: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season: Season the match was played in.
  game_date: Date the match was played.
  arena: Venue where the match was played.
  home_team: First participating club.
  team_b: Second participating club.
  victor: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  match_referee: Person who refereed the match.
ucl_arenas:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  stadium_id: Identifier for the venue.
  name: Name of the venue or stadium.
  country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  full_club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  sobriquet: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.

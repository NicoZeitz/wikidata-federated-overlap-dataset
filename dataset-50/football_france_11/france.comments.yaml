__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
matches:
  __table__: FIFA World Cup matches played in France.
  match: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  fixture_date: Date the match was played.
  tournament: Tournament this match belongs to.
  round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  arena: Venue where the match was played.
  first_team: First participating team.
  score_team1: Goals scored by team1.
  second_team: Second participating team.
  goals_team2: Goals scored by team2.
  winner: Winning team (null for draws).
  spectators: Number of spectators in attendance.
  arbiter: Person who refereed the match.
national_squads:
  __table__: National football teams from France.
  team_id: Identifier for the national football team.
  team_name: Name of the team.
  represented_country: Country the team represents.
  founding_year: Year the team was founded.
  native_name: Official name of the team in its native language.
  sobriquet: Comma-separated nicknames of the team.
  current_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  head_coach: Current head coach of the team.
  skipper: Current team captain.
football_stadiums:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  label: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
editions:
  __table__: FIFA World Cup tournaments held in France.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  host_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

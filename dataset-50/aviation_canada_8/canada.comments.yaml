__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
international_airports:
  __table__: Airports located in Canada.
  airport: Identifier for the airport.
  terminal_name: Name of the airport.
  airport_code: IATA three-letter airport code.
  elevation_above_sea_level_m: Elevation of the airport above sea level in meters.
  passenger_count: Annual passenger count (most recent reported value).
  airport_area_km2: Total area of the airport in square kilometers.
  tz_offset: UTC offset of the airport's timezone in hours.
  inception: Date the airport was opened or established.
  coords: Geographic coordinates of the airport.
  nearest_city: City the airport serves.
  host_country: Country the airport is located in.
aviation_companies:
  __table__: Airlines headquartered in Canada.
  carrier_id: Identifier for the airline.
  title: Name of the airline.
  country: Country where the airline is headquartered.
  founding_date: Date the airline was founded.
  staff: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  parent_company: Parent company or holding group.
  iata: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  registered_office: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  hub: A hub airport of the airline.
flying_machines:
  __table__: Individual aircraft operated by airlines based in Canada.
  aircraft: Identifier for the aircraft.
  label: Name or registration of the aircraft.
  operator: Airline operating the aircraft.
  registration_country: Country of the operating airline.
  model: Aircraft model type (e.g. Boeing 737-800).
  maker: Manufacturer of the aircraft.
  maiden_flight: Date of the aircraft's first flight.
  seating_capacity: Maximum passenger capacity.
  speed: Cruise speed in kilometers per hour.
  wing_width_m: Wingspan in meters.
  fuselage_length_m: Length of the aircraft in meters.
  takeoff_weight_kg: Maximum takeoff weight in kilograms.
air_disasters:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  crash_id: Identifier for the aviation accident.
  label: Name or description of the accident.
  operator: Airline involved in the accident.
  country: Country where the accident occurred.
  accident_date: Date of the accident.
  fatalities: Number of fatalities in the accident.
  number_of_survivors: Number of survivors.
  flight_designation: Flight number of the aircraft involved.

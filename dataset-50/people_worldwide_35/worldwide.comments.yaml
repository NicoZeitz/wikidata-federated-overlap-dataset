__database__: People database covering Worldwide, including persons, awards, and prize
  records.
notable_persons:
  __table__: Persons from Worldwide.
  person: Identifier for the person.
  display_name: Full name of the person.
  biological_sex: Sex of the person.
  birth_day: Date of birth.
  death_date: Date of death (null if still living or unknown).
  first_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  citizenship: Country of citizenship.
  country_of_birth: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  university: Name of institution where the person studied.
  height_cm: Height of the person in centimeters.
  child_count: Number of children the person has.
  brothers_and_sisters: Number of siblings the person has.
decorations:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  distinction_name: Name of the award.
  origin_country: Country the award originates from.
  first_awarded: Year the award was first presented.
  namesake: Person or entity the award is named after.
  url: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  person: Person who received the award.
  distinction: Award received by the person.
  award_year: Year the award was received.

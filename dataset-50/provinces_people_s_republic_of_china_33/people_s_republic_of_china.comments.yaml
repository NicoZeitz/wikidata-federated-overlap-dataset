__database__: Provinces database covering China.
chinese_provinces:
  __table__: Administrative divisions of China.
  province: Identifier for the Chinese province or administrative region.
  nation: Country the province belongs to.
  label: Name of the Chinese province or administrative region.
  lat_lon: Geographic coordinates of the province centroid.
  area: Total area of the province in square kilometers.
  pop: Population of the province (most recent estimate).
  main_city: Capital city of the province.
  inception: Date the province was established.
  region_code: ISO 3166-2 code of the province (e.g. CN-HE).
  homepage: Official website of the provincial government.

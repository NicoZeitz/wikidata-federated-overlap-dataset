__database__: People database covering Worldwide, including persons, awards, and prize
  records.
humans:
  __table__: Persons from Worldwide.
  person: Identifier for the person.
  full_name: Full name of the person.
  sex: Sex of the person.
  born: Date of birth.
  died: Date of death (null if still living or unknown).
  forename: Given (first) name of the person.
  paternal_name: Family (last) name of the person.
  country_of_citizenship: Country of citizenship.
  birth_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  height: Height of the person in centimeters.
  child_count: Number of children the person has.
  brothers_and_sisters: Number of siblings the person has.
decorations:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  honor_name: Name of the award.
  origin_country: Country the award originates from.
  founded: Year the award was first presented.
  organizer: Organization that confers the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  person_id: Person who received the award.
  distinction: Award received by the person.
  award_year: Year the award was received.

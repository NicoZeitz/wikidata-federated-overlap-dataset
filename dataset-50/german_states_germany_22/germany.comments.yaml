__database__: German states database covering Germany.
german_administrative_regions:
  __table__: The 16 German federal states (Bundesländer).
  state_id: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  label: Name of the German federal state.
  coordinates: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  inhabitants: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  established: Date the state was established or re-established.
  region_code: ISO 3166-2 code of the state (e.g. DE-BY).
  government_website: Official website of the state government.

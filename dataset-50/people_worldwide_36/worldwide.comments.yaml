__database__: People database covering Worldwide, including persons, awards, and prize
  records.
persons:
  __table__: Persons from Worldwide.
  human_id: Identifier for the person.
  display_name: Full name of the person.
  biological_sex: Sex of the person.
  date_of_birth: Date of birth.
  dod: Date of death (null if still living or unknown).
  christian_name: Given (first) name of the person.
  last_name: Family (last) name of the person.
  passport_country: Country of citizenship.
  birthplace_country: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  stature: Height of the person in centimeters.
  child_count: Number of children the person has.
  siblings: Number of siblings the person has.
prizes:
  __table__: Awards from Worldwide.
  prize_id: Identifier for the award.
  prize_name: Name of the award.
  country: Country the award originates from.
  inception: Year the award was first presented.
  honoree: Person or entity the award is named after.
  official_website: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  recipient: Person who received the award.
  award_id: Award received by the person.
  prize_year: Year the award was received.

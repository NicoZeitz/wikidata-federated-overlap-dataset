__database__: Geographic database covering Indonesia, including countries, continents,
  and cities.
kingdoms:
  __table__: Sovereign countries in Indonesia.
  country: Identifier for the country.
  title: Name of the country.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  surface_area_km2: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  capital: Capital city.
  currency_name: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  international_dialing_code: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  birth_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  monetary_authority: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  depression_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  national_languages: Comma-separated official languages of the country.
  head_of_state_name: Current head of state of the country.
  government_leader: Current head of government of the country.
major_regions:
  __table__: Continents covering Indonesia.
  identifier: Identifier for the continent.
  continent_name: Name of the continent.
  surface_area_km2: Total land area of the continent in square kilometers.
  population: Total population of the continent (most recent estimate).
  coords: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  biggest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in Indonesia.
  municipality_id: Identifier for the city.
  label: Name of the city.
  home_country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  mailing_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.
  vehicle_density: Number of registered motor vehicles per thousand inhabitants.

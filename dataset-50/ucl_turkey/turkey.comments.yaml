__database__: UEFA Champions League database covering Turkey, including clubs, matches,
  and venues.
champions_league_teams:
  __table__: Football clubs based in Turkey that participated in the UEFA Champions
    League.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  inception: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  sobriquet: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Turkey.
  game_id: Identifier for the UEFA Champions League match.
  match_name: Name or label of the match.
  season_id: Season the match was played in.
  date: Date the match was played.
  ground: Venue where the match was played.
  first_team: First participating club.
  team_b: Second participating club.
  winner: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in Turkey that hosted UEFA Champions League matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  venue_architect: Architect who designed the venue.
soccer_teams:
  __table__: Football clubs based in Turkey.
  organization_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

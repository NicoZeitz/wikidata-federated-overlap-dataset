__database__: Economics database covering United States, including companies.
companies:
  __table__: Business enterprises headquartered in United States.
  business_id: Identifier for the company.
  organization_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  inception: Date the company was founded.
  hq_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).

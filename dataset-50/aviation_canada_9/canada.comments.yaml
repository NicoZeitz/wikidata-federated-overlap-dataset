__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
terminals:
  __table__: Airports located in Canada.
  airport_id: Identifier for the airport.
  terminal_name: Name of the airport.
  iata: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  height_m: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  total_area_km2: Total area of the airport in square kilometers.
  utc_offset: UTC offset of the airport's timezone in hours.
  established: Date the airport was opened or established.
  location: Geographic coordinates of the airport.
  city_id: City the airport serves.
  host_country: Country the airport is located in.
flight_operators:
  __table__: Airlines headquartered in Canada.
  airline: Identifier for the airline.
  operator_name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  founding_date: Date the airline was founded.
  employees: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  owner: Parent company or holding group.
  iata_designator: IATA airline designator code (2-letter).
  icao_designator: ICAO airline designator code (3-letter).
  hq_city: City or location where the airline is headquartered.
  homepage: Official website of the airline.
  base_airport: A hub airport of the airline.
airliners:
  __table__: Individual aircraft operated by airlines based in Canada.
  tail_number: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  operator: Airline operating the aircraft.
  nation: Country of the operating airline.
  model_type: Aircraft model type (e.g. Boeing 737-800).
  producer: Manufacturer of the aircraft.
  first_flight: Date of the aircraft's first flight.
  total_seats: Maximum passenger capacity.
  speed_kmh: Cruise speed in kilometers per hour.
  body_length_m: Length of the aircraft in meters.
  gross_weight_kg: Maximum takeoff weight in kilograms.
accidents:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  crash_id: Identifier for the aviation accident.
  incident_name: Name or description of the accident.
  airline_name: Airline involved in the accident.
  country_of_occurrence: Country where the accident occurred.
  occurrence_date: Date of the accident.
  victims: Number of fatalities in the accident.
  alive: Number of survivors.

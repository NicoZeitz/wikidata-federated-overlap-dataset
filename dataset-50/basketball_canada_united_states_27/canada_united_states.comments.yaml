__database__: NBA basketball database covering Canada + United States, including teams
  and games.
basketball_teams:
  __table__: NBA basketball teams based in Canada + United States.
  club_id: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  nation: Country the team is based in.
  location: City the team is based in.
  home_city_name: Name of the city the team is based in.
  province: US state or province the team is based in.
  founding_date: Year the team was founded or established.
  stadium: Home arena or venue of the team.
  trainer: Current head coach of the team.
  official_website: Official website URL of the team.
  online_followers: Number of social media followers of the team.
basketball_matches:
  __table__: NBA basketball games played in Canada + United States.
  game_id: Identifier for the NBA game.
  host_country: Country the game was played in (always United States).
  first_team: First participating team.
  first_team_name: Name of the first participating team.
  away_team: Second participating team.
  away_team_name: Name of the second participating team.
  winning_team_name: Name of the winning team.
  venue_name: Name of the venue where the game was played.
  game_date: Date the game was played.
  crowd: Number of spectators in attendance.
  competition_season: Name or label of the NBA season the game belongs to.

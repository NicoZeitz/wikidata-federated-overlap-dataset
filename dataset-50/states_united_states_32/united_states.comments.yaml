__database__: US states database covering United States.
us_states:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  nation: Country the state belongs to.
  name: Name of the US state.
  lat_lon: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  population_count: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  admitted: Date the state was admitted to the Union.
  abbreviation: ISO 3166-2 code of the state (e.g. US-CA).
  nickname: Nickname of the state.
  url: Official website of the state government.

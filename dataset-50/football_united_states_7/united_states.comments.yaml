__database__: Football database covering United States, including matches, teams,
  venues, and tournaments.
games:
  __table__: FIFA World Cup matches played in United States.
  fixture_id: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  competition_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  host_stadium: Venue where the match was played.
  first_team: First participating team.
  home_goals: Goals scored by team1.
  team2: Second participating team.
  goals_team2: Goals scored by team2.
  winning_team: Winning team (null for draws).
  audience: Number of spectators in attendance.
  referee: Person who refereed the match.
squads:
  __table__: National football teams from United States.
  team: Identifier for the national football team.
  label: Name of the team.
  represented_country: Country the team represents.
  founded: Year the team was founded.
  native_label: Official name of the team in its native language.
  nickname: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  tier: Competition class or league the team participates in.
  coach: Current head coach of the team.
  captain: Current team captain.
venues:
  __table__: Stadiums and arenas in United States that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  title: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in United States.
  tournament: Identifier for the FIFA World Cup tournament edition.
  competition_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  qualified_teams: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

__database__: UEFA Champions League database covering Spain, including clubs, matches,
  and venues.
european_clubs:
  __table__: Football clubs based in Spain that participated in the UEFA Champions
    League.
  organization_id: Identifier for the football club.
  team_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_date: Date or year the club was founded.
  proprietor: Name of the current owner or ownership group.
  title_count: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Spain.
  fixture_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  ucl_season: Season the match was played in.
  fixture_date: Date the match was played.
  venue: Venue where the match was played.
  first_team: First participating club.
  team2: Second participating club.
  winner: Winning club (null for draws).
  spectators: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Spain that hosted UEFA Champions League matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  architect: Architect who designed the venue.
soccer_teams:
  __table__: Football clubs based in Spain.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  established: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  head_coach: Name of the current head coach or manager.
  club_owner: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

__database__: Football database covering Western Europe, including matches, teams,
  venues, and tournaments.
matches:
  __table__: FIFA World Cup matches played in Western Europe.
  fixture_id: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  kickoff_date: Date the match was played.
  competition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  stadium: Venue where the match was played.
  team1: First participating team.
  goals_team1: Goals scored by team1.
  side_two: Second participating team.
  score_team2: Goals scored by team2.
  winner: Winning team (null for draws).
  audience: Number of spectators in attendance.
  official: Person who refereed the match.
teams:
  __table__: National football teams from Western Europe.
  squad_id: Identifier for the national football team.
  title: Name of the team.
  country: Country the team represents.
  founded: Year the team was founded.
  alias: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  coach: Current head coach of the team.
  team_captain: Current team captain.
grounds:
  __table__: Stadiums and arenas in Western Europe that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  label: Name of the venue or stadium.
  nation: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
competitions:
  __table__: FIFA World Cup tournaments held in Western Europe.
  edition_id: Identifier for the FIFA World Cup tournament edition.
  title: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd World Cup).
  participants: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

__database__: Provinces database covering China.
china_provinces:
  __table__: Administrative divisions of China.
  province: Identifier for the Chinese province or administrative region.
  parent_country: Country the province belongs to.
  name: Name of the Chinese province or administrative region.
  location: Geographic coordinates of the province centroid.
  area_km2: Total area of the province in square kilometers.
  residents: Population of the province (most recent estimate).
  provincial_capital: Capital city of the province.
  founded: Date the province was established.
  province_code: ISO 3166-2 code of the province (e.g. CN-HE).

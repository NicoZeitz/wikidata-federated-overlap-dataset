__database__: Football database covering Worldwide, including matches, teams, venues,
  and tournaments.
world_cup_matches:
  __table__: FIFA World Cup matches played in Worldwide.
  match_id: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  fixture_date: Date the match was played.
  competition: Tournament this match belongs to.
  stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  team1: First participating team.
  score_team1: Goals scored by team1.
  side_two: Second participating team.
  away_goals: Goals scored by team2.
  winner: Winning team (null for draws).
  fans: Number of spectators in attendance.
  arbiter: Person who refereed the match.
national_squads:
  __table__: National football teams from Worldwide.
  team_id: Identifier for the national football team.
  title: Name of the team.
  country: Country the team represents.
  founded: Year the team was founded.
  sobriquet: Comma-separated nicknames of the team.
  ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  manager: Current head coach of the team.
  team_captain: Current team captain.
venues:
  __table__: Stadiums and arenas in Worldwide that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  seats: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  architect: Architect who designed the venue.
championships:
  __table__: FIFA World Cup tournaments held in Worldwide.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  title: Name of the tournament (e.g. 1966 FIFA World Cup).
  host_year: Year the tournament was held.
  nation: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  official_mascot: Official mascot of the tournament.
  num_participants: Number of teams participating in the tournament.
  cup_winner: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

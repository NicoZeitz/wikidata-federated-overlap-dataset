__database__: NBA basketball database covering United States, including teams and
  games.
nba_clubs:
  __table__: NBA basketball teams based in United States.
  club_id: Identifier for the NBA team.
  name: Full name of the NBA team.
  base_country: Country the team is based in.
  location: City the team is based in.
  location_name: Name of the city the team is based in.
  team_state: US state or province the team is based in.
  founding_year: Year the team was founded or established.
  manager: Current head coach of the team.
  homepage: Official website URL of the team.
  fan_following: Number of social media followers of the team.
nba_matches:
  __table__: NBA basketball games played in United States.
  game: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team_a: First participating team.
  second_team: Second participating team.
  winner: Name of the winning team.
  arena_name: Name of the venue where the game was played.
  played_on: Date the game was played.
  crowd: Number of spectators in attendance.
  seasonLabel: Name or label of the NBA season the game belongs to.

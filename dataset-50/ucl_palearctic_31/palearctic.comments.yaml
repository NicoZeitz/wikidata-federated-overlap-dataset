__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
cl_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  team_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  informal_name: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  web_address: Official website URL of the club.
  acronym: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  fixture_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  season_id: Season the match was played in.
  seasonLabel: Name or label of the season.
  match_date: Date the match was played.
  match_venue: Venue where the match was played.
  first_team: First participating club.
  team2: Second participating club.
  match_winner: Winning club (null for draws).
  spectators: Number of spectators in attendance.
  referee: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  stadium_id: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founded: Date or year the club was founded.
  investor: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  url: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

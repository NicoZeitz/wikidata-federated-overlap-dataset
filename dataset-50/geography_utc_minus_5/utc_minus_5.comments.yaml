__database__: Geographic database covering UTC-5 countries (Eastern / Peru / Colombia),
  including countries, continents, and cities.
sovereign_states:
  __table__: Sovereign countries in UTC-5 countries (Eastern / Peru / Colombia).
  country_id: Identifier for the country.
  title: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  people: Population of the country (most recent estimate).
  gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  governmental_center: Capital city.
  currency: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  calling_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  tfr: Average number of children born per woman.
  crude_birth_rate: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  national_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  spoken_languages: Comma-separated official languages of the country.
  state_leader: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
continents:
  __table__: Continents covering UTC-5 countries (Eastern / Peru / Colombia).
  continent: Identifier for the continent.
  label: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_peak: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  minimum_elevation_point: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  biggest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
communities:
  __table__: Cities and human settlements located in UTC-5 countries (Eastern / Peru
    / Colombia).
  city_id: Identifier for the city.
  name: Name of the city.
  city_country: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  founded: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  post_code: Postal or ZIP code of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  income_per_capita: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.
  car_ownership_rate: Number of registered motor vehicles per thousand inhabitants.

__database__: German states database covering Germany.
german_regions:
  __table__: The 16 German federal states (Bundesländer).
  bundesland_id: Identifier for the German federal state.
  country: Country the federal state belongs to.
  label: Name of the German federal state.
  lat_lon: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  landeshauptstadt: Capital city of the state.
  inception: Date the state was established or re-established.
  region_code: ISO 3166-2 code of the state (e.g. DE-BY).
  official_website: Official website of the state government.

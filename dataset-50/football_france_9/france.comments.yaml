__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
football_matches:
  __table__: FIFA World Cup matches played in France.
  match: Identifier for the FIFA World Cup match.
  fixture_name: Name or label of the match.
  date: Date the match was played.
  tournament: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  arena: Venue where the match was played.
  side_one: First participating team.
  home_goals: Goals scored by team1.
  team_b: Second participating team.
  away_goals: Goals scored by team2.
  champion: Winning team (null for draws).
  gate: Number of spectators in attendance.
  match_referee: Person who refereed the match.
teams:
  __table__: National football teams from France.
  squad_id: Identifier for the national football team.
  team_name: Name of the team.
  nation: Country the team represents.
  founding_date: Year the team was founded.
  current_ranking: FIFA world ranking of the team.
  tier: Competition class or league the team participates in.
  manager: Current head coach of the team.
  skipper: Current team captain.
sports_venues:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
editions:
  __table__: FIFA World Cup tournaments held in France.
  edition_id: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  edition_year: Year the tournament was held.
  hosting_country: Host country of the tournament.
  edition_no: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  tournament_mascot: Official mascot of the tournament.
  teams: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
world_cup_games:
  __table__: FIFA World Cup matches played in France.
  fixture_id: Identifier for the FIFA World Cup match.
  name: Name or label of the match.
  kickoff_date: Date the match was played.
  event: Tournament this match belongs to.
  competition_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  stadium: Venue where the match was played.
  home_team: First participating team.
  home_goals: Goals scored by team1.
  away_team: Second participating team.
  goals_team2: Goals scored by team2.
  winner: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  arbiter: Person who refereed the match.
international_teams:
  __table__: National football teams from France.
  team_id: Identifier for the national football team.
  name: Name of the team.
  team_country: Country the team represents.
  founded: Year the team was founded.
  local_name: Official name of the team in its native language.
  informal_name: Comma-separated nicknames of the team.
  rank: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  head_coach: Current head coach of the team.
  captain: Current team captain.
football_stadiums:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  title: Name of the venue or stadium.
  nation: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  designer: Architect who designed the venue.
tournaments:
  __table__: FIFA World Cup tournaments held in France.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  competition_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  edition_year: Year the tournament was held.
  nation: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  tournament_mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  winning_team: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goal_count: Total number of goals scored across all matches.

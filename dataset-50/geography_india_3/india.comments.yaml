__database__: Geographic database covering India, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in India.
  country_id: Identifier for the country.
  country_name: Name of the country.
  alpha2: ISO 3166-1 alpha-2 two-letter country code.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  total_population: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  seat_of_government: Capital city.
  monetary_unit: Name of the official currency.
  location: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  country_code_phone: International telephone dialling code (e.g. +49).
  male_population: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  life_exp: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  jobless_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  total_fertility_rate: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  monetary_authority: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  languages: Comma-separated official languages of the country.
  head_of_state_name: Current head of state of the country.
  premier: Current head of government of the country.
landmasses:
  __table__: Continents covering India.
  id: Identifier for the continent.
  region_name: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  highest_altitude_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  lowest_altitude_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_city: Most populous urban area on the continent.
  unenrolled_children: Estimated number of school-age children not enrolled in school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in India.
  municipality_id: Identifier for the city.
  settlement_name: Name of the city.
  city_country: Country the city is located in.
  people: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  income_per_capita: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.

__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
world_cup_fixtures:
  __table__: FIFA World Cup matches played in France.
  match: Identifier for the FIFA World Cup match.
  game_name: Name or label of the match.
  kickoff_date: Date the match was played.
  tournament: Tournament this match belongs to.
  competition_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  side_one: First participating team.
  home_goals: Goals scored by team1.
  second_team: Second participating team.
  team2_score: Goals scored by team2.
  victor: Winning team (null for draws).
  gate: Number of spectators in attendance.
  match_referee: Person who refereed the match.
national_football_teams:
  __table__: National football teams from France.
  squad_id: Identifier for the national football team.
  label: Name of the team.
  nation: Country the team represents.
  established: Year the team was founded.
  local_label: Official name of the team in its native language.
  nickname: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  team_captain: Current team captain.
venues:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  name: Name of the venue or stadium.
  country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  venue_city: City or municipality the venue is located in.
  venue_architect: Architect who designed the venue.
competitions:
  __table__: FIFA World Cup tournaments held in France.
  competition_id: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  edition_year: Year the tournament was held.
  hosting_country: Host country of the tournament.
  edition_number: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  official_mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  winning_team: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

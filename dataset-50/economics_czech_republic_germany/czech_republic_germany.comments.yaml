__database__: Economics database covering Czech Republic + Germany, including companies.
enterprises:
  __table__: Business enterprises headquartered in Czech Republic + Germany.
  company: Identifier for the company.
  business_name: Name of the company.
  home_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  founded: Date the company was founded.
  url: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  revenue: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

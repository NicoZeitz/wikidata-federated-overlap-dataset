__database__: German states database covering Germany.
german_administrative_regions:
  __table__: The 16 German federal states (Bundesländer).
  german_state: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  region_name: Name of the German federal state.
  geo_coords: Geographic coordinates of the state centroid.
  area_km2: Total area of the state in square kilometers.
  population_count: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  established: Date the state was established or re-established.
  region_code: ISO 3166-2 code of the state (e.g. DE-BY).
  homepage: Official website of the state government.

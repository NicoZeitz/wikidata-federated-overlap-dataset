__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founded: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  club_owner: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  competition_season_id: Season the match was played in.
  date: Date the match was played.
  venue: Venue where the match was played.
  team1: First participating club.
  team_b: Second participating club.
  winning_team: Winning club (null for draws).
  spectators: Number of spectators in attendance.
  umpire: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  label: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
football_teams:
  __table__: Football clubs based in Palearctic ecozone.
  organization_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founded: Date or year the club was founded.
  arena: Name of the club's home stadium.
  nickname: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  club_abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

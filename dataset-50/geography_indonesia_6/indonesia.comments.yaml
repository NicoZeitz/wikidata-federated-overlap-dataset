__database__: Geographic database covering Indonesia, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in Indonesia.
  nation_id: Identifier for the country.
  label: Name of the country.
  iso2_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  total_area_km2: Total area of the country in square kilometers.
  population: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city_id: Capital city.
  currency: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  phone_code: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  women_population: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_income_usd: Median household or personal income in US dollars.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank_name: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  head_of_state_name: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
continents:
  __table__: Continents covering Indonesia.
  id: Identifier for the continent.
  name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  highest_peak: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
towns:
  __table__: Cities and human settlements located in Indonesia.
  city_id: Identifier for the city.
  label: Name of the city.
  city_country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  income_per_capita: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  size_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

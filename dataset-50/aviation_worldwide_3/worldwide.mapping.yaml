air_hubs:
  source: airports
  columns:
    aerodrome_id: airport
    aerodrome_name: name
    three_letter_code: iata_code
    icao_identifier: icao_code
    elevation_m: elevation_m
    passenger_traffic: passengers
    total_area_km2: airport_area_km2
    gmt_offset: timezone_offset
    start_date: inception
    location: coords
    served_city: city
    airport_country: country
commercial_airlines:
  source: airlines
  columns:
    carrier_id: airline
    airline_name: name
    home_country: country
    founded: inception
    personnel_count: employees
    revenue_usd: revenue_usd

    hq: headquarters
    official_website: website
    home_airport: hub_airport
airliners:
  source: aircraft
  columns:
    aircraft: aircraft
    label: name
    operating_carrier: operator
    country: country
    model_type: model
    producer: manufacturer
    first_flight: first_flight
    seats: max_passengers
    wing_width_m: wingspan_m
    body_length_m: length_m
    max_gross_weight_kg: max_takeoff_weight_kg
air_crashes:
  source: accidents
  columns:
    accident_id: accident
    accident_name: name
    carrier: airline
    location_country: country

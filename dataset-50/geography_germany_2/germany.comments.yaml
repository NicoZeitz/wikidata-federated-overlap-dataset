__database__: Geographic database covering Germany, including countries, continents,
  and cities.
states:
  __table__: Sovereign countries in Germany.
  nation_id: Identifier for the country.
  title: Name of the country.
  continent: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  economic_output_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  seat_of_government: Capital city.
  currency: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  phone_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  average_life_expectancy: Average life expectancy at birth in years.
  human_development_index: Human Development Index score (0–1).
  unemployment_pct: Unemployment rate as a percentage of the labour force.
  income_inequality: Gini coefficient measuring income inequality (0–1).
  total_fertility_rate: Average number of children born per woman.
  birth_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  reserve_bank: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  national_languages: Comma-separated official languages of the country.
  president: Current head of state of the country.
  chancellor: Current head of government of the country.
world_divisions:
  __table__: Continents covering Germany.
  id: Identifier for the continent.
  label: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  geo_coords: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  un_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in Germany.
  city_id: Identifier for the city.
  city_name: Name of the city.
  nation: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  location: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  zip: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  city_gdp: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  height_m: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  vehicle_density: Number of registered motor vehicles per thousand inhabitants.

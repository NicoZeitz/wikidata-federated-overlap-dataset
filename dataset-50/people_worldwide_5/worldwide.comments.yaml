__database__: People database covering Worldwide, including persons, awards, and prize
  records.
individuals:
  __table__: Persons from Worldwide.
  human_id: Identifier for the person.
  name: Full name of the person.
  biological_sex: Sex of the person.
  birth_date: Date of birth.
  death_date: Date of death (null if still living or unknown).
  personal_name: Given (first) name of the person.
  surname: Family (last) name of the person.
  citizenship: Country of citizenship.
  birthplace_country: Country of birth.
  home_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  institution: Name of institution where the person studied.
  sibling_count: Number of siblings the person has.
accolades:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  distinction_name: Name of the award.
  country: Country the award originates from.
  established: Year the award was first presented.
  conferred_by: Organization that confers the award.
  honoree: Person or entity the award is named after.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  person: Person who received the award.
  accolade: Award received by the person.
  year_awarded: Year the award was received.

__database__: Geographic database covering India, including countries, continents,
  and cities.
states:
  __table__: Sovereign countries in India.
  nation_id: Identifier for the country.
  state_name: Name of the country.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  continent_id: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city_id: Capital city.
  currency_name: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  official_name: Official name of the country in English.
  phone_code: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  income_inequality: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  national_bank: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  languages: Comma-separated official languages of the country.
  state_leader: Current head of state of the country.
  premier: Current head of government of the country.
landmasses:
  __table__: Continents covering India.
  continent: Identifier for the continent.
  landmass_name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  inhabitants: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  summit_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  biggest_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
urban_areas:
  __table__: Cities and human settlements located in India.
  settlement_id: Identifier for the city.
  city_name: Name of the city.
  country: Country the city is located in.
  inhabitants: Population of the city (most recent estimate).
  geo_coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation_m: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
republics:
  __table__: Sovereign countries in Worldwide.
  nation_id: Identifier for the country.
  territory_name: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  territory_size_km2: Total area of the country in square kilometers.
  population: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  seat_of_government: Capital city.
  legal_tender: Name of the official currency.
  centroid: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  male_count: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  human_development_index: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  tfr: Average number of children born per woman.
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  democracy_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  national_bank: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  spoken_languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
continents:
  __table__: Continents covering Worldwide.
  continent: Identifier for the continent.
  name: Name of the continent.
  surface_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  location: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
urban_areas:
  __table__: Cities and human settlements located in Worldwide.
  city_id: Identifier for the city.
  settlement_name: Name of the city.
  country: Country the city is located in.
  residents: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  zip_code: Postal or ZIP code of the city.
  economic_output: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  size_km2: Total area of the city in square kilometers.

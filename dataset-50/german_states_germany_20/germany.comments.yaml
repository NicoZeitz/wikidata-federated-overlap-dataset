__database__: German states database covering Germany.
laender:
  __table__: The 16 German federal states (Bundesländer).
  state_id: Identifier for the German federal state.
  country: Country the federal state belongs to.
  federal_state_name: Name of the German federal state.
  centroid: Geographic coordinates of the state centroid.
  surface_area_km2: Total area of the state in square kilometers.
  pop: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  founding_date: Date the state was established or re-established.
  website: Official website of the state government.

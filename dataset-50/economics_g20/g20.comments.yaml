__database__: Economics database covering G20 countries, including companies.
entities:
  __table__: Business enterprises headquartered in G20 countries.
  firm_id: Identifier for the company.
  organization_name: Name of the company.
  home_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  start_date: Date the company was founded.
  url: Official website URL of the company.
  base_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  staff_count: Number of employees (most recent reported value).
  sales_usd: Annual revenue in US dollars (most recent reported value).
  profit_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  market_capitalization_usd: Market capitalization in US dollars (most recent reported
    value).

__database__: Geographic database covering Indomalayan ecozone, including countries,
  continents, and cities.
territories:
  __table__: Sovereign countries in Indomalayan ecozone.
  nation_id: Identifier for the country.
  label: Name of the country.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  residents: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  seat_of_government: Capital city.
  legal_tender: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  calling_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  joblessness_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  birth_rate_per_woman: Average number of children born per woman.
  birth_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_income: Median household or personal income in US dollars.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  westmost_coords: Geographic coordinates of the westernmost point of the country.
  state_languages: Comma-separated official languages of the country.
  chief_of_state: Current head of state of the country.
  premier: Current head of government of the country.
world_regions:
  __table__: Continents covering Indomalayan ecozone.
  identifier: Identifier for the continent.
  label: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  highest_point: Name of the highest geographical point on the continent.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  m49_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
communities:
  __table__: Cities and human settlements located in Indomalayan ecozone.
  municipality_id: Identifier for the city.
  municipality_name: Name of the city.
  country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  informal_name: Comma-separated informal names or nicknames of the city.
  postal_code: Postal or ZIP code of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  city_gdp: Nominal GDP of the city in US dollars.
  mean_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

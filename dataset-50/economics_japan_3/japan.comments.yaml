__database__: Economics database covering Japan, including companies.
enterprises:
  __table__: Business enterprises headquartered in Japan.
  company_id: Identifier for the company.
  name: Name of the company.
  home_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  inception: Date the company was founded.
  official_website: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  employees: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

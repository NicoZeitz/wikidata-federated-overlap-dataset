__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
aerodromes:
  __table__: Airports located in Canada.
  aerodrome_id: Identifier for the airport.
  airport_name: Name of the airport.
  three_letter_code: IATA three-letter airport code.
  icao: ICAO four-letter airport code.
  height_metres: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  utc_offset: UTC offset of the airport's timezone in hours.
  founded: Date the airport was opened or established.
  position: Geographic coordinates of the airport.
  city: City the airport serves.
  host_country: Country the airport is located in.
flight_operators:
  __table__: Airlines headquartered in Canada.
  airline: Identifier for the airline.
  name: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  creation_date: Date the airline was founded.
  workforce_size: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  holding_company: Parent company or holding group.
  iata: IATA airline designator code (2-letter).
  icao: ICAO airline designator code (3-letter).
  hq: City or location where the airline is headquartered.
  web_address: Official website of the airline.
  base_airport: A hub airport of the airline.
aircraft_fleet:
  __table__: Individual aircraft operated by airlines based in Canada.
  tail_number: Identifier for the aircraft.
  aircraft_registration: Name or registration of the aircraft.
  air_operator: Airline operating the aircraft.
  registration_country: Country of the operating airline.
  aircraft_type: Aircraft model type (e.g. Boeing 737-800).
  maker: Manufacturer of the aircraft.
  maiden_flight: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  wingspan_m: Wingspan in meters.
  fuselage_length_m: Length of the aircraft in meters.
  max_weight_kg: Maximum takeoff weight in kilograms.
air_disasters:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  incident_id: Identifier for the aviation accident.
  name: Name or description of the accident.
  flight_operator: Airline involved in the accident.
  nation: Country where the accident occurred.
  incident_date: Date of the accident.
  deaths: Number of fatalities in the accident.
  alive: Number of survivors.

__database__: UEFA Champions League database covering Belgium + France, including
  clubs, matches, and venues.
ucl_clubs:
  __table__: Football clubs based in Belgium + France that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  established: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  alias: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  web_address: Official website URL of the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Belgium + France.
  game_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season_name: Name or label of the season.
  fixture_date: Date the match was played.
  match_venue: Venue where the match was played.
  first_team: First participating club.
  team_b: Second participating club.
  victor: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  match_referee: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in Belgium + France that hosted UEFA Champions League
    matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Belgium + France.
  organization_id: Identifier for the football club.
  title: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_year: Date or year the club was founded.
  stadium: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  league_titles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  founding_person: Name of the person or entity who founded the club.

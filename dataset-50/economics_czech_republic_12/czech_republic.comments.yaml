__database__: Economics database covering Czech Republic, including companies.
organizations:
  __table__: Business enterprises headquartered in Czech Republic.
  company_id: Identifier for the company.
  organization_name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  legal_structure: Legal form or structure of the company.
  start_date: Date the company was founded.
  web_address: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  sales_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).
  valuation_usd: Market capitalization in US dollars (most recent reported value).

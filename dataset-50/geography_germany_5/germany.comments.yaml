__database__: Geographic database covering Germany, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in Germany.
  country_id: Identifier for the country.
  territory_name: Name of the country.
  two_letter_country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  governmental_center: Capital city.
  monetary_unit: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  founding_date: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  men_population: Male population count (most recent estimate).
  population_female: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  deaths_per_1000: Number of deaths per 1000 inhabitants per year.
  suicides_per_100000: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank_name: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  national_languages: Comma-separated official languages of the country.
  head_of_state_name: Current head of state of the country.
  premier: Current head of government of the country.
continents:
  __table__: Continents covering Germany.
  continent_id: Identifier for the continent.
  continent_name: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  lat_lon: Geographic coordinates of the continent centroid.
  maximum_elevation_point: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  depression_depth_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in Germany.
  municipality_id: Identifier for the city.
  label: Name of the city.
  city_country: Country the city is located in.
  residents: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  mean_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

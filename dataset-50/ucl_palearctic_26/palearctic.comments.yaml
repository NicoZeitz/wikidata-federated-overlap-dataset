__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
european_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  inception: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  website: Official website URL of the club.
  founding_person: Name of the person or entity who founded the club.
champions_league_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season_name: Name or label of the season.
  played_on: Date the match was played.
  venue: Venue where the match was played.
  first_team: First participating club.
  away_team: Second participating club.
  match_winner: Winning club (null for draws).
  gate: Number of spectators in attendance.
  match_referee: Person who refereed the match.
ucl_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  organization_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  established: Date or year the club was founded.
  ground: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  ownership: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  website: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

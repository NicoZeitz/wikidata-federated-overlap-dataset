__database__: Aviation database covering Brunei + Indonesia, including airports, airlines,
  aircraft, and accidents.
flight_hubs:
  __table__: Airports located in Brunei + Indonesia.
  aerodrome_id: Identifier for the airport.
  airfield_name: Name of the airport.
  three_letter_code: IATA three-letter airport code.
  four_letter_code: ICAO four-letter airport code.
  elevation_m: Elevation of the airport above sea level in meters.
  passenger_traffic: Annual passenger count (most recent reported value).
  gmt_offset: UTC offset of the airport's timezone in hours.
  opening_date: Date the airport was opened or established.
  coordinates: Geographic coordinates of the airport.
  serving_city: City the airport serves.
  airport_country: Country the airport is located in.
air_operators:
  __table__: Airlines headquartered in Brunei + Indonesia.
  airline: Identifier for the airline.
  label: Name of the airline.
  headquarters_country: Country where the airline is headquartered.
  foundation_date: Date the airline was founded.
  staff: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  total_aircraft: Number of aircraft in the fleet.
  holding_company: Parent company or holding group.
  iata_code: IATA airline designator code (2-letter).
  three_letter_code: ICAO airline designator code (3-letter).
  headquarters: City or location where the airline is headquartered.
  official_website: Official website of the airline.
  hub_airport: A hub airport of the airline.
flying_machines:
  __table__: Individual aircraft operated by airlines based in Brunei + Indonesia.
  plane_id: Identifier for the aircraft.
  name: Name or registration of the aircraft.
  carrier: Airline operating the aircraft.
  nation: Country of the operating airline.
  model: Aircraft model type (e.g. Boeing 737-800).
  aircraft_manufacturer: Manufacturer of the aircraft.
  first_flight_date: Date of the aircraft's first flight.
  max_passengers: Maximum passenger capacity.
  cruise_speed_kmh: Cruise speed in kilometers per hour.
  wing_span_m: Wingspan in meters.
  fuselage_length_m: Length of the aircraft in meters.
  mtow_kg: Maximum takeoff weight in kilograms.
flight_accidents:
  __table__: Aviation accidents involving airlines that occurred in Brunei + Indonesia.
  event_id: Identifier for the aviation accident.
  name: Name or description of the accident.
  airline: Airline involved in the accident.
  crash_country: Country where the accident occurred.
  event_date: Date of the accident.
  deaths: Number of fatalities in the accident.
  alive: Number of survivors.

__database__: People database covering Worldwide, including persons, awards, and prize
  records.
celebrities:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  display_name: Full name of the person.
  sex_at_birth: Sex of the person.
  birthday: Date of birth.
  died: Date of death (null if still living or unknown).
  first_name: Given (first) name of the person.
  family_name: Family (last) name of the person.
  nationality: Country of citizenship.
  birth_country: Country of birth.
  country: Country associated with the person (citizenship if known, otherwise country
    of birth).
  school: Name of institution where the person studied.
  height_cm: Height of the person in centimeters.
  number_of_children: Number of children the person has.
  brothers_and_sisters: Number of siblings the person has.
trophies:
  __table__: Awards from Worldwide.
  award_id: Identifier for the award.
  title: Name of the award.
  origin_country: Country the award originates from.
  created: Year the award was first presented.
  namesake: Person or entity the award is named after.
  homepage: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  awardee: Person who received the award.
  prize: Award received by the person.
  award_year: Year the award was received.

__database__: Football database covering Germany, including matches, teams, venues,
  and tournaments.
fixtures:
  __table__: FIFA World Cup matches played in Germany.
  match: Identifier for the FIFA World Cup match.
  name: Name or label of the match.
  game_date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  stadium: Venue where the match was played.
  side_one: First participating team.
  team1_score: Goals scored by team1.
  team2: Second participating team.
  goals_team2: Goals scored by team2.
  winning_team: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  umpire: Person who refereed the match.
international_teams:
  __table__: National football teams from Germany.
  team_id: Identifier for the national football team.
  label: Name of the team.
  team_country: Country the team represents.
  established: Year the team was founded.
  local_label: Official name of the team in its native language.
  fifa_ranking: FIFA world ranking of the team.
  competition_level: Competition class or league the team participates in.
  manager: Current head coach of the team.
  leader: Current team captain.
arenas:
  __table__: Stadiums and arenas in Germany that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  title: Name of the venue or stadium.
  host_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
editions:
  __table__: FIFA World Cup tournaments held in Germany.
  tournament: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  official_mascot: Official mascot of the tournament.
  teams: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  match_count: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

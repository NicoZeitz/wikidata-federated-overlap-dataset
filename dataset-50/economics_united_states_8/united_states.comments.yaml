__database__: Economics database covering United States, including companies.
organizations:
  __table__: Business enterprises headquartered in United States.
  company: Identifier for the company.
  business_name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  founded: Date the company was founded.
  headquarters_city: City where the company is headquartered.
  chief_executive: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_income_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).
  market_value_usd: Market capitalization in US dollars (most recent reported value).

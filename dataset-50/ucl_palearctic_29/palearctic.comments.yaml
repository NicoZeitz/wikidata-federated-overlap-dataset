__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  start_year: Date or year the club was founded.
  stadium: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  title_count: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  founding_person: Name of the person or entity who founded the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  ucl_season_name: Name or label of the season.
  match_date: Date the match was played.
  ground: Venue where the match was played.
  team_a: First participating club.
  second_team: Second participating club.
  match_winner: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  inception: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  full_club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  url: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.

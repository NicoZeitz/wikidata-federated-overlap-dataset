__database__: Football database covering temperate climate countries, including matches,
  teams, venues, and tournaments.
soccer_matches:
  __table__: FIFA World Cup matches played in temperate climate countries.
  fixture_id: Identifier for the FIFA World Cup match.
  name: Name or label of the match.
  match_date: Date the match was played.
  cup_edition: Tournament this match belongs to.
  match_stage: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  team_a: First participating team.
  team1_goals: Goals scored by team1.
  team2: Second participating team.
  away_goals: Goals scored by team2.
  match_winner: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  umpire: Person who refereed the match.
soccer_teams:
  __table__: National football teams from temperate climate countries.
  squad_id: Identifier for the national football team.
  national_team_name: Name of the team.
  nation: Country the team represents.
  established: Year the team was founded.
  local_name: Official name of the team in its native language.
  sobriquet: Comma-separated nicknames of the team.
  world_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  trainer: Current head coach of the team.
  team_captain: Current team captain.
grounds:
  __table__: Stadiums and arenas in temperate climate countries that hosted FIFA World
    Cup matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
editions:
  __table__: FIFA World Cup tournaments held in temperate climate countries.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  title: Name of the tournament (e.g. 1966 FIFA World Cup).
  competition_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  edition_number: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  event_mascot: Official mascot of the tournament.
  num_participants: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  goals_scored: Total number of goals scored across all matches.

__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
european_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  established: Date or year the club was founded.
  manager: Name of the current head coach or manager.
  alias: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  official_website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  match_date: Date the match was played.
  stadium: Venue where the match was played.
  team1: First participating club.
  team_b: Second participating club.
  victor: Winning club (null for draws).
  audience: Number of spectators in attendance.
  referee: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
soccer_teams:
  __table__: Football clubs based in Palearctic ecozone.
  organization_id: Identifier for the football club.
  title: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  founding_date: Date or year the club was founded.
  coach: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  club_founder: Name of the person or entity who founded the club.

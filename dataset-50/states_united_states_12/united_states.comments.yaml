__database__: US states database covering United States.
american_states:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  country: Country the state belongs to.
  us_state_name: Name of the US state.
  geo_coords: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  capital_city: Capital city of the state.
  admitted: Date the state was admitted to the Union.
  iso: ISO 3166-2 code of the state (e.g. US-CA).
  state_nickname: Nickname of the state.
  website: Official website of the state government.

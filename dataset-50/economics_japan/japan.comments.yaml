__database__: Economics database covering Japan, including companies.
companies:
  __table__: Business enterprises headquartered in Japan.
  company_id: Identifier for the company.
  firm_name: Name of the company.
  nation: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  legal_structure: Legal form or structure of the company.
  inception: Date the company was founded.
  hq_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  workers: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).

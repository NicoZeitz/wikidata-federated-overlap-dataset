__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  nation: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  alias: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  shortName: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  fixture_id: Identifier for the UEFA Champions League match.
  fixture_name: Name or label of the match.
  season_id: Season the match was played in.
  competition_season: Name or label of the season.
  match_date: Date the match was played.
  arena: Venue where the match was played.
  home_team: First participating club.
  away_team: Second participating club.
  victor: Winning club (null for draws).
  gate: Number of spectators in attendance.
  umpire: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  arena_id: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  established: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  trainer: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  founder: Name of the person or entity who founded the club.

__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  team_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  ground: Name of the club's home stadium.
  informal_name: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
ucl_fixtures:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  competition_season_id: Season the match was played in.
  season_name: Name or label of the season.
  game_date: Date the match was played.
  stadium: Venue where the match was played.
  first_team: First participating club.
  away_team: Second participating club.
  winning_team: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  referee: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  label: Full name of the football club.
  division: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founding_year: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  byname: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  acronym: Short or abbreviated name of the club.

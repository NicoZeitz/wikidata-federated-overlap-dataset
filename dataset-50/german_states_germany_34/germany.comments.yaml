__database__: German states database covering Germany.
german_bundeslaender:
  __table__: The 16 German federal states (Bundesländer).
  german_state: Identifier for the German federal state.
  nation: Country the federal state belongs to.
  label: Name of the German federal state.
  geo_coords: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  number_of_inhabitants: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  creation_date: Date the state was established or re-established.
  url: Official website of the state government.

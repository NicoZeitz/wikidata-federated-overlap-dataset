__database__: UEFA Champions League database covering Germany, including clubs, matches,
  and venues.
champions_league_teams:
  __table__: Football clubs based in Germany that participated in the UEFA Champions
    League.
  organization_id: Identifier for the football club.
  name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  league_titles: Number of domestic league titles won by the club.
  socialFollowers: Number of social media followers of the club.
  shortName: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Germany.
  game_id: Identifier for the UEFA Champions League match.
  title: Name or label of the match.
  season_name: Name or label of the season.
  played_on: Date the match was played.
  stadium: Venue where the match was played.
  home_team: First participating club.
  away_team: Second participating club.
  winner: Winning club (null for draws).
  audience: Number of spectators in attendance.
  arbiter: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Germany that hosted UEFA Champions League matches.
  venue: Identifier for the venue.
  name: Name of the venue or stadium.
  nation: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Germany.
  team_id: Identifier for the football club.
  team_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  arena: Name of the club's home stadium.
  ownership: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

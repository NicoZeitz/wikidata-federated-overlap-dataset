__database__: Geographic database covering Indonesia, including countries, continents,
  and cities.
republics:
  __table__: Sovereign countries in Indonesia.
  nation_id: Identifier for the country.
  country_name: Name of the country.
  iso_alpha2: ISO 3166-1 alpha-2 two-letter country code.
  geographic_region: Continent the country belongs to.
  size_km2: Total area of the country in square kilometers.
  people: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city_id: Capital city.
  currency: Name of the official currency.
  geo_coords: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  full_name: Official name of the country in English.
  population_male: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  average_life_expectancy: Average life expectancy at birth in years.
  human_development_index: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  state_languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
major_regions:
  __table__: Continents covering Indonesia.
  identifier: Identifier for the continent.
  label: Name of the continent.
  total_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  location: Geographic coordinates of the continent centroid.
  maximum_elevation_point: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  school_dropout_children: Estimated number of school-age children not enrolled in
    school.
  un_region_code: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
communities:
  __table__: Cities and human settlements located in Indonesia.
  municipality_id: Identifier for the city.
  settlement_name: Name of the city.
  city_country: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  per_person_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

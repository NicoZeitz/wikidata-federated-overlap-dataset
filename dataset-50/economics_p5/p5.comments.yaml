__database__: Economics database covering UN Security Council P5, including companies.
organizations:
  __table__: Business enterprises headquartered in UN Security Council P5.
  firm_id: Identifier for the company.
  name: Name of the company.
  home_country: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  foundation_year: Date the company was founded.
  headquarters_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  employee_count: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_income_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).
  market_cap_usd: Market capitalization in US dollars (most recent reported value).

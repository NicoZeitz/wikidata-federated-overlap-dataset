__database__: Economics database covering Czech Republic, including companies.
firms:
  __table__: Business enterprises headquartered in Czech Republic.
  company_id: Identifier for the company.
  trade_name: Name of the company.
  home_country: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  creation_date: Date the company was founded.
  official_website: Official website URL of the company.
  base_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  staff: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  profit_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

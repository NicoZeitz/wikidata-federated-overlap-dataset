__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  full_club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_date: Date or year the club was founded.
  coach: Name of the current head coach or manager.
  proprietor: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  website: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  title: Name or label of the match.
  ucl_season_name: Name or label of the season.
  fixture_date: Date the match was played.
  ground: Venue where the match was played.
  first_team: First participating club.
  second_team: Second participating club.
  victor: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  umpire: Person who refereed the match.
ucl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  title: Name of the venue or stadium.
  host_country: Country the venue is located in.
  stadium_capacity: Maximum seating capacity of the venue.
  geo_coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  primary_occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  start_year: Date or year the club was founded.
  tactician: Name of the current head coach or manager.
  informal_name: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  shortName: Short or abbreviated name of the club.

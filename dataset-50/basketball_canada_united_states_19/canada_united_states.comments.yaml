__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_squads:
  __table__: NBA basketball teams based in Canada + United States.
  team_id: Identifier for the NBA team.
  name: Full name of the NBA team.
  country: Country the team is based in.
  team_city: City the team is based in.
  location_name: Name of the city the team is based in.
  state: US state or province the team is based in.
  inception: Year the team was founded or established.
  venue: Home arena or venue of the team.
  official_website: Official website URL of the team.
  online_followers: Number of social media followers of the team.
nba_matches:
  __table__: NBA basketball games played in Canada + United States.
  game_id: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team_a: First participating team.
  team1Label: Name of the first participating team.
  away_team: Second participating team.
  second_team_name: Name of the second participating team.
  victor: Name of the winning team.
  game_date: Date the game was played.
  crowd_size: Number of spectators in attendance.
  nba_season: Name or label of the NBA season the game belongs to.

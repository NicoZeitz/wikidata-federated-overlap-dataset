__database__: NBA basketball database covering Canada + United States, including teams
  and games.
basketball_franchises:
  __table__: NBA basketball teams based in Canada + United States.
  team_id: Identifier for the NBA team.
  label: Full name of the NBA team.
  base_country: Country the team is based in.
  location: City the team is based in.
  home_city_name: Name of the city the team is based in.
  us_state: US state or province the team is based in.
  founding_year: Year the team was founded or established.
  arena: Home arena or venue of the team.
  team_owner: Name of the current owner or ownership group.
  website: Official website URL of the team.
  followers: Number of social media followers of the team.
nba_games:
  __table__: NBA basketball games played in Canada + United States.
  game_id: Identifier for the NBA game.
  host_country: Country the game was played in (always United States).
  team1: First participating team.
  first_team_name: Name of the first participating team.
  away_team: Second participating team.
  team2Label: Name of the second participating team.
  winner: Name of the winning team.
  date: Date the game was played.
  crowd_size: Number of spectators in attendance.
  season_name: Name or label of the NBA season the game belongs to.

__database__: Football database covering NATO countries, including matches, teams,
  venues, and tournaments.
games:
  __table__: FIFA World Cup matches played in NATO countries.
  match_id: Identifier for the FIFA World Cup match.
  fixture_name: Name or label of the match.
  played_on: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  phase: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  first_team: First participating team.
  home_goals: Goals scored by team1.
  team_b: Second participating team.
  team_b_score: Goals scored by team2.
  winning_team: Winning team (null for draws).
  fans: Number of spectators in attendance.
  umpire: Person who refereed the match.
national_teams:
  __table__: National football teams from NATO countries.
  squad_id: Identifier for the national football team.
  name: Name of the team.
  team_country: Country the team represents.
  established: Year the team was founded.
  native_label: Official name of the team in its native language.
  fifa_ranking: FIFA world ranking of the team.
  division: Competition class or league the team participates in.
  trainer: Current head coach of the team.
  leader: Current team captain.
football_stadiums:
  __table__: Stadiums and arenas in NATO countries that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  label: Name of the venue or stadium.
  host_country: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
cups:
  __table__: FIFA World Cup tournaments held in NATO countries.
  tournament: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  hosting_country: Host country of the tournament.
  edition_count: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  tournament_mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  total_matches: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

__database__: People database covering Czech Republic + Germany, including persons,
  awards, and prize records.
personalities:
  __table__: Persons from Czech Republic + Germany.
  individual_id: Identifier for the person.
  name: Full name of the person.
  biological_sex: Sex of the person.
  birth_day: Date of birth.
  death_day: Date of death (null if still living or unknown).
  personal_name: Given (first) name of the person.
  family_name: Family (last) name of the person.
  nationality: Country of citizenship.
  birth_nation: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  institution: Name of institution where the person studied.
  height_metres: Height of the person in centimeters.
  number_of_children: Number of children the person has.
  siblings: Number of siblings the person has.
awards:
  __table__: Awards from Czech Republic + Germany.
  award_id: Identifier for the award.
  prize_name: Name of the award.
  origin_country: Country the award originates from.
  founded: Year the award was first presented.
  conferred_by: Organization that confers the award.
  honoree: Person or entity the award is named after.
  homepage: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Czech Republic + Germany to awards they
    received.
  recipient: Person who received the award.
  distinction: Award received by the person.
  award_year: Year the award was received.

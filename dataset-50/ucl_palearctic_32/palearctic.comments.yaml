__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
champions_league_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  inception: Date or year the club was founded.
  ground: Name of the club's home stadium.
  tactician: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  website: Official website URL of the club.
  founding_person: Name of the person or entity who founded the club.
ucl_fixtures:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  competition_season_id: Season the match was played in.
  fixture_date: Date the match was played.
  venue: Venue where the match was played.
  team_a: First participating club.
  team2: Second participating club.
  winner: Winning club (null for draws).
  audience: Number of spectators in attendance.
  referee: Person who refereed the match.
ucl_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  seats: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
football_teams:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founded: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  alias: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  established_by: Name of the person or entity who founded the club.

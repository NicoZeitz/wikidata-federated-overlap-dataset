__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  base_country: Country the club is based in.
  founded: Date or year the club was founded.
  ownership: Name of the current owner or ownership group.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  label: Name or label of the match.
  season: Season the match was played in.
  competition_season: Name or label of the season.
  fixture_date: Date the match was played.
  match_venue: Venue where the match was played.
  home_team: First participating club.
  team_b: Second participating club.
  match_winner: Winning club (null for draws).
  attendance: Number of spectators in attendance.
  official: Person who refereed the match.
ucl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  resident_team: Teams or organizations that regularly use the venue.
  venue_architect: Architect who designed the venue.
clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  label: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  inception: Date or year the club was founded.
  arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  byname: Nickname or informal name of the club.
  championships: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  founder: Name of the person or entity who founded the club.

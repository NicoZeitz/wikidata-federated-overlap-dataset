__database__: German states database covering Germany.
german_states:
  __table__: The 16 German federal states (Bundesländer).
  bundesland_id: Identifier for the German federal state.
  nation: Country the federal state belongs to.
  region_name: Name of the German federal state.
  location: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  pop: Population of the state (most recent estimate).
  capital: Capital city of the state.
  creation_date: Date the state was established or re-established.
  iso_code: ISO 3166-2 code of the state (e.g. DE-BY).

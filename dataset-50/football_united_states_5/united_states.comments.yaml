__database__: Football database covering United States, including matches, teams,
  venues, and tournaments.
world_cup_matches:
  __table__: FIFA World Cup matches played in United States.
  game_id: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  fixture_date: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  first_team: First participating team.
  score_team1: Goals scored by team1.
  team2: Second participating team.
  team2_goals: Goals scored by team2.
  victor: Winning team (null for draws).
  audience: Number of spectators in attendance.
  umpire: Person who refereed the match.
squads:
  __table__: National football teams from United States.
  team: Identifier for the national football team.
  national_team_name: Name of the team.
  home_country: Country the team represents.
  inception: Year the team was founded.
  sobriquet: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  competition_level: Competition class or league the team participates in.
  coach: Current head coach of the team.
  leader: Current team captain.
sports_venues:
  __table__: Stadiums and arenas in United States that hosted FIFA World Cup matches.
  venue_id: Identifier for the venue.
  name: Name of the venue or stadium.
  nation: Country the venue is located in.
  seating_capacity: Maximum seating capacity of the venue.
  coordinates: Geographic coordinates of the venue.
  opening_date: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  venue_architect: Architect who designed the venue.
championships:
  __table__: FIFA World Cup tournaments held in United States.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  tournament_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  nation: Host country of the tournament.
  edition_no: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  tournament_mascot: Official mascot of the tournament.
  team_count: Number of teams participating in the tournament.
  tournament_winner: Winning team of the tournament.
  games_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

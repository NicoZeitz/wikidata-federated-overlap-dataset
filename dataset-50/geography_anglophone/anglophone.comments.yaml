__database__: Geographic database covering Anglophone countries, including countries,
  continents, and cities.
countries:
  __table__: Sovereign countries in Anglophone countries.
  state_id: Identifier for the country.
  nation: Name of the country.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  continent_id: Continent the country belongs to.
  territory_size_km2: Total area of the country in square kilometers.
  total_population: Population of the country (most recent estimate).
  national_income_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital: Capital city.
  legal_tender: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  dial_code: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  birth_rate_per_woman: Average number of children born per woman.
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_income: Median household or personal income in US dollars.
  democracy_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  national_bank: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  spoken_languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  premier: Current head of government of the country.
world_regions:
  __table__: Continents covering Anglophone countries.
  id: Identifier for the continent.
  landmass_name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  highest_altitude_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  school_dropout_children: Estimated number of school-age children not enrolled in
    school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
localities:
  __table__: Cities and human settlements located in Anglophone countries.
  city_id: Identifier for the city.
  place_name: Name of the city.
  nation: Country the city is located in.
  pop: Population of the city (most recent estimate).
  position: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  economic_output: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation_m: Elevation of the city above sea level in meters.
  land_area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

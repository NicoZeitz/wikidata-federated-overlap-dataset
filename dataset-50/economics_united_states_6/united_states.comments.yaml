__database__: Economics database covering United States, including companies.
corporations:
  __table__: Business enterprises headquartered in United States.
  corporation_id: Identifier for the company.
  corporation_name: Name of the company.
  country_of_incorporation: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  company_form: Legal form or structure of the company.
  foundation_year: Date the company was founded.
  web_address: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  staff_count: Number of employees (most recent reported value).
  sales_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).

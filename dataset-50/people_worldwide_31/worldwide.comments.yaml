__database__: People database covering Worldwide, including persons, awards, and prize
  records.
public_figures:
  __table__: Persons from Worldwide.
  person: Identifier for the person.
  display_name: Full name of the person.
  gender: Sex of the person.
  dob: Date of birth.
  died: Date of death (null if still living or unknown).
  forename: Given (first) name of the person.
  last: Family (last) name of the person.
  country_of_citizenship: Country of citizenship.
  country_of_birth: Country of birth.
  country: Country associated with the person (citizenship if known, otherwise country
    of birth).
  educated_at: Name of institution where the person studied.
  stature: Height of the person in centimeters.
  brothers_and_sisters: Number of siblings the person has.
prizes:
  __table__: Awards from Worldwide.
  honor_id: Identifier for the award.
  award_name: Name of the award.
  origin_country: Country the award originates from.
  established: Year the award was first presented.
  awarding_body: Organization that confers the award.
  named_after: Person or entity the award is named after.
  homepage: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  honoree: Person who received the award.
  prize: Award received by the person.
  year_won: Year the award was received.

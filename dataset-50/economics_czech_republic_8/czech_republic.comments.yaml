__database__: Economics database covering Czech Republic, including companies.
corporations:
  __table__: Business enterprises headquartered in Czech Republic.
  firm_id: Identifier for the company.
  business_name: Name of the company.
  country: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  creation_date: Date the company was founded.
  base_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).

__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_participants:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team: Identifier for the football club.
  club_name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  country: Country the club is based in.
  start_year: Date or year the club was founded.
  manager: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  club_abbreviation: Short or abbreviated name of the club.
champions_league_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  title: Name or label of the match.
  ucl_season_name: Name or label of the season.
  played_on: Date the match was played.
  stadium: Venue where the match was played.
  team_a: First participating club.
  team2: Second participating club.
  winner: Winning club (null for draws).
  audience: Number of spectators in attendance.
  umpire: Person who refereed the match.
champions_league_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  opening_year: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  established: Date or year the club was founded.
  tactician: Name of the current head coach or manager.
  ownership: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  website: Official website URL of the club.
  acronym: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.

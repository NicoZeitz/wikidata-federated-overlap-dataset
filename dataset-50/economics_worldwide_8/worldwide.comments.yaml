__database__: Economics database covering Worldwide, including companies.
firms:
  __table__: Business enterprises headquartered in Worldwide.
  business_id: Identifier for the company.
  business_name: Name of the company.
  nation: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  sector: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  founded: Date the company was founded.
  website: Official website URL of the company.
  base_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  workforce_size: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).

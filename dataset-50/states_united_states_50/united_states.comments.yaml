__database__: US states database covering United States.
usa_states:
  __table__: The 50 US states.
  us_state_id: Identifier for the US state.
  nation: Country the state belongs to.
  american_state_name: Name of the US state.
  lat_lon: Geographic coordinates of the state centroid.
  total_area_km2: Total area of the state in square kilometers.
  population: Population of the state (most recent estimate).
  state_capital: Capital city of the state.
  admission_date: Date the state was admitted to the Union.
  iso: ISO 3166-2 code of the state (e.g. US-CA).
  homepage: Official website of the state government.

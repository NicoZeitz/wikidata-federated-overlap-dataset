__database__: Economics database covering Japan, including companies.
organizations:
  __table__: Business enterprises headquartered in Japan.
  corporation_id: Identifier for the company.
  name: Name of the company.
  nation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  established: Date the company was founded.
  official_website: Official website URL of the company.
  base_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

__database__: Aviation database covering Canada, including airports, airlines, aircraft,
  and accidents.
flight_hubs:
  __table__: Airports located in Canada.
  aerodrome_id: Identifier for the airport.
  name: Name of the airport.
  iata_identifier: IATA three-letter airport code.
  icao: ICAO four-letter airport code.
  altitude_m: Elevation of the airport above sea level in meters.
  yearly_passengers: Annual passenger count (most recent reported value).
  area_km2: Total area of the airport in square kilometers.
  timezone_offset: UTC offset of the airport's timezone in hours.
  established: Date the airport was opened or established.
  geo_coords: Geographic coordinates of the airport.
  served_city: City the airport serves.
  country: Country the airport is located in.
airlines:
  __table__: Airlines headquartered in Canada.
  carrier_id: Identifier for the airline.
  airline_name: Name of the airline.
  nation: Country where the airline is headquartered.
  founding_date: Date the airline was founded.
  employees: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  planes: Number of aircraft in the fleet.
  parent_company: Parent company or holding group.
  two_letter_code: IATA airline designator code (2-letter).
  icao_code: ICAO airline designator code (3-letter).
  hq: City or location where the airline is headquartered.
  website: Official website of the airline.
  hub_airport: A hub airport of the airline.
jets:
  __table__: Individual aircraft operated by airlines based in Canada.
  aircraft_id: Identifier for the aircraft.
  aircraft_name: Name or registration of the aircraft.
  operating_carrier: Airline operating the aircraft.
  operator_country: Country of the operating airline.
  aircraft_model: Aircraft model type (e.g. Boeing 737-800).
  builder: Manufacturer of the aircraft.
  inaugural_flight: Date of the aircraft's first flight.
  capacity: Maximum passenger capacity.
  flight_speed_kmh: Cruise speed in kilometers per hour.
  wing_width_m: Wingspan in meters.
  aircraft_length_m: Length of the aircraft in meters.
  mtow_kg: Maximum takeoff weight in kilograms.
crashes:
  __table__: Aviation accidents involving airlines that occurred in Canada.
  crash_id: Identifier for the aviation accident.
  name: Name or description of the accident.
  air_carrier: Airline involved in the accident.
  crash_country: Country where the accident occurred.
  incident_date: Date of the accident.
  fatality_count: Number of fatalities in the accident.
  survivor_count: Number of survivors.
  flight: Flight number of the aircraft involved.

__database__: Economics database covering United States, including companies.
enterprises:
  __table__: Business enterprises headquartered in United States.
  firm_id: Identifier for the company.
  title: Name of the company.
  nation: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  established: Date the company was founded.
  web_address: Official website URL of the company.
  city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).

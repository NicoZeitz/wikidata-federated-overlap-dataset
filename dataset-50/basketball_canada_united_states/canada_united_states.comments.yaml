__database__: NBA basketball database covering Canada + United States, including teams
  and games.
nba_teams:
  __table__: NBA basketball teams based in Canada + United States.
  team: Identifier for the NBA team.
  full_team_name: Full name of the NBA team.
  home_country: Country the team is based in.
  team_city: City the team is based in.
  city_name: Name of the city the team is based in.
  province: US state or province the team is based in.
  founding_date: Year the team was founded or established.
  homepage: Official website URL of the team.
  fan_following: Number of social media followers of the team.
nba_contests:
  __table__: NBA basketball games played in Canada + United States.
  game: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team_a: First participating team.
  away_team: Second participating team.
  away_team_name: Name of the second participating team.
  winnerLabel: Name of the winning team.
  arena_name: Name of the venue where the game was played.
  played_on: Date the game was played.
  crowd: Number of spectators in attendance.
  nba_season: Name or label of the NBA season the game belongs to.

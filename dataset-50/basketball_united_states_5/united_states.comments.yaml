__database__: NBA basketball database covering United States, including teams and
  games.
basketball_teams:
  __table__: NBA basketball teams based in United States.
  franchise_id: Identifier for the NBA team.
  label: Full name of the NBA team.
  base_country: Country the team is based in.
  base_city: City the team is based in.
  city_name: Name of the city the team is based in.
  us_state: US state or province the team is based in.
  established: Year the team was founded or established.
  arena: Home arena or venue of the team.
  manager: Current head coach of the team.
  franchise_owner: Name of the current owner or ownership group.
  online_followers: Number of social media followers of the team.
basketball_games:
  __table__: NBA basketball games played in United States.
  game: Identifier for the NBA game.
  country: Country the game was played in (always United States).
  team1: First participating team.
  home_team_name: Name of the first participating team.
  away_team: Second participating team.
  winner: Name of the winning team.
  arena_name: Name of the venue where the game was played.
  game_date: Date the game was played.
  gate: Number of spectators in attendance.
  competition_season: Name or label of the NBA season the game belongs to.

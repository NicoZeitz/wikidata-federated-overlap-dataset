__database__: Geographic database covering Indonesia, including countries, continents,
  and cities.
countries:
  __table__: Sovereign countries in Indonesia.
  state_id: Identifier for the country.
  country_name: Name of the country.
  two_letter_country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso_alpha3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  territory_size_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city: Capital city.
  currency_name: Name of the official currency.
  location: Geographic coordinates of the country centroid.
  founding_date: Date the country was founded or became independent.
  official_name: Official name of the country in English.
  telephone_code: International telephone dialling code (e.g. +49).
  population_male: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  tfr: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100000: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  monetary_authority: Name of the central bank.
  highest_mountain: Name of the highest geographical point in the country.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  depression_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  spoken_languages: Comma-separated official languages of the country.
  sovereign: Current head of state of the country.
  prime_minister: Current head of government of the country.
landmasses:
  __table__: Continents covering Indonesia.
  identifier: Identifier for the continent.
  name: Name of the continent.
  size_km2: Total land area of the continent in square kilometers.
  residents: Total population of the continent (most recent estimate).
  location: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  lowest_altitude_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  unenrolled_children: Estimated number of school-age children not enrolled in school.
  un_numeric_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in Indonesia.
  municipality_id: Identifier for the city.
  city_name: Name of the city.
  home_country: Country the city is located in.
  residents: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  nickname: Comma-separated informal names or nicknames of the city.
  mailing_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  per_capita_income_usd: Per capita income of the city in US dollars.
  height_m: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

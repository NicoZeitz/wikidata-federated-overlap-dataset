__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
territories:
  __table__: Sovereign countries in Worldwide.
  nation_id: Identifier for the country.
  country_name: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  surface_area_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  total_gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital: Capital city.
  currency: Name of the official currency.
  location: Geographic coordinates of the country centroid.
  independence_date: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  dial_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  live_births_per_1000: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  democratic_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  languages: Comma-separated official languages of the country.
  chief_of_state: Current head of state of the country.
  premier: Current head of government of the country.
continents:
  __table__: Continents covering Worldwide.
  continent: Identifier for the continent.
  label: Name of the continent.
  land_area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  un_code: UN M49 numeric region code assigned to the continent.
  adjectival: Comma-separated adjectives or nouns used to describe inhabitants of
    the continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
urban_areas:
  __table__: Cities and human settlements located in Worldwide.
  city_id: Identifier for the city.
  name: Name of the city.
  city_country: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  founding_date: Date or year the city was founded or first recorded.
  zip_code: Postal or ZIP code of the city.
  gdp_usd: Nominal GDP of the city in US dollars.
  income_per_capita: Per capita income of the city in US dollars.
  elevation_m: Elevation of the city above sea level in meters.
  surface_area_km2: Total area of the city in square kilometers.
  cars_per_thousand: Number of registered motor vehicles per thousand inhabitants.

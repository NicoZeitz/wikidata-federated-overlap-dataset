__database__: US states database covering United States.
united_states_states:
  __table__: The 50 US states.
  state: Identifier for the US state.
  country: Country the state belongs to.
  american_state_name: Name of the US state.
  location: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  number_of_inhabitants: Population of the state (most recent estimate).
  capital: Capital city of the state.
  admitted: Date the state was admitted to the Union.
  iso_3166_code: ISO 3166-2 code of the state (e.g. US-CA).
  alias: Nickname of the state.
  website: Official website of the state government.

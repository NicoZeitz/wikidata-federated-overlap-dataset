__database__: Geographic database covering Worldwide, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in Worldwide.
  country: Identifier for the country.
  country_name: Name of the country.
  country_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp_nominal_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital_city_id: Capital city.
  monetary_unit: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  independence_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  country_code_phone: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  average_lifespan: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  unemployment_rate: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  children_per_woman: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicides_per_100000: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  eiu_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  central_bank_name: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_coords: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  national_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  head_of_government: Current head of government of the country.
geographic_regions:
  __table__: Continents covering Worldwide.
  identifier: Identifier for the continent.
  region_name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  coords: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  lowest_altitude_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_code: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in Worldwide.
  city_id: Identifier for the city.
  place_name: Name of the city.
  nation: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  founded: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  post_code: Postal or ZIP code of the city.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  economic_output: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

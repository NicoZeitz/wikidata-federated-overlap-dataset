__database__: US states database covering United States.
american_regions:
  __table__: The 50 US states.
  state_id: Identifier for the US state.
  country: Country the state belongs to.
  label: Name of the US state.
  location: Geographic coordinates of the state centroid.
  surface_area_km2: Total area of the state in square kilometers.
  number_of_inhabitants: Population of the state (most recent estimate).
  main_city: Capital city of the state.
  admission_date: Date the state was admitted to the Union.
  iso_code: ISO 3166-2 code of the state (e.g. US-CA).
  official_website: Official website of the state government.

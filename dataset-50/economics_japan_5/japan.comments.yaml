__database__: Economics database covering Japan, including companies.
firms:
  __table__: Business enterprises headquartered in Japan.
  business_id: Identifier for the company.
  corporation_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  inception: Date the company was founded.
  base_city: City where the company is headquartered.
  top_executive: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).
  valuation_usd: Market capitalization in US dollars (most recent reported value).

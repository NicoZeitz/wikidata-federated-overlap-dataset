__database__: Provinces database covering China.
administrative_regions:
  __table__: Administrative divisions of China.
  province: Identifier for the Chinese province or administrative region.
  nation: Country the province belongs to.
  label: Name of the Chinese province or administrative region.
  centroid: Geographic coordinates of the province centroid.
  size_km2: Total area of the province in square kilometers.
  inhabitants: Population of the province (most recent estimate).
  provincial_capital: Capital city of the province.
  founding_date: Date the province was established.

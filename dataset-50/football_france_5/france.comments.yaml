__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
matches:
  __table__: FIFA World Cup matches played in France.
  match_id: Identifier for the FIFA World Cup match.
  label: Name or label of the match.
  played_on: Date the match was played.
  world_cup_edition: Tournament this match belongs to.
  tournament_round: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  team1: First participating team.
  team1_score: Goals scored by team1.
  second_team: Second participating team.
  team2_score: Goals scored by team2.
  winning_team: Winning team (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
national_football_teams:
  __table__: National football teams from France.
  squad_id: Identifier for the national football team.
  national_team_name: Name of the team.
  team_country: Country the team represents.
  founded: Year the team was founded.
  official_name: Official name of the team in its native language.
  informal_name: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  competition_class: Competition class or league the team participates in.
  trainer: Current head coach of the team.
  leader: Current team captain.
sports_venues:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  construction_completion: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
competitions:
  __table__: FIFA World Cup tournaments held in France.
  tournament: Identifier for the FIFA World Cup tournament edition.
  event_name: Name of the tournament (e.g. 1966 FIFA World Cup).
  year: Year the tournament was held.
  host_country: Host country of the tournament.
  edition_count: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  official_mascot: Official mascot of the tournament.
  qualified_teams: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  total_goals: Total number of goals scored across all matches.

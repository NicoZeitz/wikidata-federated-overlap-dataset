__database__: Geographic database covering Southern Asia, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in Southern Asia.
  state_id: Identifier for the country.
  nation: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  total_area_km2: Total area of the country in square kilometers.
  population_count: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  capital: Capital city.
  currency_name: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  creation_date: Date the country was founded or became independent.
  long_name: Official name of the country in English.
  dial_code: International telephone dialling code (e.g. +49).
  male_count: Male population count (most recent estimate).
  population_female: Female population count (most recent estimate).
  longevity: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  out_of_work_rate: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  mortality_rate: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  typical_income_usd: Median household or personal income in US dollars.
  democracy_index: Democracy Index score (0–10) from the Economist Intelligence Unit.
  reserve_bank: Name of the central bank.
  summit: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the country.
  spoken_languages: Comma-separated official languages of the country.
  president: Current head of state of the country.
  prime_minister: Current head of government of the country.
world_divisions:
  __table__: Continents covering Southern Asia.
  identifier: Identifier for the continent.
  region_name: Name of the continent.
  area: Total land area of the continent in square kilometers.
  residents: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  school_dropout_children: Estimated number of school-age children not enrolled in
    school.
  m49_code: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  north_pole_coords: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
localities:
  __table__: Cities and human settlements located in Southern Asia.
  city_id: Identifier for the city.
  city_name: Name of the city.
  country: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  location: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  citizen_name: Comma-separated adjectives or nouns used to describe inhabitants of
    the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  altitude_m: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

__database__: Economics database covering Worldwide, including companies.
entities:
  __table__: Business enterprises headquartered in Worldwide.
  firm_id: Identifier for the company.
  trade_name: Name of the company.
  country_of_incorporation: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  foundation_year: Date the company was founded.
  official_website: Official website URL of the company.
  base_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  employees: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  operating_profit_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

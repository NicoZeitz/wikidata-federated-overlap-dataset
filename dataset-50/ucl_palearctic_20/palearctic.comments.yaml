__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_participants:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  club_id: Identifier for the football club.
  label: Full name of the football club.
  division: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founded: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  owner: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.
ucl_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season_id: Season the match was played in.
  season_name: Name or label of the season.
  game_date: Date the match was played.
  arena: Venue where the match was played.
  team1: First participating club.
  second_team: Second participating club.
  winner: Winning club (null for draws).
  crowd: Number of spectators in attendance.
  match_referee: Person who refereed the match.
ucl_arenas:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue_id: Identifier for the venue.
  label: Name of the venue or stadium.
  host_country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  regular_users: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  club_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  founded: Date or year the club was founded.
  home_arena: Name of the club's home stadium.
  club_owner: Name of the current owner or ownership group.
  championships: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  url: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.

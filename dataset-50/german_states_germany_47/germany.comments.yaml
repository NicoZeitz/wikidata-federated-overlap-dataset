__database__: German states database covering Germany.
german_states:
  __table__: The 16 German federal states (Bundesländer).
  region_id: Identifier for the German federal state.
  parent_country: Country the federal state belongs to.
  label: Name of the German federal state.
  location: Geographic coordinates of the state centroid.
  area_km2: Total area of the state in square kilometers.
  number_of_inhabitants: Population of the state (most recent estimate).
  capital: Capital city of the state.
  inception: Date the state was established or re-established.
  iso: ISO 3166-2 code of the state (e.g. DE-BY).
  website: Official website of the state government.

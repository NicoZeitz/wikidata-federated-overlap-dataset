__database__: Economics database covering Japan, including companies.
organizations:
  __table__: Business enterprises headquartered in Japan.
  company: Identifier for the company.
  name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  start_date: Date the company was founded.
  web_address: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  employee_count: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).

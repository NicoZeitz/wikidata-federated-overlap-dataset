__database__: Geographic database covering Germany, including countries, continents,
  and cities.
kingdoms:
  __table__: Sovereign countries in Germany.
  country_id: Identifier for the country.
  title: Name of the country.
  two_letter_country_code: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  pop: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  seat_of_government: Capital city.
  monetary_unit: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  founded: Date the country was founded or became independent.
  formal_title: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  population_female: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  jobless_rate: Unemployment rate as a percentage of the labour force.
  gini: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  births_per_thousand: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  suicide_rate: Suicide rate per 100,000 inhabitants per year.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  national_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_point_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_coords: Geographic coordinates of the northernmost point of the country.
  southern_extreme: Geographic coordinates of the southernmost point of the country.
  eastmost_coords: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  nationality_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the country.
  official_languages: Comma-separated official languages of the country.
  chief_of_state: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
landmasses:
  __table__: Continents covering Germany.
  id: Identifier for the continent.
  continent_name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  tallest_point: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  nadir: Name of the lowest geographical point on the continent.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populated_city: Most populous urban area on the continent.
  non_enrolled_children: Estimated number of school-age children not enrolled in school.
  m49_code: UN M49 numeric region code assigned to the continent.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  westmost_coords: Geographic coordinates of the westernmost point of the continent.
municipalities:
  __table__: Cities and human settlements located in Germany.
  settlement_id: Identifier for the city.
  town_name: Name of the city.
  city_country: Country the city is located in.
  city_population: Population of the city (most recent estimate).
  coordinates: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  informal_name: Comma-separated informal names or nicknames of the city.
  postal_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  per_capita_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

__database__: Economics database covering Worldwide, including companies.
enterprises:
  __table__: Business enterprises headquartered in Worldwide.
  corporation_id: Identifier for the company.
  business_name: Name of the company.
  country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  founding_date: Date the company was founded.
  base_city: City where the company is headquartered.
  managing_director: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  asset_value_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

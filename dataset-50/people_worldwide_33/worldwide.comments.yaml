__database__: People database covering Worldwide, including persons, awards, and prize
  records.
humans:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  complete_name: Full name of the person.
  biological_sex: Sex of the person.
  birth_date: Date of birth.
  date_of_death: Date of death (null if still living or unknown).
  forename: Given (first) name of the person.
  last_name: Family (last) name of the person.
  citizenship: Country of citizenship.
  birth_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  school: Name of institution where the person studied.
  height_cm: Height of the person in centimeters.
  number_of_children: Number of children the person has.
  sibling_count: Number of siblings the person has.
decorations:
  __table__: Awards from Worldwide.
  award_id: Identifier for the award.
  prize_name: Name of the award.
  awarding_country: Country the award originates from.
  founded: Year the award was first presented.
  granting_organization: Organization that confers the award.
  honoree: Person or entity the award is named after.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  honoree: Person who received the award.
  prize: Award received by the person.
  reception_year: Year the award was received.

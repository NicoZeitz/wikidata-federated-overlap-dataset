__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  team_name: Full name of the football club.
  league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_date: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  informal_name: Nickname or informal name of the club.
  title_count: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  url: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.
  creator: Name of the person or entity who founded the club.
champions_league_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  game_name: Name or label of the match.
  ucl_season_name: Name or label of the season.
  played_on: Date the match was played.
  match_venue: Venue where the match was played.
  team_a: First participating club.
  team_b: Second participating club.
  match_winner: Winning club (null for draws).
  gate: Number of spectators in attendance.
  arbiter: Person who refereed the match.
ucl_arenas:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  nation: Country the venue is located in.
  max_capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
soccer_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  name: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  inception: Date or year the club was founded.
  trainer: Name of the current head coach or manager.
  investor: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  domestic_titles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.
  club_abbreviation: Short or abbreviated name of the club.

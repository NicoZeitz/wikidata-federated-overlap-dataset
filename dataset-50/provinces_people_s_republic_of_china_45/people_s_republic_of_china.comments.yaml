__database__: Provinces database covering China.
chinese_provinces:
  __table__: Administrative divisions of China.
  administrative_unit_id: Identifier for the Chinese province or administrative region.
  nation: Country the province belongs to.
  name: Name of the Chinese province or administrative region.
  coordinates: Geographic coordinates of the province centroid.
  area_km2: Total area of the province in square kilometers.
  inhabitants: Population of the province (most recent estimate).
  main_city: Capital city of the province.
  creation_date: Date the province was established.
  region_code: ISO 3166-2 code of the province (e.g. CN-HE).
  homepage: Official website of the provincial government.

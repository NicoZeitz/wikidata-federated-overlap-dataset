__database__: Geographic database covering India, including countries, continents,
  and cities.
kingdoms:
  __table__: Sovereign countries in India.
  country_id: Identifier for the country.
  state_name: Name of the country.
  iso2_code: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  continent_id: Continent the country belongs to.
  land_area_km2: Total area of the country in square kilometers.
  inhabitants: Population of the country (most recent estimate).
  gdp_usd: Nominal GDP of the country in US dollars (most recent reported value).
  capital_city: Capital city.
  currency_name: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  official_name: Official name of the country in English.
  phone_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  number_of_females: Female population count (most recent estimate).
  life_exp: Average life expectancy at birth in years.
  hdi_score: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  birth_rate_per_woman: Average number of children born per woman.
  crude_birth_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicide_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank_name: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_elevation: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  state_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  prime_minister: Current head of government of the country.
world_divisions:
  __table__: Continents covering India.
  id: Identifier for the continent.
  continent_name: Name of the continent.
  land_area_km2: Total land area of the continent in square kilometers.
  total_population: Total population of the continent (most recent estimate).
  coordinates: Geographic coordinates of the continent centroid.
  summit: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_city: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northern_extreme: Geographic coordinates of the northernmost point of the continent.
  southern_tip_coords: Geographic coordinates of the southernmost point of the continent.
  eastmost_coords: Geographic coordinates of the easternmost point of the continent.
  western_tip_coords: Geographic coordinates of the westernmost point of the continent.
towns:
  __table__: Cities and human settlements located in India.
  city: Identifier for the city.
  settlement_name: Name of the city.
  country: Country the city is located in.
  residents: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  byname: Comma-separated informal names or nicknames of the city.
  zip: Postal or ZIP code of the city.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  economic_output: Nominal GDP of the city in US dollars.
  per_person_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  city_area_km2: Total area of the city in square kilometers.
  motor_vehicles_per_1000: Number of registered motor vehicles per thousand inhabitants.

__database__: Economics database covering Japan, including companies.
organizations:
  __table__: Business enterprises headquartered in Japan.
  firm_id: Identifier for the company.
  firm_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  types: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  founding_date: Date the company was founded.
  homepage: Official website URL of the company.
  base_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  employees: Number of employees (most recent reported value).
  turnover_usd: Annual revenue in US dollars (most recent reported value).
  earnings_usd: Net income in US dollars (most recent reported value).
  assets_usd: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).
  market_value_usd: Market capitalization in US dollars (most recent reported value).

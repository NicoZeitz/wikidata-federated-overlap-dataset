__database__: People database covering Worldwide, including persons, awards, and prize
  records.
famous_people:
  __table__: Persons from Worldwide.
  human_id: Identifier for the person.
  display_name: Full name of the person.
  sex_at_birth: Sex of the person.
  dob: Date of birth.
  death_day: Date of death (null if still living or unknown).
  given_name: Given (first) name of the person.
  last: Family (last) name of the person.
  country_of_citizenship: Country of citizenship.
  birth_nation: Country of birth.
  associated_country: Country associated with the person (citizenship if known, otherwise
    country of birth).
  institution: Name of institution where the person studied.
  children: Number of children the person has.
  sibling_count: Number of siblings the person has.
prizes:
  __table__: Awards from Worldwide.
  award: Identifier for the award.
  name: Name of the award.
  country_of_origin: Country the award originates from.
  created: Year the award was first presented.
  granting_organization: Organization that confers the award.
  eponym: Person or entity the award is named after.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  recipient: Person who received the award.
  award: Award received by the person.
  year_awarded: Year the award was received.

__database__: Economics database covering Worldwide, including companies.
entities:
  __table__: Business enterprises headquartered in Worldwide.
  firm_id: Identifier for the company.
  firm_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  legal_form: Legal form or structure of the company.
  foundation_year: Date the company was founded.
  web_address: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  personnel_count: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_income_usd: Net income in US dollars (most recent reported value).
  balance_sheet_total_usd: Total assets in US dollars (most recent reported value).

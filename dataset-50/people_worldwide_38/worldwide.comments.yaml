__database__: People database covering Worldwide, including persons, awards, and prize
  records.
celebrities:
  __table__: Persons from Worldwide.
  person_id: Identifier for the person.
  display_name: Full name of the person.
  sex: Sex of the person.
  birthday: Date of birth.
  date_of_death: Date of death (null if still living or unknown).
  christian_name: Given (first) name of the person.
  paternal_name: Family (last) name of the person.
  passport_country: Country of citizenship.
  birth_country: Country of birth.
  nation: Country associated with the person (citizenship if known, otherwise country
    of birth).
  college: Name of institution where the person studied.
  stature: Height of the person in centimeters.
  children: Number of children the person has.
  number_of_siblings: Number of siblings the person has.
recognitions:
  __table__: Awards from Worldwide.
  award_id: Identifier for the award.
  title: Name of the award.
  awarding_country: Country the award originates from.
  created: Year the award was first presented.
  organizer: Organization that confers the award.
  namesake: Person or entity the award is named after.
  web_address: Official website URL of the award.
person_awards:
  __table__: Records linking persons from Worldwide to awards they received.
  recipient: Person who received the award.
  honor: Award received by the person.
  year_won: Year the award was received.

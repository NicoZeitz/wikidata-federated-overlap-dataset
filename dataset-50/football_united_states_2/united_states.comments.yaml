__database__: Football database covering United States, including matches, teams,
  venues, and tournaments.
world_cup_fixtures:
  __table__: FIFA World Cup matches played in United States.
  game_id: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  game_date: Date the match was played.
  tournament: Tournament this match belongs to.
  phase: Stage of the tournament (e.g. group stage, quarterfinal, final).
  ground: Venue where the match was played.
  team_a: First participating team.
  goals_team1: Goals scored by team1.
  second_team: Second participating team.
  goals_team2: Goals scored by team2.
  winner: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  official: Person who refereed the match.
teams:
  __table__: National football teams from United States.
  team: Identifier for the national football team.
  title: Name of the team.
  country: Country the team represents.
  inception: Year the team was founded.
  local_label: Official name of the team in its native language.
  world_ranking: FIFA world ranking of the team.
  competition_class: Competition class or league the team participates in.
  manager: Current head coach of the team.
  captain: Current team captain.
grounds:
  __table__: Stadiums and arenas in United States that hosted FIFA World Cup matches.
  venue: Identifier for the venue.
  stadium_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  position: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  location_city: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  building_architect: Architect who designed the venue.
world_cups:
  __table__: FIFA World Cup tournaments held in United States.
  tournament: Identifier for the FIFA World Cup tournament edition.
  name: Name of the tournament (e.g. 1966 FIFA World Cup).
  host_year: Year the tournament was held.
  nation: Host country of the tournament.
  edition_count: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  event_mascot: Official mascot of the tournament.
  teams: Number of teams participating in the tournament.
  cup_winner: Winning team of the tournament.
  num_matches: Total number of matches played in the tournament.
  goals: Total number of goals scored across all matches.

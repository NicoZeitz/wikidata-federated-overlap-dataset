__database__: Economics database covering Czech Republic, including companies.
organizations:
  __table__: Business enterprises headquartered in Czech Republic.
  company: Identifier for the company.
  business_name: Name of the company.
  headquarters_country: Country where the company is headquartered.
  classification: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  inception: Date the company was founded.
  homepage: Official website URL of the company.
  head_office_city: City where the company is headquartered.
  ceo: Current chief executive officer.
  staff: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  bottom_line_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  ebit_usd: Operating income in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

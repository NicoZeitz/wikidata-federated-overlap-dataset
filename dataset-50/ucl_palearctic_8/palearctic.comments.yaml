__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
cl_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  name: Full name of the football club.
  division: Name of the domestic league the club competes in.
  home_country: Country the club is based in.
  established: Date or year the club was founded.
  arena: Name of the club's home stadium.
  coach: Name of the current head coach or manager.
  owner: Name of the current owner or ownership group.
  sobriquet: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  fan_base_size: Number of social media followers of the club.
  website: Official website URL of the club.
  short_name: Short or abbreviated name of the club.
ucl_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  game_id: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season: Season the match was played in.
  date: Date the match was played.
  stadium: Venue where the match was played.
  team1: First participating club.
  second_team: Second participating club.
  winning_team: Winning club (null for draws).
  crowd_size: Number of spectators in attendance.
  official: Person who refereed the match.
ucl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  arena_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  architect: Architect who designed the venue.
association_football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team_id: Identifier for the football club.
  team_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_date: Date or year the club was founded.
  head_coach: Name of the current head coach or manager.
  byname: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  short_name: Short or abbreviated name of the club.

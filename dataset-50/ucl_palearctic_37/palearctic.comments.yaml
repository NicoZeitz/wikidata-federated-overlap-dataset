__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_clubs:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  team_id: Identifier for the football club.
  club_name: Full name of the football club.
  domestic_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founding_year: Date or year the club was founded.
  arena: Name of the club's home stadium.
  investor: Name of the current owner or ownership group.
  domestic_titles: Number of domestic league titles won by the club.
  followers: Number of social media followers of the club.
  homepage: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
champions_league_games:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match_id: Identifier for the UEFA Champions League match.
  fixture_name: Name or label of the match.
  match_date: Date the match was played.
  arena: Venue where the match was played.
  team_a: First participating club.
  away_team: Second participating club.
  winning_team: Winning club (null for draws).
  gate: Number of spectators in attendance.
  official: Person who refereed the match.
champions_league_stadiums:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  venue: Identifier for the venue.
  label: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  lat_lon: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  architect: Architect who designed the venue.
soccer_teams:
  __table__: Football clubs based in Palearctic ecozone.
  club_id: Identifier for the football club.
  label: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founding_date: Date or year the club was founded.
  arena: Name of the club's home stadium.
  manager: Name of the current head coach or manager.
  informal_name: Nickname or informal name of the club.
  league_wins: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  abbreviation: Short or abbreviated name of the club.
  founding_person: Name of the person or entity who founded the club.

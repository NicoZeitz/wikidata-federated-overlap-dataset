__database__: Economics database covering United States, including companies.
companies_list:
  __table__: Business enterprises headquartered in United States.
  business_id: Identifier for the company.
  trade_name: Name of the company.
  country_of_incorporation: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  field: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  foundation_year: Date the company was founded.
  headquarters_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  employees: Number of employees (most recent reported value).
  annual_revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).
  market_cap_usd: Market capitalization in US dollars (most recent reported value).

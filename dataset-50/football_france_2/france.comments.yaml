__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
world_cup_games:
  __table__: FIFA World Cup matches played in France.
  match: Identifier for the FIFA World Cup match.
  title: Name or label of the match.
  date: Date the match was played.
  tournament: Tournament this match belongs to.
  phase: Stage of the tournament (e.g. group stage, quarterfinal, final).
  match_venue: Venue where the match was played.
  side_one: First participating team.
  home_goals: Goals scored by team1.
  side_two: Second participating team.
  goals_team2: Goals scored by team2.
  winner: Winning team (null for draws).
  crowd: Number of spectators in attendance.
  referee: Person who refereed the match.
soccer_teams:
  __table__: National football teams from France.
  squad_id: Identifier for the national football team.
  label: Name of the team.
  country: Country the team represents.
  founding_date: Year the team was founded.
  local_name: Official name of the team in its native language.
  byname: Comma-separated nicknames of the team.
  rank: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  coach: Current head coach of the team.
  team_captain: Current team captain.
arenas:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  stadium_id: Identifier for the venue.
  venue_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  seats: Maximum seating capacity of the venue.
  location: Geographic coordinates of the venue.
  opened: Date the venue was officially opened.
  municipality: City or municipality the venue is located in.
  occupant: Teams or organizations that regularly use the venue.
  structural_designer: Architect who designed the venue.
competitions:
  __table__: FIFA World Cup tournaments held in France.
  tournament: Identifier for the FIFA World Cup tournament edition.
  title: Name of the tournament (e.g. 1966 FIFA World Cup).
  edition_year: Year the tournament was held.
  venue_country: Host country of the tournament.
  ordinal_edition: Ordinal edition number of the tournament (e.g. 23 for the 23rd
    World Cup).
  mascot: Official mascot of the tournament.
  participating_teams: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  matches_played: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

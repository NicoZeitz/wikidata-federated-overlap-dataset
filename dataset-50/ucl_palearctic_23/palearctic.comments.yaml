__database__: UEFA Champions League database covering Palearctic ecozone, including
  clubs, matches, and venues.
ucl_teams:
  __table__: Football clubs based in Palearctic ecozone that participated in the UEFA
    Champions League.
  organization_id: Identifier for the football club.
  club_name: Full name of the football club.
  home_league: Name of the domestic league the club competes in.
  country: Country the club is based in.
  founded: Date or year the club was founded.
  home_stadium: Name of the club's home stadium.
  investor: Name of the current owner or ownership group.
  nickname: Nickname or informal name of the club.
  leagueTitles: Number of domestic league titles won by the club.
  social_media_followers: Number of social media followers of the club.
  web_address: Official website URL of the club.
  shortName: Short or abbreviated name of the club.
  club_founder: Name of the person or entity who founded the club.
european_football_matches:
  __table__: UEFA Champions League matches played in Palearctic ecozone.
  match: Identifier for the UEFA Champions League match.
  matchLabel: Name or label of the match.
  season: Season the match was played in.
  ucl_season_name: Name or label of the season.
  match_date: Date the match was played.
  venue: Venue where the match was played.
  home_team: First participating club.
  team2: Second participating club.
  winner: Winning club (null for draws).
  audience: Number of spectators in attendance.
  official: Person who refereed the match.
cl_venues:
  __table__: Stadiums and arenas in Palearctic ecozone that hosted UEFA Champions
    League matches.
  arena_id: Identifier for the venue.
  ground_name: Name of the venue or stadium.
  host_country: Country the venue is located in.
  total_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  city: City or municipality the venue is located in.
  structural_designer: Architect who designed the venue.
football_clubs:
  __table__: Football clubs based in Palearctic ecozone.
  team: Identifier for the football club.
  title: Full name of the football club.
  competition: Name of the domestic league the club competes in.
  club_country: Country the club is based in.
  founded: Date or year the club was founded.
  home_ground: Name of the club's home stadium.
  investor: Name of the current owner or ownership group.
  alias: Nickname or informal name of the club.
  league_titles: Number of domestic league titles won by the club.
  online_followers: Number of social media followers of the club.
  official_website: Official website URL of the club.

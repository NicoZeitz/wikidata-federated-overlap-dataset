__database__: Provinces database covering China.
china_regions:
  __table__: Administrative divisions of China.
  province: Identifier for the Chinese province or administrative region.
  nation: Country the province belongs to.
  region_name: Name of the Chinese province or administrative region.
  coordinates: Geographic coordinates of the province centroid.
  total_area_km2: Total area of the province in square kilometers.
  population_count: Population of the province (most recent estimate).
  administrative_center: Capital city of the province.
  founded: Date the province was established.
  iso_code: ISO 3166-2 code of the province (e.g. CN-HE).

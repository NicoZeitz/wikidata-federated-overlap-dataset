__database__: Economics database covering United States, including companies.
entities:
  __table__: Business enterprises headquartered in United States.
  business_id: Identifier for the company.
  trade_name: Name of the company.
  country: Country where the company is headquartered.
  company_types: Types or classifications of the company (comma-separated).
  industry_sector: Industries the company operates in (comma-separated).
  entity_form: Legal form or structure of the company.
  founded: Date the company was founded.
  homepage: Official website URL of the company.
  city: City where the company is headquartered.
  ceo: Current chief executive officer.
  staff: Number of employees (most recent reported value).
  revenue_usd: Annual revenue in US dollars (most recent reported value).
  after_tax_income_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_income_usd: Operating income in US dollars (most recent reported value).
  stock_market_value_usd: Market capitalization in US dollars (most recent reported
    value).

__database__: Economics database covering United States, including companies.
companies:
  __table__: Business enterprises headquartered in United States.
  firm_id: Identifier for the company.
  label: Name of the company.
  headquarters_country: Country where the company is headquartered.
  business_types: Types or classifications of the company (comma-separated).
  industry: Industries the company operates in (comma-separated).
  established: Date the company was founded.
  base_city: City where the company is headquartered.
  executive_director: Current chief executive officer.
  headcount: Number of employees (most recent reported value).
  gross_revenue_usd: Annual revenue in US dollars (most recent reported value).
  net_profit_usd: Net income in US dollars (most recent reported value).
  total_assets: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).
  market_capitalization_usd: Market capitalization in US dollars (most recent reported
    value).

__database__: Geographic database covering India, including countries, continents,
  and cities.
states:
  __table__: Sovereign countries in India.
  country: Identifier for the country.
  territory_name: Name of the country.
  iso2_code: ISO 3166-1 alpha-2 two-letter country code.
  iso3: ISO 3166-1 alpha-3 three-letter country code.
  world_region: Continent the country belongs to.
  area_km2: Total area of the country in square kilometers.
  people: Population of the country (most recent estimate).
  gdp: Nominal GDP of the country in US dollars (most recent reported value).
  seat_of_government: Capital city.
  legal_tender: Name of the official currency.
  coordinates: Geographic coordinates of the country centroid.
  established: Date the country was founded or became independent.
  full_name: Official name of the country in English.
  international_dialing_code: International telephone dialling code (e.g. +49).
  number_of_males: Male population count (most recent estimate).
  female_count: Female population count (most recent estimate).
  expected_lifespan: Average life expectancy at birth in years.
  human_development_score: Human Development Index score (0–1).
  unemployment_pct: Unemployment rate as a percentage of the labour force.
  gini_coefficient: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  deaths_per_thousand: Number of deaths per 1000 inhabitants per year.
  self_harm_mortality_rate: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  central_bank_name: Name of the central bank.
  highest_point: Name of the highest geographical point in the country.
  peak_height_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  min_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northernmost_point: Geographic coordinates of the northernmost point of the country.
  southmost_coords: Geographic coordinates of the southernmost point of the country.
  eastern_extreme: Geographic coordinates of the easternmost point of the country.
  western_extreme: Geographic coordinates of the westernmost point of the country.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  state_leader: Current head of state of the country.
  premier: Current head of government of the country.
major_regions:
  __table__: Continents covering India.
  id: Identifier for the continent.
  continent_name: Name of the continent.
  area_km2: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  lat_lon: Geographic coordinates of the continent centroid.
  highest_point: Name of the highest geographical point on the continent.
  highest_point_m: Elevation of the highest point above sea level in meters.
  lowest_depression: Name of the lowest geographical point on the continent.
  lowest_altitude_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  most_populous_urban_area: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    continent.
  northmost_coords: Geographic coordinates of the northernmost point of the continent.
  southmost_coords: Geographic coordinates of the southernmost point of the continent.
  easternmost_point: Geographic coordinates of the easternmost point of the continent.
  western_extreme: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in India.
  municipality_id: Identifier for the city.
  municipality_name: Name of the city.
  home_country: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  coords: Geographic coordinates of the city.
  creation_date: Date or year the city was founded or first recorded.
  alias: Comma-separated informal names or nicknames of the city.
  inhabitant_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  total_output_usd: Nominal GDP of the city in US dollars.
  per_capita_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  size_km2: Total area of the city in square kilometers.
  vehicle_density: Number of registered motor vehicles per thousand inhabitants.

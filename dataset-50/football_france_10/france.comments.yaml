__database__: Football database covering France, including matches, teams, venues,
  and tournaments.
games:
  __table__: FIFA World Cup matches played in France.
  fixture_id: Identifier for the FIFA World Cup match.
  match_name: Name or label of the match.
  game_date: Date the match was played.
  cup_edition: Tournament this match belongs to.
  stage_type: Stage of the tournament (e.g. group stage, quarterfinal, final).
  venue: Venue where the match was played.
  side_one: First participating team.
  goals_team1: Goals scored by team1.
  team2: Second participating team.
  team_b_score: Goals scored by team2.
  champion: Winning team (null for draws).
  attendance: Number of spectators in attendance.
  official: Person who refereed the match.
teams:
  __table__: National football teams from France.
  team: Identifier for the national football team.
  label: Name of the team.
  country: Country the team represents.
  founded: Year the team was founded.
  official_name: Official name of the team in its native language.
  informal_name: Comma-separated nicknames of the team.
  fifa_ranking: FIFA world ranking of the team.
  league: Competition class or league the team participates in.
  tactician: Current head coach of the team.
  captain: Current team captain.
world_cup_venues:
  __table__: Stadiums and arenas in France that hosted FIFA World Cup matches.
  arena_id: Identifier for the venue.
  arena_name: Name of the venue or stadium.
  venue_country: Country the venue is located in.
  spectator_capacity: Maximum seating capacity of the venue.
  coords: Geographic coordinates of the venue.
  built: Date the venue was officially opened.
  host_city: City or municipality the venue is located in.
  home_team: Teams or organizations that regularly use the venue.
  designer: Architect who designed the venue.
world_cups:
  __table__: FIFA World Cup tournaments held in France.
  tournament_id: Identifier for the FIFA World Cup tournament edition.
  label: Name of the tournament (e.g. 1966 FIFA World Cup).
  tournament_year: Year the tournament was held.
  nation: Host country of the tournament.
  edition_number: Ordinal edition number of the tournament (e.g. 23 for the 23rd World
    Cup).
  tournament_mascot: Official mascot of the tournament.
  num_participants: Number of teams participating in the tournament.
  champion: Winning team of the tournament.
  num_matches: Total number of matches played in the tournament.
  total_goals_scored: Total number of goals scored across all matches.

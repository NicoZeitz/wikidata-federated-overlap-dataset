__database__: German states database covering Germany.
german_states:
  __table__: The 16 German federal states (Bundesländer).
  bundesland_id: Identifier for the German federal state.
  nation: Country the federal state belongs to.
  name: Name of the German federal state.
  centroid: Geographic coordinates of the state centroid.
  area: Total area of the state in square kilometers.
  residents: Population of the state (most recent estimate).
  landeshauptstadt: Capital city of the state.
  creation_date: Date the state was established or re-established.
  state_code: ISO 3166-2 code of the state (e.g. DE-BY).

__database__: German states database covering Germany.
laender:
  __table__: The 16 German federal states (Bundesländer).
  state_id: Identifier for the German federal state.
  nation: Country the federal state belongs to.
  name: Name of the German federal state.
  coords: Geographic coordinates of the state centroid.
  land_area_km2: Total area of the state in square kilometers.
  pop: Population of the state (most recent estimate).
  administrative_center: Capital city of the state.
  inception: Date the state was established or re-established.
  iso: ISO 3166-2 code of the state (e.g. DE-BY).

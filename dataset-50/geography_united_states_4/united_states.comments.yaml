__database__: Geographic database covering United States, including countries, continents,
  and cities.
states:
  __table__: Sovereign countries in United States.
  country_id: Identifier for the country.
  state_name: Name of the country.
  iso2: ISO 3166-1 alpha-2 two-letter country code.
  three_letter_country_code: ISO 3166-1 alpha-3 three-letter country code.
  continent: Continent the country belongs to.
  land_area_km2: Total area of the country in square kilometers.
  inhabitants: Population of the country (most recent estimate).
  national_income_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  governmental_center: Capital city.
  official_currency: Name of the official currency.
  coords: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  country_code_phone: International telephone dialling code (e.g. +49).
  male_population: Male population count (most recent estimate).
  female_population: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  hdi: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  gini_index: Gini coefficient measuring income inequality (0–1).
  fertility_rate: Average number of children born per woman.
  natality_rate: Number of live births per 1000 inhabitants per year.
  crude_death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  median_household_income_usd: Median household or personal income in US dollars.
  eiu_democracy_index: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  national_bank: Name of the central bank.
  highest_peak: Name of the highest geographical point in the country.
  summit_height_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point in the country.
  lowest_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northern_extreme: Geographic coordinates of the northernmost point of the country.
  southernmost_coords: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_point: Geographic coordinates of the westernmost point of the country.
  demonym: Comma-separated adjectives or nouns used to describe inhabitants of the
    country.
  chief_of_state: Current head of state of the country.
  head_of_government_name: Current head of government of the country.
continents:
  __table__: Continents covering United States.
  continent: Identifier for the continent.
  landmass_name: Name of the continent.
  land_area_km2: Total land area of the continent in square kilometers.
  pop: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_point: Name of the highest geographical point on the continent.
  peak_height_m: Elevation of the highest point above sea level in meters.
  depression: Name of the lowest geographical point on the continent.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  biggest_city: Most populous urban area on the continent.
  children_out_of_school: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the continent.
  northernmost_point: Geographic coordinates of the northernmost point of the continent.
  southern_extreme: Geographic coordinates of the southernmost point of the continent.
  eastern_extreme: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
settlements:
  __table__: Cities and human settlements located in United States.
  city: Identifier for the city.
  municipality_name: Name of the city.
  nation: Country the city is located in.
  number_of_inhabitants: Population of the city (most recent estimate).
  position: Geographic coordinates of the city.
  founding_year: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  postal_code: Postal or ZIP code of the city.
  resident_name: Comma-separated adjectives or nouns used to describe inhabitants
    of the city.
  city_gdp: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  elevation: Elevation of the city above sea level in meters.
  total_area_km2: Total area of the city in square kilometers.
  vehicles_per_thousand: Number of registered motor vehicles per thousand inhabitants.

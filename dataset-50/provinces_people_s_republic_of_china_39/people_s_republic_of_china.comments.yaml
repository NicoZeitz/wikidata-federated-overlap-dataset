__database__: Provinces database covering China.
china_regions:
  __table__: Administrative divisions of China.
  province_id: Identifier for the Chinese province or administrative region.
  parent_country: Country the province belongs to.
  province_name: Name of the Chinese province or administrative region.
  lat_lon: Geographic coordinates of the province centroid.
  area: Total area of the province in square kilometers.
  pop: Population of the province (most recent estimate).
  provincial_capital: Capital city of the province.
  founded: Date the province was established.
  iso_3166_code: ISO 3166-2 code of the province (e.g. CN-HE).
  homepage: Official website of the provincial government.

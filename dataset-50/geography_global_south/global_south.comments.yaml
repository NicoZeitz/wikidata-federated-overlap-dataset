__database__: Geographic database covering Global South, including countries, continents,
  and cities.
sovereign_states:
  __table__: Sovereign countries in Global South.
  country_id: Identifier for the country.
  title: Name of the country.
  alpha3: ISO 3166-1 alpha-3 three-letter country code.
  geographic_region: Continent the country belongs to.
  area: Total area of the country in square kilometers.
  total_population: Population of the country (most recent estimate).
  national_income_usd: Nominal GDP of the country in US dollars (most recent reported
    value).
  capital: Capital city.
  currency: Name of the official currency.
  lat_lon: Geographic coordinates of the country centroid.
  inception: Date the country was founded or became independent.
  formal_name: Official name of the country in English.
  country_code_phone: International telephone dialling code (e.g. +49).
  men_population: Male population count (most recent estimate).
  women_population: Female population count (most recent estimate).
  life_expectancy: Average life expectancy at birth in years.
  development_index: Human Development Index score (0–1).
  unemployment: Unemployment rate as a percentage of the labour force.
  inequality_index: Gini coefficient measuring income inequality (0–1).
  crude_birth_rate: Number of live births per 1000 inhabitants per year.
  death_rate: Number of deaths per 1000 inhabitants per year.
  suicides_per_100k: Suicide rate per 100,000 inhabitants per year.
  average_household_income_usd: Median household or personal income in US dollars.
  political_freedom_score: Democracy Index score (0–10) from the Economist Intelligence
    Unit.
  national_bank: Name of the central bank.
  tallest_mountain: Name of the highest geographical point in the country.
  max_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_area: Name of the lowest geographical point in the country.
  nadir_elevation_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  northmost_coords: Geographic coordinates of the northernmost point of the country.
  southernmost_point: Geographic coordinates of the southernmost point of the country.
  easternmost_point: Geographic coordinates of the easternmost point of the country.
  westernmost_coords: Geographic coordinates of the westernmost point of the country.
  official_languages: Comma-separated official languages of the country.
  head_of_state: Current head of state of the country.
  head_of_government: Current head of government of the country.
geographic_regions:
  __table__: Continents covering Global South.
  identifier: Identifier for the continent.
  continent_name: Name of the continent.
  area: Total land area of the continent in square kilometers.
  population_count: Total population of the continent (most recent estimate).
  centroid: Geographic coordinates of the continent centroid.
  highest_mountain: Name of the highest geographical point on the continent.
  highest_elevation_m: Elevation of the highest point above sea level in meters.
  lowest_point: Name of the lowest geographical point on the continent.
  depression_depth_m: Elevation of the lowest point above sea level in meters (negative
    if below sea level).
  largest_urban_area: Most populous urban area on the continent.
  out_of_school_children: Estimated number of school-age children not enrolled in
    school.
  un_m49: UN M49 numeric region code assigned to the continent.
  adjectival: Comma-separated adjectives or nouns used to describe inhabitants of
    the continent.
  northernmost_point: Geographic coordinates of the northernmost point of the continent.
  southernmost_point: Geographic coordinates of the southernmost point of the continent.
  eastern_tip_coords: Geographic coordinates of the easternmost point of the continent.
  westernmost_point: Geographic coordinates of the westernmost point of the continent.
populated_places:
  __table__: Cities and human settlements located in Global South.
  settlement_id: Identifier for the city.
  locality: Name of the city.
  country: Country the city is located in.
  population_count: Population of the city (most recent estimate).
  lat_lon: Geographic coordinates of the city.
  established: Date or year the city was founded or first recorded.
  sobriquet: Comma-separated informal names or nicknames of the city.
  gentilic: Comma-separated adjectives or nouns used to describe inhabitants of the
    city.
  total_output_usd: Nominal GDP of the city in US dollars.
  average_income_usd: Per capita income of the city in US dollars.
  altitude: Elevation of the city above sea level in meters.
  area_km2: Total area of the city in square kilometers.
  car_ownership_rate: Number of registered motor vehicles per thousand inhabitants.

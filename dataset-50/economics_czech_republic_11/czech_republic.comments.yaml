__database__: Economics database covering Czech Republic, including companies.
companies:
  __table__: Business enterprises headquartered in Czech Republic.
  corporation_id: Identifier for the company.
  firm_name: Name of the company.
  home_country: Country where the company is headquartered.
  entity_types: Types or classifications of the company (comma-separated).
  business_sector: Industries the company operates in (comma-separated).
  organizational_form: Legal form or structure of the company.
  inception: Date the company was founded.
  official_website: Official website URL of the company.
  headquarters_city: City where the company is headquartered.
  chief_executive: Current chief executive officer.
  number_of_employees: Number of employees (most recent reported value).
  total_revenue_usd: Annual revenue in US dollars (most recent reported value).
  profit_usd: Net income in US dollars (most recent reported value).
  total_assets_usd: Total assets in US dollars (most recent reported value).
  operating_result_usd: Operating income in US dollars (most recent reported value).
  market_cap: Market capitalization in US dollars (most recent reported value).

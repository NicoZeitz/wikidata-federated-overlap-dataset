__database__: Provinces database covering China.
china_states:
  __table__: Administrative divisions of China.
  region_id: Identifier for the Chinese province or administrative region.
  country: Country the province belongs to.
  region_name: Name of the Chinese province or administrative region.
  centroid: Geographic coordinates of the province centroid.
  area: Total area of the province in square kilometers.
  inhabitants: Population of the province (most recent estimate).
  main_city: Capital city of the province.
  inception: Date the province was established.
  province_code: ISO 3166-2 code of the province (e.g. CN-HE).
  website: Official website of the provincial government.

      label: Label of the venue.
  country:
    description: Country the venue is located in.
    synonyms:
      nation: Country the venue is located in.
  capacity:
    description: Maximum seating capacity of the venue.
    synonyms:
      seating_capacity: Seating capacity of the venue.
      max_capacity: Maximum capacity of the venue.
      stadium_capacity: Capacity of the stadium.
  coords:
    description: Geographic coordinates of the venue.
    synonyms:
      coordinates: Geographic coordinates of the venue.
      location: Geographic location of the venue.
  inception:
    description: Date the venue was officially opened.
    synonyms:
      opening_date: Date the venue officially opened.
      opened: Year the venue was opened.
  city:
    description: City or municipality the venue is located in.
    synonyms:
      municipality: Municipality the venue is located in.
      host_city: City hosting the venue.
  occupant:
    description: Teams or organizations that regularly use the venue.
    synonyms:
      home_team: Home team of the venue.
      tenants: Tenants of the venue.
  architect:
    description: Architect who designed the venue.
    synonyms:
      designer: Person who designed the venue.
      venue_architect: Architect of the venue.

    primary_key: team
    split_col: country
    description: Football clubs that participated in recent UEFA Champions League seasons.
    synonyms:
      ucl_teams: Table of clubs that participated in recent UEFA Champions League seasons.
      cl_clubs: Table of UEFA Champions League clubs.
      champions_league_clubs: Table of clubs in the UEFA Champions League.
    foreign_keys:
      country: countries
    required:
    - name
    - founded
    - league
    - leagueTitles
    - socialFollowers
  team:
    description: Identifier for the football club.
    synonyms:
      team_id: Unique identifier for the football club.
      club_id: Unique identifier for the club.
  name:
    description: Full name of the football club.
    synonyms:
      club_name: Name of the football club.
      label: Label of the football club.
  league:
    description: Name of the domestic league the club competes in.
    synonyms:
      domestic_league: Domestic league the club plays in.
      division: Division or league the club competes in.
  country:
    description: Country the club is based in.
    synonyms:
      nation: Country the football club is based in.
      home_country: Home country of the football club.
  founded:
    description: Date or year the club was founded.
    synonyms:
      inception: Date the club was established.
      founding_date: Founding date of the club.
      established: Year the club was established.
  stadium:
    description: Name of the club's home stadium.
    synonyms:
      home_ground: Home ground of the club.
      home_stadium: Name of the home stadium.
      ground: Stadium or ground used by the club.
  coach:
    description: Name of the current head coach or manager.
    synonyms:
      head_coach: Current head coach of the club.
      manager: Current manager of the club.
  owner:
    description: Name of the current owner or ownership group.
    synonyms:
      club_owner: Owner of the football club.
      ownership: Ownership of the football club.
  nickname:
    description: Nickname or informal name of the club.
    synonyms:
      alias: Informal alias of the club.
      informal_name: Informal name used for the club.
  leagueTitles:
    description: Number of domestic league titles won by the club.
    synonyms:
      league_titles: Number of domestic league championships won.
      championships: Number of league championships.
      title_count: Total number of league titles.
  socialFollowers:
    description: Number of social media followers of the club.
    synonyms:
      social_media_followers: Number of followers on social media.
      followers: Total social media follower count.
  website:
    description: Official website URL of the club.
    synonyms:
      url: URL of the club's official website.
      official_website: Official website of the football club.
  shortName:
    description: Short or abbreviated name of the club.
    synonyms:
      abbreviation: Abbreviated name of the club.
      short_name: Short name of the club.
  founder:
    description: Name of the person or entity who founded the club.
    synonyms:
      club_founder: Founder of the football club.
      founding_person: Person who founded the club.
ucl_venues:
  __meta__:
    primary_key: venue
    split_col: country
    description: Stadiums and arenas that hosted UEFA Champions League matches.

[project]
name = "wikidata-federated-overlap-dataset"
version = "1.0.0"
description = "Federated dataset generator with overlapping redundancy from Wikidata ground truth"
requires-python = ">=3.15"
dependencies = [
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "tqdm>=4.67",
    "networkx>=3.5",
    "scipy>=1.18.1",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.1a5",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "pyqt5>=5.15.11",
    "ipympl>=0.10.0",
]

[project.scripts]
dataset-builder = "wikidata_federated_overlap_dataset.dataset_builder:main"
build-ground-truth = "wikidata_federated_overlap_dataset.build_ground_truth:main"
create-query-inputs = "wikidata_federated_overlap_dataset.create_query_inputs:main"

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wikidata_federated_overlap_dataset"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
